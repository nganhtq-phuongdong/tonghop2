<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tổng hợp 2 · 发展汉语 初级综合 I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<style>
/* ===== Giao diện sáng, tươi, chữ to theo màn hình ===== */
:root{
 --bg:#fff8ef;--card:#ffffff;--ink:#1f2333;--mute:#6b7085;--line:#efe6da;
 --red:#f0533b;--red2:#ffe9e4;--orange:#ff8a3d;--gold:#d98a00;--gold2:#fff3d6;
 --green:#16a36b;--green2:#dff7ec;--blue:#2f6fe4;--blue2:#e6efff;--purple:#7c5cf0;--purple2:#efe9ff;
 --teal:#0fa5a0;--teal2:#dcf6f4;--pink:#e2468f;--pink2:#ffe6f2;
 --shadow:0 2px 4px rgba(240,120,60,.06),0 8px 24px rgba(240,120,60,.10);
 --r:18px;
 color-scheme:light;
}
@font-face{font-family:"NumTNR";src:local("Times New Roman"),local("TimesNewRomanPSMT"),local("Tinos"),local("Liberation Serif");unicode-range:U+0030-0039}
:root{--fvi:"NumTNR","Nunito","Quicksand","KaiTi","楷体","STKaiti","Kaiti SC","LXGW WenKai",sans-serif;--fzh:var(--fvi)}
*{box-sizing:border-box}
html{font-size:clamp(17px,0.55vw + 13px,21px)}
body{margin:0;color:var(--ink);font-family:var(--fvi);line-height:1.55;-webkit-tap-highlight-color:transparent;
 background:radial-gradient(1200px 500px at 10% -10%,#ffe3d1 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#dff4ff 0%,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
.zh,.hz,.zhs,.mgrid button,.tok,.blank{font-family:var(--fzh)}
button{font:inherit;color:inherit;cursor:pointer}
.nw{white-space:nowrap}
.fit{white-space:nowrap;overflow:hidden;display:block;max-width:100%}
.wrapw{max-width:1180px;margin:0 auto}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(240,120,60,.08)}
.top{max-width:1180px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;margin-right:auto;font-size:1.15rem}
.seal{width:2.3rem;height:2.3rem;border-radius:.7rem;background:linear-gradient(135deg,#ff6a3d,#f0325b);color:#fff;display:grid;place-items:center;font-size:1.25rem;box-shadow:0 4px 12px rgba(240,60,60,.35)}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:.75rem}
.toggles{display:flex;gap:.4rem}
.tg{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.3rem .85rem;font-size:.85rem;font-weight:600;color:var(--mute)}
.tg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#tgT.on{background:var(--purple);border-color:var(--purple)}
nav.tabs{max-width:1180px;margin:0 auto;display:flex;overflow-x:auto;padding:.2rem 1rem .6rem;gap:.45rem;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{--c:var(--red);--c2:var(--red2);border:2px solid var(--c2);background:#fff;border-radius:999px;padding:.45rem 1rem;font-size:.95rem;font-weight:600;color:var(--c);white-space:nowrap;transition:all .15s}
nav.tabs button:nth-child(2){--c:var(--blue);--c2:var(--blue2)}
nav.tabs button:nth-child(3){--c:var(--purple);--c2:var(--purple2)}
nav.tabs button:nth-child(4){--c:var(--teal);--c2:var(--teal2)}
nav.tabs button:nth-child(5){--c:var(--gold);--c2:var(--gold2)}
nav.tabs button:nth-child(6){--c:var(--pink);--c2:var(--pink2)}
nav.tabs button:hover{background:var(--c2)}
nav.tabs button.act{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 35%,transparent)}

main{max-width:1180px;margin:0 auto;padding:1rem 1rem 6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:1rem 1.15rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute)} .sm{font-size:.88rem}
h2{font-size:1.3rem;margin:1.5rem 0 .6rem;display:flex;align-items:center;gap:.5rem}
h2::before{content:"";width:.45rem;height:1.3rem;border-radius:9px;background:linear-gradient(var(--orange),var(--red))}
h3{font-size:1.1rem;margin:.9rem 0 .4rem}
input[type=search],input[type=text],select,textarea{font:inherit;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:.5rem .8rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{width:100%;min-height:3.4rem;resize:vertical;font-family:var(--fzh);font-size:1.05rem}
input[type=search]{flex:1;min-width:10rem}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:.5rem 1rem;font-weight:600;font-size:.95rem}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.sm{padding:.3rem .7rem;font-size:.85rem}
.btn.pri{background:linear-gradient(135deg,#ff7a3d,#f0425b);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(240,80,60,.3)}
.btn.pri:hover{color:#fff;filter:brightness(1.05)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn:disabled{opacity:.45}
.chip{display:inline-block;font-size:.8rem;padding:.12rem .6rem;border-radius:999px;background:var(--gold2);color:var(--gold);font-weight:700}
.chip.b{background:var(--blue2);color:var(--blue)} .chip.g{background:var(--green2);color:var(--green)} .chip.r{background:var(--red2);color:var(--red)}
.spk{border:0;background:var(--blue2);color:var(--blue);border-radius:50%;width:2rem;height:2rem;font-size:.9rem;display:inline-grid;place-items:center;vertical-align:middle;flex:none}
.spk:hover{background:var(--blue);color:#fff}

/* ---------- Chọn bài & tiêu đề bài ---------- */
.lpick{display:flex;gap:.4rem;overflow-x:auto;padding:.2rem 0 .4rem;scrollbar-width:thin}
.lpick button{min-width:2.9rem;border:2px solid var(--line);background:#fff;border-radius:12px;padding:.35rem .55rem;font-weight:700;font-size:1rem;color:var(--ink)}
.lpick button.act{background:linear-gradient(135deg,#ff7a3d,#f0425b);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(240,80,60,.3)}
.lpick button:disabled{opacity:.35;cursor:not-allowed;background:#f6f1ea}
.hero{padding:1rem 1.25rem;display:flex;gap:1rem;align-items:center;margin-top:.7rem;background:linear-gradient(120deg,#fff 0%,#fff6ec 55%,#ffeede 100%);border:2px solid #ffe0cc}
.hero>div:last-child{min-width:0;flex:1}
.hero .no{font-size:3.3rem;font-weight:800;line-height:1;font-style:italic;background:linear-gradient(135deg,#ff8a3d,#f0325b);-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.hero .t{font-size:1.9rem;font-weight:700;color:var(--ink)}
.hero .py{color:var(--blue);font-size:1.05rem}
details.card summary{cursor:pointer;font-size:1rem}
.sub{display:flex;flex-wrap:wrap;gap:.45rem;margin:1rem 0 .4rem}
.sub button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.4rem .95rem;font-size:.95rem;font-weight:600;color:var(--mute)}
.sub button:hover{border-color:var(--red);color:var(--red)}
.sub button.act{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- Từ vựng ---------- */
.wl{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr))}
.w{display:grid;grid-template-columns:minmax(4.5rem,38%) minmax(0,1fr) auto;gap:.2rem .9rem;align-items:center;padding:.75rem 1rem;cursor:pointer;border-left:6px solid var(--orange);transition:transform .12s}
.w:hover{transform:translateY(-2px)}
.w .hz{font-size:2.3rem;color:var(--red);font-weight:600;min-width:0}
.w .py{color:var(--blue);font-size:1.05rem;font-weight:600}
.w .vi{font-size:1.02rem}
.w.known{border-left-color:var(--green)}
.hv{display:inline-block;font-size:.72rem;color:var(--gold);background:var(--gold2);font-weight:700;letter-spacing:.5px;padding:0 .45rem;border-radius:6px;margin-top:.15rem}

/* ---------- Bài khóa ---------- */
.line{display:grid;grid-template-columns:4.2rem 1fr auto;gap:.15rem .8rem;padding:.75rem .9rem;border-radius:14px;cursor:pointer;margin:.25rem 0;transition:background .12s}
.line:hover{background:#fff4e8}
.line.playing{background:var(--blue2);outline:3px solid var(--blue)}
.line .who{--c:var(--red);font-weight:700;color:#fff;background:var(--c);font-size:.95rem;border-radius:12px;padding:.25rem .35rem;text-align:center;align-self:start;margin-top:.25rem;box-shadow:0 3px 8px color-mix(in srgb,var(--c) 30%,transparent)}
.line.narr{grid-template-columns:1fr auto}
.line .hz{font-size:clamp(1.35rem,1.2rem + .9vw,1.9rem);line-height:1.6}
.line .py{color:var(--blue);font-size:1rem}
.line .vi{color:#4b5064;font-size:1rem}
.line > .mute{align-self:center;color:var(--orange);font-size:1.1rem}
body.no-hz .hz:not(.keep),body.no-py .py:not(.keep),body.no-vi .vi:not(.keep){filter:blur(6px);user-select:none;transition:filter .2s}
body.no-hz .hz.rv,body.no-py .py.rv,body.no-vi .vi.rv{filter:none}
.qbox{background:linear-gradient(120deg,#fff6db,#fff0e4);border:2px solid #ffe2a8;border-radius:16px;padding:.8rem 1.1rem;margin:.8rem 0}
.qbox .hz{font-size:clamp(1.2rem,1.1rem + .5vw,1.5rem)}
.ans{display:none;color:var(--green);font-size:1rem;margin-top:.3rem;font-weight:500}
.ans.on,body.teacher .ans{display:block}

/* ---------- Ngữ pháp ---------- */
.note{padding:1rem 1.2rem;margin:.8rem 0;border-left:6px solid var(--teal)}
.note b{font-size:1.1rem}
.note .f{font-family:var(--fzh);background:linear-gradient(120deg,var(--teal2),var(--blue2));color:#0b6f6b;padding:.4rem .8rem;border-radius:10px;display:inline-block;margin:.4rem 0 .6rem;font-weight:700;font-size:1.1rem}
.note .sm{font-size:1rem}
.note ul{margin:.4rem 0;padding-left:1.3rem}
.note li.warn{color:var(--red)}
.exl{display:grid;gap:.35rem;margin-top:.5rem}
.exl>div{padding:.45rem .8rem;border-left:4px solid var(--teal2);cursor:pointer;border-radius:0 10px 10px 0}
.exl>div:hover{border-color:var(--teal);background:#f2fbfa}
.exl .hz{font-size:clamp(1.2rem,1.1rem + .5vw,1.55rem)}.exl .py{font-size:.95rem;color:var(--blue)}.exl .vi{font-size:.98rem;color:#4b5064}

/* ---------- Âm thanh ---------- */
.aud{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:.4rem 0}
.aud .btn{border-color:var(--blue2);color:var(--blue);background:var(--blue2)}
.abar{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;z-index:40;background:#1f2333;color:#fff;border-radius:999px;padding:.4rem .5rem .4rem 1rem;display:flex;gap:.6rem;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.9rem;max-width:95vw}
.abar[hidden]{display:none}
#atitle{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.spds{display:flex;gap:2px}
.spd{border:0;background:none;color:#fff;opacity:.6;font-size:.8rem;padding:.2rem .35rem;border-radius:6px}
.spd.on{opacity:1;background:rgba(255,255,255,.2)}

/* ---------- Bài tập ---------- */
.ex{padding:1rem 1.2rem;margin:1rem 0;border-top:6px solid var(--pink)}
#main .ex[id^="s"]{border-top-color:var(--orange)}
.ex h3{margin:0 0 .2rem;font-size:1.2rem}
.it{padding:.6rem 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .zhs{font-size:clamp(1.25rem,1.15rem + .6vw,1.6rem);line-height:2.1}
.blank{display:inline-block;min-width:5rem;border:0;border-bottom:3px solid var(--blue);background:var(--blue2);border-radius:8px 8px 0 0;padding:.05rem .4rem;font-family:var(--fzh);font-size:1.15rem;color:var(--ink);text-align:center}
.blank.right,.inp.right{border-color:var(--green);background:var(--green2)}
.blank.wrong,.inp.wrong{border-color:var(--red);background:var(--red2)}
.inp{border:2px solid var(--line);border-bottom:3px solid var(--blue);border-radius:10px;padding:.35rem .6rem;font:inherit;font-size:1.05rem;background:#fff;color:var(--ink);width:9.5rem}
.fb{font-size:.95rem;margin-top:.2rem;font-weight:600}
.fb.good{color:var(--green)}.fb.bad{color:var(--red)}
.key{display:none;font-size:1.05rem;color:#0d7a4f;background:var(--green2);border-radius:10px;padding:.45rem .8rem;margin-top:.4rem;font-family:var(--fzh)}
.key.on,body.teacher .key{display:block}
.score{font-weight:800;color:var(--red);font-size:1.05rem}
.tok{display:inline-block;border:2px solid var(--line);background:#fff;border-radius:10px;padding:.3rem .75rem;margin:.2rem;font-family:var(--fzh);font-size:1.3rem;cursor:pointer;white-space:nowrap}
.tok:hover{border-color:var(--purple)}
.tok.used{opacity:.25;pointer-events:none}
.built{min-height:3rem;border:2px dashed #d9cdf9;background:#faf8ff;border-radius:12px;padding:.25rem;margin:.4rem 0}
.built .tok{background:var(--purple2);border-color:var(--purple);color:#4b2fc4}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.3rem,1fr));gap:.45rem;margin:.4rem 0}
.mgrid button{border:2px solid var(--line);background:#fff;border-radius:12px;font-family:var(--fzh);font-size:1.7rem;padding:.3rem 0}
.mgrid.top button{background:#fff7ee}
.mgrid button.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.mgrid button.done{background:var(--green2);border-color:var(--green);color:var(--green);pointer-events:none}
.pairs{display:flex;flex-wrap:wrap;gap:.45rem;margin:.4rem 0}
.pairs .chip.b{font-size:1.1rem;padding:.2rem .7rem}
.selfmark{display:flex;gap:.4rem;margin-top:.4rem;align-items:center}

/* ---------- Luyện tập ---------- */
.qcard{padding:1.5rem 1.2rem;text-align:center}
.qcard .big{font-size:4.2rem;font-family:var(--fzh);color:var(--red)}
.opts{display:grid;gap:.55rem;margin-top:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr))}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:.8rem 1rem;font-size:1.2rem;text-align:left}
.opt:hover{border-color:var(--blue)}
.opt.right{background:var(--green2);border-color:var(--green)}
.opt.wrong{background:var(--red2);border-color:var(--red)}
.prog{height:.5rem;background:#f1e7db;border-radius:9px;overflow:hidden;margin:.5rem 0}
.prog>div{height:100%;background:linear-gradient(90deg,#ffb23d,#f0425b)}
.qtypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:.7rem}
.qtypes button{text-align:left;padding:1rem 1.1rem;border-top:5px solid var(--gold)}
.qtypes button:nth-child(3n+2){border-top-color:var(--blue)}
.qtypes button:nth-child(3n){border-top-color:var(--purple)}
.qtypes b{display:block;font-size:1.1rem}

/* ---------- Thẻ từ ---------- */
.fc{min-height:17rem;display:grid;place-items:center;text-align:center;padding:1.5rem;cursor:pointer;user-select:none;background:linear-gradient(135deg,#fff,#f6f2ff);border:2px solid var(--purple2)}
.fc .big{font-size:5.2rem;font-family:var(--fzh);color:var(--purple)}

/* ---------- Hộp chi tiết từ ---------- */
.ov{position:fixed;inset:0;background:rgba(31,35,51,.45);z-index:50;display:grid;place-items:center;padding:1rem}
.ov[hidden]{display:none}
.sheet{width:min(46rem,100%);max-height:90vh;overflow:auto;padding:1.2rem 1.4rem;position:relative}
.x{position:absolute;right:.7rem;top:.5rem;border:0;background:var(--red2);color:var(--red);width:2.2rem;height:2.2rem;border-radius:50%;font-size:1.3rem}
.strokes{display:flex;flex-wrap:wrap;gap:.7rem;margin:.5rem 0}
.sw{width:150px;height:150px;border:2px solid #ffd5c2;border-radius:12px;background:
 linear-gradient(#ffe2d4,#ffe2d4) center/1px 100% no-repeat,linear-gradient(#ffe2d4,#ffe2d4) center/100% 1px no-repeat,#fff;display:grid;place-items:center;font-family:var(--fzh);font-size:90px;color:#c9b8ad}
table.t{border-collapse:collapse;width:100%;font-size:1rem}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:.5rem .6rem;text-align:left}
table.t tr:nth-child(even) td{background:#fffaf4}
table.t .hz{font-size:1.6rem;white-space:nowrap;color:var(--red)}
table.t .py{white-space:nowrap;color:var(--blue);font-weight:600}
table.t td.mute{white-space:nowrap}
.tone{display:inline-flex;flex-direction:column;align-items:center;border:2px solid var(--line);border-radius:14px;padding:.45rem .8rem;margin:.25rem;cursor:pointer;background:#fff}
.tone:hover{border-color:var(--orange);background:#fff7ee}
.tone .py{color:var(--blue);font-weight:700;font-size:1.1rem}.tone .zh{font-size:1.45rem}
.empty{padding:2rem;text-align:center;color:var(--mute)}
@media(max-width:600px){
 table.t td,table.t th{padding:.4rem .3rem} table.t .hz{font-size:1.35rem}
 .line{grid-template-columns:3.4rem 1fr auto}.hero .t{font-size:1.5rem}.hero .no{font-size:2.6rem}
 table.t td.mute{display:none}
 nav.tabs button{padding:.4rem .8rem}
}
@media print{header,.abar,.btn,.sub,.lpick{display:none!important}.card{box-shadow:none}body{background:#fff}}

/* ===== Màu chữ: đen cho dễ đọc; chỉ từ mới chính có màu; từ trọng điểm trong ví dụ màu mực xanh ===== */
.hero .py,.w .py,.line .py,.exl .py,.qbox .py,table.t .py,.tone .py,.py{color:#1f2333!important}
.vi,.line .vi,.exl .vi,.w .vi{color:#1f2333!important}
table.t .hz,.qcard .big,.fc .big,.note .f{color:#1f2333}
.kw{color:#1d4ed8;font-weight:700;text-decoration:underline;text-decoration-color:#93b4f5;text-underline-offset:4px}
.tglab{font-size:.8rem;color:var(--mute);align-self:center}

/* Mọi chữ nội dung dùng màu mực đậm như tiêu đề */
:root{--mute:#1f2333}
.mute,.sm,.line .vi,.exl .vi,.brand small,.line > .mute{color:#1f2333}
.line > .mute{color:var(--orange)}

#tgR{background:linear-gradient(135deg,#16a36b,#0fa5a0);color:#fff;border-color:transparent}
.spk.book{background:#ffe9d6;color:#d35400}
#rText,#paste,#roster{font-family:var(--fvi)}
.toggles{flex-wrap:wrap;justify-content:flex-end}
@media(max-width:600px){.tglab{display:none}.tg{padding:.25rem .6rem;font-size:.8rem}.toggles{width:100%;justify-content:flex-start}}

.abanner{max-width:1180px;margin:.8rem auto 0;padding:.7rem 1rem;border-radius:14px;font-size:.95rem;width:calc(100% - 2rem)}
.abanner.ok{background:#dff7ec;border:2px solid #9be0c1}
.abanner.bad{background:#fff1d6;border:2px solid #f5b94a}
.abanner[hidden]{display:none}

/* ===== Chữ to hơn: Luyện tập & Bài tập ===== */
.ex h3{font-size:1.4rem}
.ex>.sm{font-size:1.05rem}
.pairs .chip.b{font-size:1.5rem;padding:.3rem 1rem;border-radius:12px}
.it{padding:.8rem 0}
.it .zhs{font-size:clamp(1.5rem,1.3rem + .9vw,2rem);line-height:2.15}
.blank{font-size:1.45rem;min-width:6rem;padding:.1rem .5rem}
select.blank{font-size:1.35rem}
.inp{font-size:1.3rem;width:11rem;padding:.4rem .7rem}
.pairs .it .zhs{font-size:1.8rem!important}
.tok{font-size:1.7rem;padding:.35rem .9rem}
.mgrid{grid-template-columns:repeat(auto-fill,minmax(4rem,1fr))}
.mgrid button{font-size:2.2rem}
.found{font-size:1.5rem}
.fb{font-size:1.1rem}
.key{font-size:1.3rem}
textarea{font-size:1.3rem}
.ex .btn{font-size:1.05rem}
.score{font-size:1.25rem}
.qtypes b{font-size:1.3rem}.qtypes .sm{font-size:1.05rem}
.qcard{padding:2rem 1.4rem}
.qcard .big{font-size:5.6rem}
.qp{font-size:1.7rem;line-height:1.6}
.qp.zh{font-size:clamp(1.8rem,1.5rem + 1vw,2.4rem)}
.qcard .mute{font-size:1.2rem}
.opt{font-size:1.5rem;padding:1rem 1.2rem}
.opt.zh{font-size:1.75rem}
.qcard .tok{font-size:1.9rem}
#qfb{font-size:1.25rem}

.pairs .chip.bank{font-size:1.55rem;padding:.35rem 1.05rem;border-radius:12px;font-weight:600}
.qhead{font-size:1.25rem}
/* Từ trọng điểm: cùng màu cam đỏ với tiêu đề bài, không đổi font/cỡ */
.kw{color:#ee4a2c;font-weight:inherit;font-size:1em;text-decoration:none;-webkit-text-stroke:.5px #ee4a2c;paint-order:stroke fill}
/* Từ gợi ý trong ngoặc ở bài tập */
.it .chip{font-size:1.5rem;padding:.25rem .9rem;border-radius:12px;vertical-align:middle;font-weight:600;background:#fff0e6;color:#e8541f}
.selfmark[hidden]{display:none}

/* Logo Trường ĐH Phương Đông */
.brand img{display:block;image-rendering:auto}
.logo-full{height:2.6rem;width:auto}
.logo-mark{height:2.4rem;width:auto;display:none!important}
.bdiv{width:2px;height:2.2rem;background:linear-gradient(#cfe9da,#9fd3b5);border-radius:2px;margin:0 .2rem}
@media(max-width:600px){.logo-full{display:none!important}.logo-mark{display:block!important}}

.mgrid.wide{grid-template-columns:repeat(auto-fill,minmax(7rem,1fr))}
.mgrid.wide button{font-size:1.6rem;padding:.4rem .3rem}
.exImg{display:block;max-width:100%;max-height:26rem;margin:.5rem 0;border-radius:10px;border:1px solid var(--line);background:#fff}
.lpick button.rev{min-width:auto;white-space:nowrap;border-color:#2bb673;color:#14864f}.lpick button.rev.act{background:linear-gradient(135deg,#2bb673,#14864f);color:#fff}
/* long latin tokens (email, phone, long pinyin) may wrap instead of overflowing */
.zhs,.line,.line *,.t td,.py,.vi,.it{overflow-wrap:anywhere}
.t td.hz{white-space:normal}
input.blank{width:6.5em;max-width:100%;box-sizing:border-box}

</style>

 ex:[["他们的婚礼很简单。","Tāmen de hūnlǐ hěn jiǎndān.","Đám cưới của họ rất đơn giản."],["你去参加婚礼吗？","Nǐ qù cānjiā hūnlǐ ma?","Bạn đi dự đám cưới không?"]],
 tip:"婚 (hôn nhân) + 礼 (lễ) = hôn lễ. Hay đi với 参加."},
{hz:"重要",py:"zhòngyào",pos:"tính từ",vi:"quan trọng",en:"important",hv:"TRỌNG YẾU",t:1,
 ex:[["健康很重要。","Jiànkāng hěn zhòngyào.","Sức khỏe rất quan trọng."],["身体最重要。","Shēntǐ zuì zhòngyào.","Sức khỏe là quan trọng nhất."]],
 tip:"重 đọc zhòng (nặng). Hán Việt TRỌNG YẾU."},
{hz:"事情",py:"shìqing",pos:"danh từ",vi:"việc, sự việc, chuyện",en:"thing, affair, matter",hv:"SỰ TÌNH",t:1,
 ex:[["我有一件事情想问你。","Wǒ yǒu yí jiàn shìqing xiǎng wèn nǐ.","Mình có một việc muốn hỏi bạn."],["这么重要的事情，你应该告诉他。","Zhème zhòngyào de shìqing, nǐ yīnggāi gàosu tā.","Chuyện quan trọng thế này, bạn nên nói với anh ấy."]],
 tip:"Lượng từ: 一件事情. 情 đọc nhẹ (qing)."},
{hz:"特殊",py:"tèshū",pos:"tính từ",vi:"đặc biệt, khác thường",en:"special, particular",hv:"ĐẶC THÙ",t:1,
 ex:[["今天是一个特殊的日子。","Jīntiān shì yí ge tèshū de rìzi.","Hôm nay là một ngày đặc biệt."],["今天是一个特殊的日子。","Jīntiān shì yí ge tèshū de rìzi.","Hôm nay là một ngày đặc biệt."]],
 tip:"Hán Việt ĐẶC THÙ. Phân biệt: 特殊 (khác thường, không giống bình thường) – 特点 (đặc điểm) – 特别 (đặc biệt, rất)."},
// ---- Bài khóa 2
{hz:"到时候",py:"dào shíhou",pos:"cụm từ",vi:"đến lúc đó, đến khi ấy",en:"at that time, then",hv:"ĐÁO THỜI HẬU",t:2,
 ex:[["下个月我去北京，到时候我给你打电话。","Xià ge yuè wǒ qù Běijīng, dào shíhou wǒ gěi nǐ dǎ diànhuà.","Tháng sau tôi đi Bắc Kinh, đến lúc đó tôi sẽ gọi điện cho bạn."],["到时候我们一起去。","Dào shíhou wǒmen yìqǐ qù.","Đến lúc đó chúng ta cùng đi."]],
 tip:"Luôn chỉ một thời điểm trong tương lai đã được nhắc tới trước đó."},
{hz:"照相",py:"zhào xiàng",pos:"động từ",vi:"chụp ảnh",en:"take a photograph",hv:"CHIẾU TƯỚNG",t:2,
 ex:[["我帮你们照相吧。","Wǒ bāng nǐmen zhào xiàng ba.","Để mình chụp ảnh giúp các bạn nhé."],["这儿可以照相吗？","Zhèr kěyǐ zhào xiàng ma?","Ở đây có được chụp ảnh không?"]],
 tip:"Ly hợp: 照一张相, 照了相. Phân biệt 照相 (hành động chụp) và 照片 (tấm ảnh)."},
{hz:"照片",py:"zhàopiàn",pos:"danh từ",vi:"ảnh, tấm ảnh",en:"photograph, picture",hv:"CHIẾU PHIẾN",t:2,
 ex:[["这是我家的照片。","Zhè shì wǒ jiā de zhàopiàn.","Đây là ảnh gia đình tôi."],["我送他们一张照片。","Wǒ sòng tāmen yì zhāng zhàopiàn.","Tôi tặng họ một tấm ảnh."]],
 tip:"Lượng từ 张: 一张照片. 片 = mảnh, tấm."},
{hz:"有意思",py:"yǒu yìsi",pos:"cụm từ",vi:"thú vị, hay",en:"interesting",hv:"HỮU Ý TƯ",t:2,
 ex:[["这本书很有意思。","Zhè běn shū hěn yǒu yìsi.","Quyển sách này rất hay."],["学汉语很有意思。","Xué Hànyǔ hěn yǒu yìsi.","Học tiếng Trung rất thú vị."]],
 tip:"Ngược nghĩa: 没(有)意思 = chán, không hay. Có thể thêm 很: 很有意思."},
{hz:"一定",py:"yídìng",pos:"phó từ",vi:"nhất định, chắc chắn",en:"surely, certainly",hv:"NHẤT ĐỊNH",t:2,
 ex:[["你朋友一定喜欢。","Nǐ péngyou yídìng xǐhuan.","Bạn cậu chắc chắn sẽ thích."],["我一定帮你。","Wǒ yídìng bāng nǐ.","Tôi nhất định sẽ giúp bạn."]],
 tip:"一 trước thanh 4 (定) đọc thành yí. Phủ định: 不一定 (chưa chắc)."},
{hz:"亲戚",py:"qīnqi",pos:"danh từ",vi:"họ hàng, bà con",en:"relative, kinsfolk",hv:"THÂN THÍCH",t:2,
 ex:[["春节的时候我去看亲戚。","Chūn Jié de shíhou wǒ qù kàn qīnqi.","Dịp Tết tôi đi thăm họ hàng."],["我在北京有很多亲戚。","Wǒ zài Běijīng yǒu hěn duō qīnqi.","Tôi có nhiều họ hàng ở Bắc Kinh."]],
 tip:"Hán Việt THÂN THÍCH (họ hàng thân thích). 戚 đọc nhẹ (qi)."},
{hz:"麻烦",py:"máfan",pos:"tính từ",vi:"phiền phức, rắc rối",en:"troublesome, inconvenient",hv:"MA PHIỀN",t:2,
 ex:[["买东西太麻烦了。","Mǎi dōngxi tài máfan le.","Mua đồ phiền quá."],["麻烦你帮我一下。","Máfan nǐ bāng wǒ yíxià.","Phiền bạn giúp mình một chút."]],
 tip:"Còn làm động từ: 麻烦你… = làm phiền bạn… (câu nhờ vả lịch sự)."},
{hz:"给",py:"gěi",pos:"động từ",vi:"đưa, cho",en:"give",hv:"CẤP",t:2,
 ex:[["给钱比较简单。","Gěi qián bǐjiào jiǎndān.","Đưa tiền thì đơn giản hơn."],["妈妈给我一百块钱。","Māma gěi wǒ yìbǎi kuài qián.","Mẹ cho tôi một trăm tệ."]],
 tip:"给 + người + vật (giống 送). Khi đứng trước động từ khác, 给 là giới từ: 给我打电话 (gọi cho tôi)."},
{hz:"简单",py:"jiǎndān",pos:"tính từ",vi:"đơn giản",en:"simple, uncomplicated",hv:"GIẢN ĐƠN",t:2,
 ex:[["这个问题很简单。","Zhège wèntí hěn jiǎndān.","Câu hỏi này rất đơn giản."],["我们吃点儿简单的吧。","Wǒmen chī diǎnr jiǎndān de ba.","Mình ăn món gì đơn giản thôi."]],
 tip:"Hán Việt GIẢN ĐƠN — đảo lại là “đơn giản”."},
{hz:"办法",py:"bànfǎ",pos:"danh từ",vi:"cách, biện pháp",en:"method, means, way",hv:"BIỆN PHÁP",t:2,
 ex:[["这个办法很好。","Zhège bànfǎ hěn hǎo.","Cách này rất hay."],["你有什么好办法？","Nǐ yǒu shénme hǎo bànfǎ?","Bạn có cách gì hay không?"]],
 tip:"没办法 = hết cách, đành chịu. Hán Việt BIỆN PHÁP."},
// ---- Bài khóa 3
{hz:"节日",py:"jiérì",pos:"danh từ",vi:"ngày lễ, ngày hội",en:"holiday, festival",hv:"TIẾT NHẬT",t:3,
 ex:[["春节是中国最重要的节日。","Chūn Jié shì Zhōngguó zuì zhòngyào de jiérì.","Tết là ngày lễ quan trọng nhất của Trung Quốc."],["节日快乐！","Jiérì kuàilè!","Chúc ngày lễ vui vẻ!"]],
 tip:"节 = tiết (lễ tiết), 日 = ngày."},
{hz:"过",py:"guò",pos:"động từ",vi:"đón, trải qua (ngày lễ, sinh nhật)",en:"spend (time), pass (time)",hv:"QUÁ",t:3,
 ex:[["明天我过生日。","Míngtiān wǒ guò shēngrì.","Mai là sinh nhật tôi (tôi đón sinh nhật)."],["你们怎么过春节？","Nǐmen zěnme guò Chūn Jié?","Các bạn đón Tết thế nào?"]],
 tip:"过 + 生日 / 春节 / 节日 / 周末: đón, ăn (lễ). Đọc thanh 4 guò."},
{hz:"要",py:"yào",pos:"trợ động từ",vi:"phải, nên, cần",en:"must, should",hv:"YẾU",t:3,
 ex:[["去朋友家要带点儿东西。","Qù péngyou jiā yào dài diǎnr dōngxi.","Đến nhà bạn nên mang chút gì đó."],["你感冒了，要多喝水。","Nǐ gǎnmào le, yào duō hē shuǐ.","Bạn bị cảm rồi, phải uống nhiều nước."]],
 tip:"要(2) = nên, phải (≈应该). Phủ định thường dùng 不用 (không cần)."},
{hz:"带",py:"dài",pos:"động từ",vi:"mang, mang theo, đem",en:"take, bring, carry",hv:"ĐỚI",t:3,
 ex:[["我应该带什么呢？","Wǒ yīnggāi dài shénme ne?","Mình nên mang gì nhỉ?"],["你带钱了吗？","Nǐ dài qián le ma?","Bạn có mang tiền không?"]],
 tip:"带 + vật (mang theo người). 带 + người: dẫn ai đi: 我带你去."},
{hz:"束",py:"shù",pos:"lượng từ",vi:"bó (hoa)",en:"bundle, bunch",hv:"THÚC",t:3,
 ex:[["我买了一束花。","Wǒ mǎile yí shù huā.","Tôi mua một bó hoa."],["他送女朋友一束花。","Tā sòng nǚ péngyou yí shù huā.","Anh ấy tặng bạn gái một bó hoa."]],
 tip:"Hình 木 (cây) bị buộc dây ở giữa → bó. Đừng nhầm 束 với 東/东."},
{hz:"好吃",py:"hǎochī",pos:"tính từ",vi:"ngon",en:"tasty, delicious",hv:"HẢO NGẬT",t:3,
 ex:[["这个菜很好吃。","Zhège cài hěn hǎochī.","Món này rất ngon."],["带好吃的东西可以吗？","Dài hǎochī de dōngxi kěyǐ ma?","Mang đồ ăn ngon có được không?"]],
 tip:"好 + động từ = dễ…/ngon…: 好吃 (ngon), 好喝 (uống ngon), 好看 (đẹp)."},
{hz:"酒",py:"jiǔ",pos:"danh từ",vi:"rượu",en:"wine, liquor, spirits",hv:"TỬU",t:3,
 ex:[["他不喝酒。","Tā bù hē jiǔ.","Anh ấy không uống rượu."],["我带一瓶酒去吧。","Wǒ dài yì píng jiǔ qù ba.","Mình mang một chai rượu đi nhé."]],
 tip:"氵(nước) + 酉 (bình rượu) = rượu. Các từ: 啤酒 (bia), 葡萄酒 (rượu vang)."},
{hz:"当然",py:"dāngrán",pos:"phó từ",vi:"đương nhiên, tất nhiên",en:"certainly, of course",hv:"ĐƯƠNG NHIÊN",t:3,
 ex:[["当然可以。","Dāngrán kěyǐ.","Tất nhiên là được."],["他是中国人，当然会说汉语。","Tā shì Zhōngguó rén, dāngrán huì shuō Hànyǔ.","Anh ấy là người Trung Quốc, đương nhiên biết nói tiếng Trung."]],
 tip:"Hán Việt ĐƯƠNG NHIÊN. Dùng để trả lời đồng ý dứt khoát: 当然！"}
],
texts:[
{n:1, title:"Bài khóa 1 · Kể chuyện", vt:"16-1", at:"16-2", sc:"Martin có một người bạn Trung Quốc sắp cưới.",
 lines:[
 ["","马丁有一个中国朋友下个星期结婚，马丁想送他一份礼物，但是不知道送什么合适。","Mǎdīng yǒu yí ge Zhōngguó péngyou xià ge xīngqī jié hūn, Mǎdīng xiǎng sòng tā yí fèn lǐwù, dànshì bù zhīdào sòng shénme héshì.","Martin có một người bạn Trung Quốc tuần sau kết hôn. Martin muốn tặng bạn ấy một món quà nhưng không biết tặng gì cho phù hợp."],
 ["","他问了不少中国人，他们都说：“你应该问你朋友喜欢什么，想要什么。”","Tā wènle bù shǎo Zhōngguó rén, tāmen dōu shuō: “Nǐ yīnggāi wèn nǐ péngyou xǐhuan shénme, xiǎng yào shénme.”","Anh ấy hỏi khá nhiều người Trung Quốc, ai cũng nói: “Cậu nên hỏi bạn cậu xem bạn ấy thích gì, muốn gì.”"],
 ["","马丁去问朋友，他说：“我不需要你送我礼物，我希望你来参加我的婚礼。”","Mǎdīng qù wèn péngyou, tā shuō: “Wǒ bù xūyào nǐ sòng wǒ lǐwù, wǒ xīwàng nǐ lái cānjiā wǒ de hūnlǐ.”","Martin đi hỏi bạn, bạn ấy nói: “Mình không cần cậu tặng quà đâu, mình mong cậu đến dự đám cưới của mình.”"],
 ["","可是马丁觉得这么重要的事情，还是应该送一份特殊的礼物。","Kěshì Mǎdīng juéde zhème zhòngyào de shìqing, háishi yīnggāi sòng yí fèn tèshū de lǐwù.","Nhưng Martin nghĩ chuyện quan trọng như thế thì vẫn nên tặng một món quà đặc biệt."]],
 q:[["马丁的中国朋友什么时候结婚？","Mǎdīng de Zhōngguó péngyou shénme shíhou jié hūn?","Bạn Trung Quốc của Martin khi nào kết hôn?","他下个星期结婚。","Tuần sau bạn ấy kết hôn."],
    ["马丁知道他朋友想要什么礼物吗？","Mǎdīng zhīdào tā péngyou xiǎng yào shénme lǐwù ma?","Martin có biết bạn mình muốn quà gì không?","不知道。他朋友说不需要礼物，希望马丁来参加他的婚礼。","Không biết. Bạn ấy nói không cần quà, chỉ mong Martin đến dự đám cưới."]]},
{n:2, title:"Bài khóa 2 · Hội thoại", vt:"16-3", at:"16-4", sc:"Thôi Hạo (người Hàn Quốc) hỏi Martin chuẩn bị quà cưới gì.",
 lines:[
 ["崔浩","你的中国朋友结婚，你准备了什么礼物？","Nǐ de Zhōngguó péngyou jié hūn, nǐ zhǔnbèile shénme lǐwù?","Bạn Trung Quốc của cậu cưới, cậu đã chuẩn bị quà gì rồi?"],
 ["马丁","到时候，我帮他们照相，然后送他们照片。","Dào shíhou, wǒ bāng tāmen zhào xiàng, ránhòu sòng tāmen zhàopiàn.","Đến hôm đó, mình sẽ chụp ảnh giúp họ, sau đó tặng họ ảnh."],
 ["崔浩","你的礼物很有意思，你朋友一定喜欢。","Nǐ de lǐwù hěn yǒu yìsi, nǐ péngyou yídìng xǐhuan.","Quà của cậu thú vị thật, bạn cậu chắc chắn sẽ thích."],
 ["马丁","韩国人结婚的时候，你们一般送什么呢？","Hánguó rén jié hūn de shíhou, nǐmen yìbān sòng shénme ne?","Người Hàn Quốc khi cưới, các cậu thường tặng gì?"],
 ["崔浩","亲戚、朋友常常送钱，他们觉得买东西太麻烦，给钱简单。","Qīnqi, péngyou chángcháng sòng qián, tāmen juéde mǎi dōngxi tài máfan, gěi qián jiǎndān.","Họ hàng, bạn bè thường mừng tiền. Họ thấy mua đồ phiền quá, đưa tiền thì đơn giản."],
 ["马丁","这个办法也很好。","Zhège bànfǎ yě hěn hǎo.","Cách này cũng hay đấy."]],
 q:[["马丁准备了什么礼物？","Mǎdīng zhǔnbèile shénme lǐwù?","Martin đã chuẩn bị quà gì?","他帮朋友照相，然后送他们照片。","Cậu ấy chụp ảnh giúp bạn rồi tặng họ ảnh."],
    ["结婚的时候，韩国人一般送什么礼物？","Jié hūn de shíhou, Hánguó rén yìbān sòng shénme lǐwù?","Khi cưới, người Hàn Quốc thường tặng gì?","亲戚、朋友常常送钱。","Họ hàng, bạn bè thường mừng tiền."]]},
{n:3, title:"Bài khóa 3 · Hội thoại", vt:"16-5", at:"16-6", sc:"Martin hỏi Chu Vân về thói quen tặng quà của người Trung Quốc.",
 lines:[
 ["马丁","朱云，中国人一般什么时候送礼物？","Zhū Yún, Zhōngguó rén yìbān shénme shíhou sòng lǐwù?","Chu Vân ơi, người Trung Quốc thường tặng quà vào lúc nào?"],
 ["朱云","节日或者亲戚、朋友过生日、结婚的时候，中国人一般都要送礼物。","Jiérì huòzhě qīnqi, péngyou guò shēngrì, jié hūn de shíhou, Zhōngguó rén yìbān dōu yào sòng lǐwù.","Vào ngày lễ, hoặc khi họ hàng, bạn bè sinh nhật, cưới xin, người Trung Quốc thường đều phải tặng quà."],
 ["马丁","我现在要去朋友家，要带礼物吗？","Wǒ xiànzài yào qù péngyou jiā, yào dài lǐwù ma?","Bây giờ mình định đến nhà bạn, có cần mang quà không?"],
 ["朱云","不带礼物也可以。","Bú dài lǐwù yě kěyǐ.","Không mang quà cũng được."],
 ["马丁","我觉得还是带点儿东西比较好，我应该带什么呢？","Wǒ juéde háishi dài diǎnr dōngxi bǐjiào hǎo, wǒ yīnggāi dài shénme ne?","Mình nghĩ vẫn nên mang chút gì đó thì hơn. Mình nên mang gì nhỉ?"],
 ["朱云","你可以带一点儿水果，也可以带一束花。","Nǐ kěyǐ dài yìdiǎnr shuǐguǒ, yě kěyǐ dài yí shù huā.","Cậu có thể mang ít hoa quả, cũng có thể mang một bó hoa."],
 ["马丁","带好吃的东西或者酒，可以吗？","Dài hǎochī de dōngxi huòzhě jiǔ, kěyǐ ma?","Mang đồ ăn ngon hoặc rượu có được không?"],
 ["朱云","当然可以。","Dāngrán kěyǐ.","Tất nhiên là được."]],
 q:[["中国人一般什么时候送礼物？","Zhōngguó rén yìbān shénme shíhou sòng lǐwù?","Người Trung Quốc thường tặng quà khi nào?","节日或者亲戚、朋友过生日、结婚的时候。","Vào ngày lễ, hoặc khi họ hàng, bạn bè sinh nhật, kết hôn."],

{hz:"第",py:"dì",pos:"tiền tố",vi:"thứ (đặt trước số đếm chỉ thứ tự)",en:"used before integers to indicate order",hv:"ĐỆ",t:2,ex:[["请看第三课。","Qǐng kàn dì-sān kè.","Mời xem bài thứ ba."],["他住在第五层。","Tā zhù zài dì-wǔ céng.","Anh ấy ở tầng thứ năm."]],tip:"⺮ (tre) trên đầu: thẻ tre xếp theo thứ tự."},
{hz:"次",py:"cì",pos:"lượng từ",vi:"lần",en:"time, occasion",hv:"THỨ",t:2,ex:[["我去过两次上海。","Wǒ qùguo liǎng cì Shànghǎi.","Tôi đã đến Thượng Hải hai lần."],["下次见！","Xià cì jiàn!","Lần sau gặp nhé!"]],tip:"Lượng từ động lượng: 一次, 两次; 这次, 下次, 上次."},
{hz:"难",py:"nán",pos:"tính từ",vi:"khó",en:"difficult, hard",hv:"NAN",t:2,ex:[["这个问题很难。","Zhège wèntí hěn nán.","Câu hỏi này rất khó."],["汉字难写吗？","Hànzì nán xiě ma?","Chữ Hán có khó viết không?"]],tip:"难 + động từ = khó làm gì: 难学, 难写, 难懂."},
{hz:"学",py:"xué",pos:"động từ",vi:"học",en:"learn, study",hv:"HỌC",t:2,ex:[["我想学做中国菜。","Wǒ xiǎng xué zuò Zhōngguó cài.","Tôi muốn học nấu món Trung Quốc."],["他学了两年汉语。","Tā xuéle liǎng nián Hànyǔ.","Anh ấy học tiếng Trung hai năm rồi."]],tip:"学 dùng một mình hoặc trong 学习. 学 + kỹ năng: 学游泳, 学开车."},
{hz:"进步",py:"jìnbù",pos:"động từ / danh từ",vi:"tiến bộ; sự tiến bộ",en:"progress, advance, improve",hv:"TIẾN BỘ",t:3,ex:[["你的发音进步很大。","Nǐ de fāyīn jìnbù hěn dà.","Phát âm của bạn tiến bộ nhiều."],["祝你学习进步！","Zhù nǐ xuéxí jìnbù!","Chúc bạn học tập tiến bộ!"]],tip:"有进步 (có tiến bộ), 进步很快 (tiến bộ nhanh)."},
{hz:"努力",py:"nǔlì",pos:"tính từ",vi:"chăm chỉ, nỗ lực",en:"hard-working",hv:"NỖ LỰC",t:3,ex:[["她学习很努力。","Tā xuéxí hěn nǔlì.","Cô ấy học rất chăm chỉ."],["我们要努力工作。","Wǒmen yào nǔlì gōngzuò.","Chúng ta phải làm việc chăm chỉ."]],tip:"Làm trạng ngữ đứng ngay trước động từ: 努力学习."},
{hz:"发音",py:"fāyīn",pos:"danh từ",vi:"phát âm",en:"pronunciation",hv:"PHÁT ÂM",t:3,ex:[["他的发音很标准。","Tā de fāyīn hěn biāozhǔn.","Phát âm của anh ấy rất chuẩn."],["这个字怎么发音？","Zhège zì zěnme fāyīn?","Chữ này phát âm thế nào?"]],tip:"Hán Việt PHÁT ÂM — giống hệt tiếng Việt."},
{hz:"口语",py:"kǒuyǔ",pos:"danh từ",vi:"khẩu ngữ, kỹ năng nói",en:"speaking, spoken language",hv:"KHẨU NGỮ",t:3,ex:[["我每天练习口语。","Wǒ měi tiān liànxí kǒuyǔ.","Ngày nào tôi cũng luyện nói."],["他的口语比较好。","Tā de kǒuyǔ bǐjiào hǎo.","Khẩu ngữ của anh ấy khá tốt."]],tip:"口 (miệng) + 语 (lời) = ngôn ngữ nói."},
{hz:"听力",py:"tīnglì",pos:"danh từ",vi:"kỹ năng nghe",en:"listening, listening comprehension",hv:"THÍNH LỰC",t:3,ex:[["明天有听力考试。","Míngtiān yǒu tīnglì kǎoshì.","Mai có bài thi nghe."],["多听录音，听力会提高。","Duō tīng lùyīn, tīnglì huì tígāo.","Nghe băng nhiều, khả năng nghe sẽ tăng."]],tip:"听 (nghe) + 力 (sức) = sức nghe."},
{hz:"写",py:"xiě",pos:"động từ",vi:"viết",en:"write",hv:"TẢ",t:3,ex:[["请写你的名字。","Qǐng xiě nǐ de míngzi.","Hãy viết tên bạn."],["我每天写汉字。","Wǒ měi tiān xiě Hànzì.","Ngày nào tôi cũng viết chữ Hán."]],tip:"Hán Việt TẢ (miêu tả). 写信 viết thư, 写作业 làm bài tập."},
{hz:"声调",py:"shēngdiào",pos:"danh từ",vi:"thanh điệu",en:"tone",hv:"THANH ĐIỆU",t:3,ex:[["汉语有四个声调。","Hànyǔ yǒu sì ge shēngdiào.","Tiếng Trung có bốn thanh điệu."],["这个字的声调不对。","Zhège zì de shēngdiào bú duì.","Thanh điệu của chữ này không đúng."]],tip:"Hán Việt THANH ĐIỆU — y như tiếng Việt."},
{hz:"总是",py:"zǒngshì",pos:"phó từ",vi:"luôn luôn, lúc nào cũng",en:"always",hv:"TỔNG THỊ",t:3,ex:[["他总是很忙。","Tā zǒngshì hěn máng.","Anh ấy lúc nào cũng bận."],["妈妈总是第一个起床。","Māma zǒngshì dì-yī ge qǐ chuáng.","Mẹ lúc nào cũng dậy sớm nhất."]],tip:"Đứng trước động từ/tính từ, nhấn mạnh thói quen không đổi."},
{hz:"怎么",py:"zěnme",pos:"đại từ",vi:"thế nào, làm sao (hỏi cách thức)",en:"how",hv:"CHẨM MA",t:3,ex:[["去火车站怎么走？","Qù huǒchēzhàn zěnme zǒu?","Đến ga tàu đi thế nào?"],["饺子怎么包？","Jiǎozi zěnme bāo?","Sủi cảo gói thế nào?"]],tip:"怎么 + động từ: hỏi cách làm. 怎么办 = làm thế nào bây giờ."},
{hz:"办",py:"bàn",pos:"động từ",vi:"làm, xử lý, giải quyết",en:"do, handle",hv:"BIỆN",t:3,ex:[["这件事我来办。","Zhè jiàn shì wǒ lái bàn.","Việc này để tôi lo."],["你的护照办好了吗？","Nǐ de hùzhào bàn hǎo le ma?","Hộ chiếu của bạn làm xong chưa?"]],tip:"怎么办 = làm sao đây; 办公室 = văn phòng."},
{hz:"别",py:"bié",pos:"phó từ",vi:"đừng",en:"don't",hv:"BIỆT",t:3,ex:[["别着急，慢慢来。","Bié zháojí, mànmàn lái.","Đừng vội, cứ từ từ."],["上课别迟到。","Shàng kè bié chídào.","Đi học đừng đến muộn."]],tip:"别 + động từ = câu cầu khiến phủ định (= 不要)."},
{hz:"着急",py:"zháojí",pos:"tính từ",vi:"sốt ruột, lo lắng",en:"worried, anxious",hv:"TRỨ CẤP",t:3,ex:[["他很着急，因为车还没来。","Tā hěn zháojí, yīnwèi chē hái méi lái.","Anh ấy rất sốt ruột vì xe vẫn chưa đến."],["你着急什么？","Nǐ zháojí shénme?","Bạn sốt ruột gì thế?"]],tip:"着 đọc zháo ở đây. 别着急 = đừng lo."},
{hz:"更",py:"gèng",pos:"phó từ",vi:"càng, hơn nữa",en:"more, even more",hv:"CÁNH",t:3,ex:[["今天更冷了。","Jīntiān gèng lěng le.","Hôm nay càng lạnh hơn."],["我更喜欢喝茶。","Wǒ gèng xǐhuan hē chá.","Tôi thích uống trà hơn."]],tip:"更 + tính từ/động từ tâm lý: 更好, 更快, 更喜欢."}
],
texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"17-1",at:"17-2",sc:"“Chúng tôi” đến nhà thầy Lý làm khách.",
 lines:[["","今天下午我们到李老师家做客。","Jīntiān xiàwǔ wǒmen dào Lǐ lǎoshī jiā zuò kè.","Chiều nay chúng tôi đến nhà thầy Lý chơi."],
 ["","李老师的爱人给我们做了很多好吃的菜，她还教我们包饺子。","Lǐ lǎoshī de àiren gěi wǒmen zuòle hěn duō hǎochī de cài, tā hái jiāo wǒmen bāo jiǎozi.","Vợ thầy Lý nấu cho chúng tôi rất nhiều món ngon, cô còn dạy chúng tôi gói sủi cảo."],
 ["","李老师给我们买了葡萄酒和啤酒。","Lǐ lǎoshī gěi wǒmen mǎile pútaojiǔ hé píjiǔ.","Thầy Lý mua cho chúng tôi rượu vang và bia."],
 ["","大家一起喝酒、吃饭、聊天儿，非常高兴。","Dàjiā yìqǐ hē jiǔ, chī fàn, liáo tiānr, fēicháng gāoxìng.","Mọi người cùng uống rượu, ăn cơm, trò chuyện, rất vui vẻ."],
 ["","晚上十点，我们才回家。","Wǎnshang shí diǎn, wǒmen cái huí jiā.","Mười giờ tối chúng tôi mới về nhà."]],
 q:[["“我们”什么时候到李老师家做客的？","“Wǒmen” shénme shíhou dào Lǐ lǎoshī jiā zuò kè de?","“Chúng tôi” đến nhà thầy Lý làm khách lúc nào?","今天下午。","Chiều nay."],["“我们”在李老师家做什么了？","“Wǒmen” zài Lǐ lǎoshī jiā zuò shénme le?","“Chúng tôi” đã làm gì ở nhà thầy Lý?","包饺子、喝酒、吃饭、聊天儿。","Gói sủi cảo, uống rượu, ăn cơm, trò chuyện."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"17-3",at:"17-4",sc:"Các bạn đang gói sủi cảo thì thầy Lý Nhất Dân từ ngoài về.",
 lines:[["李一民","这么热闹啊，大家都来了？","Zhème rènao a, dàjiā dōu lái le?","Đông vui thế, mọi người đến cả rồi à?"],
 ["学生","李老师，我们四点半就到了。您去哪儿了？","Lǐ lǎoshī, wǒmen sì diǎn bàn jiù dào le. Nín qù nǎr le?","Thầy Lý ơi, bọn em đến từ bốn rưỡi rồi. Thầy đi đâu thế ạ?"],
 ["李一民","我去超市买酒了。你们看，我买了一瓶葡萄酒，还买了十瓶啤酒。今天星期六，大家可以多喝一点儿。我最近身体不好，不能喝酒，我多说话。","Wǒ qù chāoshì mǎi jiǔ le. Nǐmen kàn, wǒ mǎile yì píng pútaojiǔ, hái mǎile shí píng píjiǔ. Jīntiān xīngqīliù, dàjiā kěyǐ duō hē yìdiǎnr. Wǒ zuìjìn shēntǐ bù hǎo, bù néng hē jiǔ, wǒ duō shuō huà.","Thầy đi siêu thị mua rượu. Các em xem, thầy mua một chai vang, còn mua mười chai bia. Hôm nay thứ Bảy, mọi người có thể uống nhiều một chút. Dạo này thầy không khỏe, không uống được, thầy sẽ nói chuyện nhiều."],
 ["林娜","李老师，这是我第一次包饺子，您看怎么样？","Lǐ lǎoshī, zhè shì wǒ dì-yī cì bāo jiǎozi, nín kàn zěnmeyàng?","Thầy ơi, đây là lần đầu em gói sủi cảo, thầy xem thế nào ạ?"],
 ["李一民","非常好！你们觉得包饺子难学吗？","Fēicháng hǎo! Nǐmen juéde bāo jiǎozi nán xué ma?","Rất tốt! Các em thấy gói sủi cảo có khó học không?"],
 ["林娜","不难学，可是准备包饺子很麻烦。","Bù nán xué, kěshì zhǔnbèi bāo jiǎozi hěn máfan.","Không khó học, nhưng chuẩn bị để gói thì rất lích kích."]],
 q:[["李老师去超市买了什么东西？","Lǐ lǎoshī qù chāoshì mǎile shénme dōngxi?","Thầy Lý đi siêu thị mua gì?","他买了一瓶葡萄酒和十瓶啤酒。","Thầy mua một chai vang và mười chai bia."],["包饺子难学吗？","Bāo jiǎozi nán xué ma?","Gói sủi cảo có khó học không?","不难学，可是准备包饺子很麻烦。","Không khó, nhưng chuẩn bị thì lích kích."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"17-5",at:"17-6",sc:"Các bạn hỏi thầy Lý về sự tiến bộ tiếng Trung của mình.",
 lines:[["林娜","李老师，您觉得我们汉语有进步吗？","Lǐ lǎoshī, nín juéde wǒmen Hànyǔ yǒu jìnbù ma?","Thầy ơi, thầy thấy tiếng Trung của bọn em có tiến bộ không ạ?"],
 ["李一民","你们这么努力学习，当然有进步了。","Nǐmen zhème nǔlì xuéxí, dāngrán yǒu jìnbù le.","Các em học chăm như vậy, đương nhiên là có tiến bộ."],
 ["山田","我汉字没有问题，可是我发音不好。","Wǒ Hànzì méiyǒu wèntí, kěshì wǒ fāyīn bù hǎo.","Chữ Hán của em không có vấn đề gì, nhưng phát âm thì không tốt."],
 ["马丁","我口语和听力都很好，汉字也认识，但是不会写。","Wǒ kǒuyǔ hé tīnglì dōu hěn hǎo, Hànzì yě rènshi, dànshì bú huì xiě.","Nói và nghe của em đều tốt, chữ Hán cũng đọc được, nhưng không biết viết."],
 ["林娜","我的声调总是不好，应该怎么办呢？","Wǒ de shēngdiào zǒngshì bù hǎo, yīnggāi zěnme bàn ne?","Thanh điệu của em lúc nào cũng không chuẩn, nên làm thế nào ạ?"],
 ["李一民","别着急，你们平时多听、多说、多看、多写，进步一定更快。好，我们别说学习了，快来吃饭吧！","Bié zháojí, nǐmen píngshí duō tīng, duō shuō, duō kàn, duō xiě, jìnbù yídìng gèng kuài. Hǎo, wǒmen bié shuō xuéxí le, kuài lái chī fàn ba!","Đừng sốt ruột, ngày thường các em nghe nhiều, nói nhiều, đọc nhiều, viết nhiều thì chắc chắn tiến bộ nhanh hơn. Thôi, mình đừng nói chuyện học nữa, mau vào ăn cơm nào!"]],
 q:[["山田汉语有什么问题？","Shāntián Hànyǔ yǒu shénme wèntí?","Tiếng Trung của Yamada có vấn đề gì?","他发音不好。","Phát âm không tốt."],["马丁汉语怎么样？","Mǎdīng Hànyǔ zěnmeyàng?","Tiếng Trung của Martin thế nào?","他口语和听力都很好，汉字也认识，但是不会写。","Nói và nghe tốt, đọc được chữ nhưng không biết viết."],["林娜汉语有什么问题？","Línnà Hànyǔ yǒu shénme wèntí?","Tiếng Trung của Lâm Na có vấn đề gì?","她的声调总是不好。","Thanh điệu của cô ấy lúc nào cũng chưa chuẩn."]]}
],
notes:[
{k:["才"],t:"才 (1): “mới” – hành động xảy ra muộn",s:"Thời gian + 才 + V",d:"才 đặt trước động từ, cho biết người nói thấy hành động xảy ra muộn hơn mong đợi (tiếng Việt: “mới”).",n:["Câu có 才 thường không dùng 了 ở cuối: ✗他十点才起床了。","Ngược nghĩa với 就 (sớm, nhanh): 他六点就起床了。"],ex:["他九点才起床。|Tā jiǔ diǎn cái qǐ chuáng.|Chín giờ anh ấy mới dậy.","我们十点才回家。|Wǒmen shí diǎn cái huí jiā.|Mười giờ chúng tôi mới về nhà.","我六点出发，十二点才到。|Wǒ liù diǎn chūfā, shí'èr diǎn cái dào.|Tôi xuất phát lúc sáu giờ, mười hai giờ mới đến.","今天我们十二点半才下课。|Jīntiān wǒmen shí'èr diǎn bàn cái xià kè.|Hôm nay mười hai rưỡi chúng tôi mới tan học."]},
{k:["身体","工作","口语"],t:"Câu vị ngữ chủ vị",s:"S + [S₂ + P₂]",d:"Vị ngữ là một cụm chủ–vị nhỏ (S₂ + P₂) dùng để miêu tả chủ ngữ lớn: “tôi – sức khỏe không tốt”.",n:["Không thêm 的 giữa hai chủ ngữ khi muốn nhấn vào đặc điểm: 我身体不好 (tự nhiên hơn 我的身体不好 trong khẩu ngữ)."],ex:["我最近身体不好。|Wǒ zuìjìn shēntǐ bù hǎo.|Dạo này tôi không được khỏe.","李老师身体很好。|Lǐ lǎoshī shēntǐ hěn hǎo.|Thầy Lý sức khỏe rất tốt.","我工作很忙。|Wǒ gōngzuò hěn máng.|Công việc của tôi rất bận.","他口语很好。|Tā kǒuyǔ hěn hǎo.|Khẩu ngữ của anh ấy rất tốt."]},
{k:["多","难","努力"],t:"Tính từ làm trạng ngữ",s:"Adj + V",d:"Tính từ đặt trước động từ để bổ nghĩa (làm gì nhiều, làm gì khó, làm gì chăm chỉ). Tính từ một âm tiết đứng trước động từ không cần 地.",n:["多/少 + V: 多喝 (uống nhiều), 少说 (nói ít).","难/好 + V: 难学 (khó học), 好看 (đẹp)."],ex:["多喝一点儿酒。|Duō hē yìdiǎnr jiǔ.|Uống thêm chút rượu.","包饺子难学吗？|Bāo jiǎozi nán xué ma?|Gói sủi cảo có khó học không?","我们应该多说汉语。|Wǒmen yīnggāi duō shuō Hànyǔ.|Chúng ta nên nói tiếng Trung nhiều.","他们都努力学习英语。|Tāmen dōu nǔlì xuéxí Yīngyǔ.|Họ đều chăm chỉ học tiếng Anh."]},

{hz:"最少",py:"zuìshǎo",pos:"phó từ",vi:"ít nhất",en:"at least",hv:"TỐI THIỂU",t:1,ex:[["这本书最少要五十块。","Zhè běn shū zuìshǎo yào wǔshí kuài.","Quyển sách này ít nhất cũng 50 tệ."],["这本书最少要五十块。","Zhè běn shū zuìshǎo yào wǔshí kuài.","Quyển sách này ít nhất cũng năm mươi tệ."]],tip:"Ngược nghĩa: 最多 (nhiều nhất)."},
{hz:"小时",py:"xiǎoshí",pos:"danh từ",vi:"giờ, tiếng đồng hồ",en:"hour",hv:"TIỂU THỜI",t:1,ex:[["我等了半个小时。","Wǒ děngle bàn ge xiǎoshí.","Tôi đã đợi nửa tiếng."],["坐飞机要三个小时。","Zuò fēijī yào sān ge xiǎoshí.","Đi máy bay mất ba tiếng."]],tip:"Chỉ khoảng thời gian, cần lượng từ 个: 两个小时. Còn 点 chỉ thời điểm: 两点."},
{hz:"网",py:"wǎng",pos:"danh từ",vi:"mạng (Internet), lưới",en:"Internet",hv:"VÕNG",t:1,ex:[["我在网上买书。","Wǒ zài wǎng shang mǎi shū.","Tôi mua sách trên mạng."],["宿舍可以上网吗？","Sùshè kěyǐ shàng wǎng ma?","Ký túc xá có lên mạng được không?"]],tip:"上网 = lên mạng (ly hợp: 上了两个小时网)."},
{hz:"不常",py:"bù cháng",pos:"phó từ",vi:"không thường, ít khi",en:"not often",hv:"BẤT THƯỜNG",t:1,ex:[["我不常喝咖啡。","Wǒ bù cháng hē kāfēi.","Tôi ít khi uống cà phê."],["他不常给家里打电话。","Tā bù cháng gěi jiā li dǎ diànhuà.","Anh ấy ít khi gọi điện về nhà."]],tip:"不常 = ít khi; 常(常) = thường."},
{hz:"常",py:"cháng",pos:"phó từ",vi:"thường",en:"often",hv:"THƯỜNG",t:1,ex:[["我常去图书馆看书。","Wǒ cháng qù túshūguǎn kàn shū.","Tôi thường đến thư viện đọc sách."],["欢迎常来玩儿！","Huānyíng cháng lái wánr!","Hoan nghênh thường xuyên đến chơi!"]],tip:"常 = 常常 (thường xuyên)."},
{hz:"上",py:"shàng",pos:"danh từ phương vị",vi:"trên (dùng sau danh từ)",en:"on, in, at",hv:"THƯỢNG",t:1,ex:[["桌子上有一本书。","Zhuōzi shang yǒu yì běn shū.","Trên bàn có một quyển sách."],["他在网上看电影。","Tā zài wǎng shang kàn diànyǐng.","Anh ấy xem phim trên mạng."]],tip:"Danh từ + 上 (đọc nhẹ): 网上, 桌子上, 路上."},
{hz:"新闻",py:"xīnwén",pos:"danh từ",vi:"tin tức",en:"news",hv:"TÂN VĂN",t:1,ex:[["爸爸每天晚上看新闻。","Bàba měi tiān wǎnshang kàn xīnwén.","Tối nào bố cũng xem thời sự."],["今天有什么新闻？","Jīntiān yǒu shénme xīnwén?","Hôm nay có tin gì mới?"]],tip:"新 (mới) + 闻 (nghe) = tin mới nghe được."},
{hz:"另外",py:"lìngwài",pos:"liên từ",vi:"ngoài ra",en:"in addition, moreover",hv:"LÁNH NGOẠI",t:1,ex:[["我想买书，另外还想买一支笔。","Wǒ xiǎng mǎi shū, lìngwài hái xiǎng mǎi yì zhī bǐ.","Tôi muốn mua sách, ngoài ra còn muốn mua một cây bút."],["另外，明天别忘了带护照。","Lìngwài, míngtiān bié wàngle dài hùzhào.","Ngoài ra, mai đừng quên mang hộ chiếu."]],tip:"Đứng đầu vế sau để bổ sung ý."},
{hz:"查",py:"chá",pos:"động từ",vi:"kiểm tra, tra cứu",en:"check, examine",hv:"TRA",t:1,ex:[["我查一下词典。","Wǒ chá yíxià cídiǎn.","Tôi tra từ điển một chút."],["你查邮件了吗？","Nǐ chá yóujiàn le ma?","Bạn đã kiểm tra thư chưa?"]],tip:"查词典, 查邮件, 查资料."},
{hz:"邮件",py:"yóujiàn",pos:"danh từ",vi:"thư, bưu kiện; thư điện tử",en:"mail, e-mail",hv:"BƯU KIỆN",t:1,ex:[["我收到了你的邮件。","Wǒ shōudàole nǐ de yóujiàn.","Tôi nhận được thư của bạn rồi."],["请给我发邮件。","Qǐng gěi wǒ fā yóujiàn.","Hãy gửi thư cho tôi."]],tip:"电子邮件 = email."},
{hz:"聊",py:"liáo",pos:"động từ",vi:"tán gẫu, nói chuyện",en:"chat",hv:"LIÊU",t:1,ex:[["我们聊了一个晚上。","Wǒmen liáole yí ge wǎnshang.","Chúng tôi tán chuyện cả buổi tối."],["有时间来聊聊。","Yǒu shíjiān lái liáoliao.","Có thời gian thì đến nói chuyện nhé."]],tip:"聊天儿 = trò chuyện (ly hợp: 聊了一会儿天)."},
{hz:"长",py:"cháng",pos:"tính từ",vi:"dài",en:"long",hv:"TRƯỜNG",t:1,ex:[["这条河很长。","Zhè tiáo hé hěn cháng.","Con sông này rất dài."],["我等了很长时间。","Wǒ děngle hěn cháng shíjiān.","Tôi đã đợi rất lâu."]],tip:"Đọc cháng = dài; đọc zhǎng = lớn lên."},
{hz:"都",py:"dōu",pos:"phó từ",vi:"đã (nhấn mạnh thời gian đã muộn)",en:"already",hv:"ĐÔ",t:2,ex:[["都十二点了，快睡吧。","Dōu shí'èr diǎn le, kuài shuì ba.","Đã mười hai giờ rồi, mau ngủ đi."],["都八月了，天还这么热。","Dōu bā yuè le, tiān hái zhème rè.","Đã tháng tám rồi mà trời vẫn nóng thế."]],tip:"都 + thời gian + 了: “đã… rồi” (ý muộn)."},
{hz:"一直",py:"yìzhí",pos:"phó từ",vi:"suốt, liên tục, mãi",en:"continuously, always",hv:"NHẤT TRỰC",t:2,ex:[["雨一直下到晚上。","Yǔ yìzhí xià dào wǎnshang.","Mưa rơi suốt đến tối."],["我一直想去长城。","Wǒ yìzhí xiǎng qù Chángchéng.","Tôi luôn muốn đi Vạn Lý Trường Thành."]],tip:"Còn nghĩa “thẳng”: 一直往前走."},
{hz:"忘",py:"wàng",pos:"động từ",vi:"quên",en:"forget",hv:"VONG",t:2,ex:[["我忘了他的名字。","Wǒ wàngle tā de míngzi.","Tôi quên tên anh ấy rồi."],["别忘了带钥匙。","Bié wàngle dài yàoshi.","Đừng quên mang chìa khóa."]],tip:"亡 (mất) + 心 (lòng) = quên."},
{hz:"多长时间",py:"duō cháng shíjiān",pos:"cụm từ",vi:"bao lâu",en:"how long",hv:"",t:2,ex:[["你每天上多长时间网？","Nǐ měi tiān shàng duō cháng shíjiān wǎng?","Mỗi ngày bạn lên mạng bao lâu?"],["从这儿到机场要多长时间？","Cóng zhèr dào jīchǎng yào duō cháng shíjiān?","Từ đây ra sân bay mất bao lâu?"]],tip:"Dùng để hỏi khoảng thời gian (bổ ngữ thời lượng)."},
{hz:"多",py:"duō",pos:"phó từ",vi:"bao (hỏi mức độ: 多长, 多大, 多高)",en:"used in questions to indicate degree",hv:"ĐA",t:2,ex:[["你多大了？","Nǐ duō dà le?","Bạn bao nhiêu tuổi?"],["这座山多高？","Zhè zuò shān duō gāo?","Ngọn núi này cao bao nhiêu?"]],tip:"多 + tính từ đơn âm tiết = hỏi mức độ."},
{hz:"邮箱",py:"yóuxiāng",pos:"danh từ",vi:"hòm thư, hộp thư (email)",en:"mailbox, postbox",hv:"BƯU TƯƠNG",t:2,ex:[["你的邮箱地址是什么？","Nǐ de yóuxiāng dìzhǐ shì shénme?","Địa chỉ email của bạn là gì?"],["我每天都看邮箱。","Wǒ měi tiān dōu kàn yóuxiāng.","Ngày nào tôi cũng xem hộp thư."]],tip:"电子邮箱 = hộp thư điện tử."},
{hz:"发",py:"fā",pos:"động từ",vi:"gửi, phát",en:"send (out)",hv:"PHÁT",t:2,ex:[["我给妈妈发了一条短信。","Wǒ gěi māma fāle yì tiáo duǎnxìn.","Tôi gửi cho mẹ một tin nhắn."],["请把照片发给我。","Qǐng bǎ zhàopiàn fā gěi wǒ.","Hãy gửi ảnh cho tôi."]],tip:"发邮件, 发短信, 发照片."},
{hz:"网站",py:"wǎngzhàn",pos:"danh từ",vi:"trang web",en:"website",hv:"VÕNG TRẠM",t:2,ex:[["这个网站很有用。","Zhège wǎngzhàn hěn yǒuyòng.","Trang web này rất hữu ích."],["学校有自己的网站。","Xuéxiào yǒu zìjǐ de wǎngzhàn.","Trường có trang web riêng."]],tip:"网 (mạng) + 站 (trạm)."},
{hz:"一会儿",py:"yíhuìr",pos:"danh từ",vi:"một lát, một chút",en:"a moment, a little while",hv:"",t:2,ex:[["请等一会儿。","Qǐng děng yíhuìr.","Xin đợi một lát."],["我们休息一会儿吧。","Wǒmen xiūxi yíhuìr ba.","Chúng ta nghỉ một lát đi."]],tip:"Đứng trước động từ = lát nữa: 一会儿我给你打电话."},
{hz:"给",py:"gěi",pos:"giới từ",vi:"cho, tới (người nhận hành động)",en:"used to introduce the recipient of an action",hv:"CẤP",t:2,ex:[["晚上我给你打电话。","Wǎnshang wǒ gěi nǐ dǎ diànhuà.","Tối mình gọi điện cho bạn."],["他给妈妈写了一封信。","Tā gěi māma xiěle yì fēng xìn.","Anh ấy viết cho mẹ một lá thư."]],tip:"给 + người + động từ."},
{hz:"急急忙忙",py:"jíjímángmáng",pos:"tính từ",vi:"vội vội vàng vàng",en:"hurriedly, in a rush",hv:"CẤP CẤP MANG MANG",t:3,ex:[["他急急忙忙地走了。","Tā jíjímángmáng de zǒu le.","Anh ấy vội vội vàng vàng đi mất."],["你急急忙忙去哪儿？","Nǐ jíjímángmáng qù nǎr?","Bạn vội vàng đi đâu thế?"]],tip:"Dạng lặp AABB của 急忙."},
{hz:"急忙",py:"jímáng",pos:"tính từ",vi:"vội vàng",en:"in a hurry",hv:"CẤP MANG",t:3,ex:[["听到电话，他急忙跑过去。","Tīngdào diànhuà, tā jímáng pǎo guòqu.","Nghe điện thoại reo, anh ấy vội chạy tới."],["她急忙回家了。","Tā jímáng huí jiā le.","Cô ấy vội về nhà."]],tip:"急 (gấp) + 忙 (bận)."},
{hz:"交",py:"jiāo",pos:"động từ",vi:"nộp, giao",en:"hand in, hand over",hv:"GIAO",t:3,ex:[["明天要交作业。","Míngtiān yào jiāo zuòyè.","Ngày mai phải nộp bài tập."],["这个月的房费交了吗？","Zhège yuè de fángfèi jiāo le ma?","Tiền nhà tháng này nộp chưa?"]],tip:"交费, 交作业, 交朋友 (kết bạn)."},
{hz:"电话",py:"diànhuà",pos:"danh từ",vi:"điện thoại",en:"telephone",hv:"ĐIỆN THOẠI",t:3,ex:[["我给他打了个电话。","Wǒ gěi tā dǎle ge diànhuà.","Tôi gọi cho anh ấy một cuộc."],["你的电话号码是多少？","Nǐ de diànhuà hàomǎ shì duōshao?","Số điện thoại của bạn là bao nhiêu?"]],tip:"打电话 = gọi điện."},
{hz:"费",py:"fèi",pos:"danh từ",vi:"phí, tiền",en:"fee, charge, expense",hv:"PHÍ",t:3,ex:[["这个月的电费很多。","Zhège yuè de diànfèi hěn duō.","Tiền điện tháng này nhiều."],["学费多少钱？","Xuéfèi duōshao qián?","Học phí bao nhiêu tiền?"]],tip:"Ghép sau danh từ: 电话费, 水费, 学费, 房费."},
{hz:"排队",py:"pái duì",pos:"động từ",vi:"xếp hàng",en:"line up, queue up",hv:"BÀI ĐỘI",t:3,ex:[["请大家排队上车。","Qǐng dàjiā pái duì shàng chē.","Mời mọi người xếp hàng lên xe."],["买票的人都在排队。","Mǎi piào de rén dōu zài pái duì.","Người mua vé đều đang xếp hàng."]],tip:"Ly hợp: 排了半个小时队."},
{hz:"为什么",py:"wèi shénme",pos:"đại từ",vi:"tại sao",en:"why",hv:"",t:3,ex:[["你为什么不高兴？","Nǐ wèi shénme bù gāoxìng?","Sao bạn không vui?"],["他为什么没来上课？","Tā wèi shénme méi lái shàng kè?","Sao anh ấy không đến lớp?"]],tip:"Trả lời bằng 因为…"},
{hz:"开账户",py:"kāi zhànghù",pos:"cụm từ",vi:"mở tài khoản",en:"open an account",hv:"KHAI TRƯƠNG HỘ",t:3,ex:[["我想在这儿开账户。","Wǒ xiǎng zài zhèr kāi zhànghù.","Tôi muốn mở tài khoản ở đây."],["开账户要带护照。","Kāi zhànghù yào dài hùzhào.","Mở tài khoản phải mang hộ chiếu."]],tip:"开 = mở."},
{hz:"账户",py:"zhànghù",pos:"danh từ",vi:"tài khoản",en:"account",hv:"TRƯƠNG HỘ",t:3,ex:[["钱已经到你的账户了。","Qián yǐjīng dào nǐ de zhànghù le.","Tiền đã vào tài khoản của bạn."],["这是我的银行账户。","Zhè shì wǒ de yínháng zhànghù.","Đây là tài khoản ngân hàng của tôi."]],tip:"银行账户 = tài khoản ngân hàng."},
{hz:"卡",py:"kǎ",pos:"danh từ",vi:"thẻ",en:"card",hv:"KHẢ",t:3,ex:[["可以刷卡吗？","Kěyǐ shuā kǎ ma?","Có quẹt thẻ được không?"],["我的饭卡没钱了。","Wǒ de fànkǎ méi qián le.","Thẻ ăn của tôi hết tiền rồi."]],tip:"上 + 下 = 卡: tấm thẻ kẹt giữa."},
{hz:"只",py:"zhǐ",pos:"phó từ",vi:"chỉ",en:"only, just",hv:"CHỈ",t:3,ex:[["我只有十块钱。","Wǒ zhǐ yǒu shí kuài qián.","Tôi chỉ có mười tệ."],["他只喝水，不喝酒。","Tā zhǐ hē shuǐ, bù hē jiǔ.","Anh ấy chỉ uống nước, không uống rượu."]],tip:"Đọc zhǐ (phó từ). Lượng từ 只 (con vật) đọc zhī."},
{hz:"分钟",py:"fēnzhōng",pos:"danh từ",vi:"phút",en:"minute",hv:"PHÂN CHUNG",t:3,ex:[["我走十分钟就到学校。","Wǒ zǒu shí fēnzhōng jiù dào xuéxiào.","Tôi đi bộ mười phút là đến trường."],["请等五分钟。","Qǐng děng wǔ fēnzhōng.","Xin đợi năm phút."]],tip:"分钟 chỉ khoảng thời gian; 分 chỉ thời điểm: 八点十分."},
{hz:"得",py:"děi",pos:"trợ động từ",vi:"phải, cần phải",en:"must, have to",hv:"ĐẮC",t:3,ex:[["我得走了。","Wǒ děi zǒu le.","Tôi phải đi rồi."],["明天考试，今天得复习。","Míngtiān kǎoshì, jīntiān děi fùxí.","Mai thi, hôm nay phải ôn bài."]],tip:"Đọc děi khi nghĩa là “phải” (khẩu ngữ)."},
{hz:"试",py:"shì",pos:"động từ",vi:"thử",en:"try",hv:"THÍ",t:3,ex:[["我可以试试吗？","Wǒ kěyǐ shìshi ma?","Tôi thử được không?"],["你试一下这个菜。","Nǐ shì yíxià zhège cài.","Bạn thử món này xem."]],tip:"试试 / 试一下 = thử xem."}
],
texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"18-1",at:"18-2",sc:"“Tôi” kể về thói quen lên mạng hằng ngày.",
 lines:[["","我现在每天最少上两个小时的网。","Wǒ xiànzài měi tiān zuìshǎo shàng liǎng ge xiǎoshí de wǎng.","Bây giờ mỗi ngày tôi lên mạng ít nhất hai tiếng."],
 ["","我不常在网上看新闻，我常常在网上聊天儿。","Wǒ bù cháng zài wǎng shang kàn xīnwén, wǒ chángcháng zài wǎng shang liáo tiānr.","Tôi ít khi xem tin tức trên mạng, tôi thường trò chuyện trên mạng."],
 ["","另外，我每天都要去查一下邮件。","Lìngwài, wǒ měi tiān dōu yào qù chá yíxià yóujiàn.","Ngoài ra, ngày nào tôi cũng phải kiểm tra thư một chút."],
 ["","我跟父母、朋友都是在网上聊天儿，我们每次都聊很长时间，网上聊天儿真是太方便了。","Wǒ gēn fùmǔ, péngyou dōu shì zài wǎng shang liáo tiānr, wǒmen měi cì dōu liáo hěn cháng shíjiān, wǎng shang liáo tiānr zhēn shì tài fāngbiàn le.","Tôi nói chuyện với bố mẹ, bạn bè đều qua mạng, lần nào cũng nói rất lâu, trò chuyện trên mạng thật là tiện quá."]],
 q:[["“我”每天要上多长时间的网？","“Wǒ” měi tiān yào shàng duō cháng shíjiān de wǎng?","“Tôi” mỗi ngày lên mạng bao lâu?","最少两个小时。","Ít nhất hai tiếng."],["“我”一般上网做什么？","“Wǒ” yìbān shàng wǎng zuò shénme?","“Tôi” thường lên mạng làm gì?","聊天儿，查邮件。","Trò chuyện, kiểm tra thư."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"18-3",at:"18-4",sc:"Lâm Na thấy A Minh ăn tối muộn.",
 lines:[["林娜","都九点了，你怎么才吃晚饭？","Dōu jiǔ diǎn le, nǐ zěnme cái chī wǎnfàn?","Chín giờ rồi, sao giờ cậu mới ăn tối?"],
 ["阿明","我一直上网，忘了吃饭。","Wǒ yìzhí shàng wǎng, wàngle chī fàn.","Mình lên mạng suốt, quên cả ăn."],
 ["林娜","你上了多长时间的网？","Nǐ shàngle duō cháng shíjiān de wǎng?","Cậu lên mạng bao lâu rồi?"],

 ["山田","我有中国银行的卡，可以开网上银行账户吗？","Wǒ yǒu Zhōngguó Yínháng de kǎ, kěyǐ kāi wǎngshàng yínháng zhànghù ma?","Mình có thẻ của Ngân hàng Trung Quốc, mở tài khoản trực tuyến được không?"],

{k:["四个小时","八个小时","两年","一个小时","一年","多长时间"],t:"Bổ ngữ thời lượng (时量补语)",s:"V + 了 + thời lượng (+ 的) + O　|　V + O + V + 了 + thời lượng",d:"Bổ ngữ thời lượng cho biết hành động/trạng thái kéo dài bao lâu, hỏi bằng 多长时间. Khi có tân ngữ là danh từ: đặt thời lượng giữa động từ và tân ngữ (的 có thể bỏ), hoặc lặp lại động từ.",n:["Sai: 我看了电视一个小时。 → Đúng: 我看了一个小时（的）电视。/ 我看电视看了一个小时。","Có 了 ở cuối câu: hành động vẫn đang tiếp diễn: 我学了一年汉语了 (đến nay đã một năm, còn học tiếp)."],ex:["我来了一个月了。|Wǒ láile yí ge yuè le.|Tôi đến được một tháng rồi.","我睡了八个小时。|Wǒ shuìle bā ge xiǎoshí.|Tôi ngủ tám tiếng.","我上了一个小时（的）网。|Wǒ shàngle yí ge xiǎoshí (de) wǎng.|Tôi lên mạng một tiếng.","我学汉语学了一年了。|Wǒ xué Hànyǔ xuéle yì nián le.|Tôi học tiếng Trung được một năm rồi.","你看电视看了多长时间？|Nǐ kàn diànshì kànle duō cháng shíjiān?|Bạn xem ti vi bao lâu?"]},
{k:["一星期","两年","三天"],t:"来/去 + thời lượng",s:"来 / 去 + (nơi chốn) + thời lượng + 了",d:"来, 去 không phải hành động kéo dài; thời lượng sau chúng chỉ thời gian từ lúc đến/đi tới lúc nói. Có tân ngữ chỉ nơi chốn thì thời lượng đặt sau tân ngữ.",n:["Sai: 他来了中国两年。 → Đúng: 他来中国两年了。"],ex:["我来一星期了。|Wǒ lái yì xīngqī le.|Tôi đến được một tuần rồi.","我来中国两年了。|Wǒ lái Zhōngguó liǎng nián le.|Tôi sang Trung Quốc được hai năm rồi.","他去上海三天了。|Tā qù Shànghǎi sān tiān le.|Anh ấy đi Thượng Hải được ba ngày rồi."]},

{hz:"内容",py:"nèiróng",pos:"danh từ",vi:"nội dung",en:"content",hv:"NỘI DUNG",t:3,ex:[["这个电影的内容很简单。","Zhège diànyǐng de nèiróng hěn jiǎndān.","Nội dung bộ phim này rất đơn giản."],["今天上课的内容是什么？","Jīntiān shàng kè de nèiróng shì shénme?","Nội dung buổi học hôm nay là gì?"]],tip:"Hán Việt NỘI DUNG — giống tiếng Việt."},

texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"19-1",at:"19-2",sc:"Lò sưởi trong phòng “tôi” bị hỏng.",
 lines:[["","我房间里的暖气坏了，房间里特别冷。","Wǒ fángjiān li de nuǎnqì huài le, fángjiān li tèbié lěng.","Lò sưởi trong phòng tôi hỏng rồi, trong phòng lạnh khủng khiếp."],
 ["","我穿上棉衣，戴上手套、帽子，可是还觉得冷，后来我只好打开了空调。","Wǒ chuānshang miányī, dàishang shǒutào, màozi, kěshì hái juéde lěng, hòulái wǒ zhǐhǎo dǎkāile kōngtiáo.","Tôi mặc áo bông, đeo găng tay, đội mũ mà vẫn thấy lạnh, sau đó đành bật điều hòa."],
 ["","我给房东打了电话，他说找人来修。","Wǒ gěi fángdōng dǎle diànhuà, tā shuō zhǎo rén lái xiū.","Tôi gọi điện cho chủ nhà, ông ấy nói sẽ tìm người đến sửa."],
 ["","我等了两个星期，也没看见一个人来。","Wǒ děngle liǎng ge xīngqī, yě méi kànjiàn yí ge rén lái.","Tôi đợi hai tuần cũng chẳng thấy ai đến."],
 ["","暖气到现在还没修好，我房间里还是那么冷。","Nuǎnqì dào xiànzài hái méi xiū hǎo, wǒ fángjiān li háishi nàme lěng.","Lò sưởi đến giờ vẫn chưa sửa xong, phòng tôi vẫn lạnh như thế."]],
 q:[["“我”的房间里为什么特别冷？","“Wǒ” de fángjiān li wèi shénme tèbié lěng?","Vì sao phòng “tôi” lạnh khủng khiếp?","因为暖气坏了。","Vì lò sưởi hỏng."],["暖气两个星期以后修好了吗？","Nuǎnqì liǎng ge xīngqī yǐhòu xiū hǎo le ma?","Hai tuần sau lò sưởi sửa xong chưa?","没有，到现在还没修好。","Chưa, đến giờ vẫn chưa sửa xong."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"19-3",at:"19-4",sc:"Yamada gọi điện cho chủ nhà – ông Trương.",
 lines:[["山田","您是张先生吗？","Nín shì Zhāng xiānsheng ma?","Ông có phải ông Trương không ạ?"],
 ["张先生","我是。","Wǒ shì.","Tôi đây."],
 ["山田","上次您说找人来修暖气，两天就能修好。现在两个星期过去了，怎么还没来人修呢？","Shàng cì nín shuō zhǎo rén lái xiū nuǎnqì, liǎng tiān jiù néng xiū hǎo. Xiànzài liǎng ge xīngqī guòqu le, zěnme hái méi lái rén xiū ne?","Lần trước ông nói tìm người đến sửa lò sưởi, hai ngày là sửa xong. Giờ hai tuần trôi qua rồi, sao vẫn chưa có ai đến sửa?"],
 ["张先生","真的很抱歉，这次我保证圣诞节以前一定修好。","Zhēn de hěn bàoqiàn, zhè cì wǒ bǎozhèng Shèngdàn Jié yǐqián yídìng xiū hǎo.","Thật sự rất xin lỗi, lần này tôi cam đoan trước Giáng sinh nhất định sửa xong."],
 ["山田","什么？还要一个星期呀！","Shénme? Hái yào yí ge xīngqī ya!","Sao cơ? Còn phải một tuần nữa à!"]],
 q:[["房东说暖气什么时候可以修好？","Fángdōng shuō nuǎnqì shénme shíhou kěyǐ xiū hǎo?","Chủ nhà nói khi nào sửa xong lò sưởi?","圣诞节以前。","Trước Giáng sinh."],["现在到暖气修好还要多长时间？","Xiànzài dào nuǎnqì xiū hǎo hái yào duō cháng shíjiān?","Từ giờ đến khi sửa xong còn bao lâu?","还要一个星期。","Còn một tuần nữa."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"19-5",at:"19-6",sc:"Thôi Hạo hỏi Yamada về cuốn sách cho mượn.",
 lines:[["崔浩","山田，我的那本书你看完了没有？","Shāntián, wǒ de nà běn shū nǐ kànwánle méiyǒu?","Yamada, quyển sách của mình cậu đọc xong chưa?"],
 ["山田","已经看完了。昨天我还想，今天还给你，可是来的时候着急，忘带了。","Yǐjīng kànwán le. Zuótiān wǒ hái xiǎng, jīntiān huán gěi nǐ, kěshì lái de shíhou zháojí, wàng dài le.","Đọc xong rồi. Hôm qua mình còn định hôm nay trả cậu, nhưng lúc đi vội quá, quên mang."],
 ["崔浩","不是我看，是我朋友要看。你觉得那本书怎么样？","Bú shì wǒ kàn, shì wǒ péngyou yào kàn. Nǐ juéde nà běn shū zěnmeyàng?","Không phải mình đọc, là bạn mình muốn đọc. Cậu thấy quyển đó thế nào?"],
 ["山田","我认为那本书很容易读，书的内容也非常有意思。","Wǒ rènwéi nà běn shū hěn róngyì dú, shū de nèiróng yě fēicháng yǒu yìsi.","Mình cho rằng quyển đó rất dễ đọc, nội dung cũng rất thú vị."],
 ["崔浩","我也这样认为。我真想再看一遍，可是现在没时间，以后有了时间，我一定再看一遍。","Wǒ yě zhèyàng rènwéi. Wǒ zhēn xiǎng zài kàn yí biàn, kěshì xiànzài méi shíjiān, yǐhòu yǒule shíjiān, wǒ yídìng zài kàn yí biàn.","Mình cũng nghĩ vậy. Mình rất muốn đọc lại một lượt, nhưng giờ không có thời gian, sau này có thời gian nhất định sẽ đọc lại."],
 ["山田","明天有人去我家修暖气，我不能来学校，后天我还给你，行吗？","Míngtiān yǒu rén qù wǒ jiā xiū nuǎnqì, wǒ bù néng lái xuéxiào, hòutiān wǒ huán gěi nǐ, xíng ma?","Mai có người đến nhà mình sửa lò sưởi, mình không đến trường được, ngày kia mình trả cậu, được không?"],
 ["崔浩","行。","Xíng.","Được."]],
 q:[["那本书是谁的？","Nà běn shū shì shéi de?","Quyển sách đó của ai?","是崔浩的。","Của Thôi Hạo."],["山田看完那本书了吗？","Shāntián kànwán nà běn shū le ma?","Yamada đọc xong quyển sách đó chưa?","已经看完了。","Đã đọc xong rồi."],["山田觉得那本书怎么样？","Shāntián juéde nà běn shū zěnmeyàng?","Yamada thấy quyển sách đó thế nào?","很容易读，内容也非常有意思。","Rất dễ đọc, nội dung cũng rất thú vị."]]}
],
notes:[
{k:["只好"],t:"只好: đành phải",s:"(S) + 只好 + V",d:"只好 là phó từ, cho biết không còn lựa chọn nào khác, buộc phải làm như vậy.",n:["只好 đứng trước động từ, sau chủ ngữ: 我只好…, không đặt trước chủ ngữ."],ex:["我不会说法语，只好说英语。|Wǒ bú huì shuō Fǎyǔ, zhǐhǎo shuō Yīngyǔ.|Tôi không biết tiếng Pháp, đành nói tiếng Anh.","他没来，我只好一个人去。|Tā méi lái, wǒ zhǐhǎo yí ge rén qù.|Anh ấy không đến, tôi đành đi một mình.","我感冒了，只好在家休息。|Wǒ gǎnmào le, zhǐhǎo zài jiā xiūxi.|Tôi bị cảm, đành ở nhà nghỉ."]},
{k:["给"],t:"Giới từ 给: dẫn ra người nhận",s:"S + 给 + người + V + O",d:"给 là giới từ, giới thiệu người nhận/được hưởng hành động. Cụm 给 + người đặt trước động từ.",n:["Sai: 我打电话给房东了 (vẫn dùng được trong khẩu ngữ) — chuẩn: 我给房东打了电话。"],ex:["我给妈妈买了一件衣服。|Wǒ gěi māma mǎile yí jiàn yīfu.|Tôi mua cho mẹ một bộ quần áo.","我给你发电子邮件。|Wǒ gěi nǐ fā diànzǐ yóujiàn.|Tôi gửi email cho bạn.","我给房东打了电话。|Wǒ gěi fángdōng dǎle diànhuà.|Tôi đã gọi điện cho chủ nhà."]},
{k:["好","上","见","开","完","给","修好","穿上","看见","打开","看完","还给","做好","戴上","吃完"],t:"Bổ ngữ kết quả (1): 好 / 上 / 见 / 开 / 完 / 给",s:"V + 好/上/见/开/完/给　|　Phủ định: 没(有) + V + bổ ngữ",d:"Động từ hoặc tính từ đặt sau động từ để nói kết quả của hành động. V+好: làm xong, tốt (修好, 准备好); V+上: gắn vào, khép lại (穿上, 戴上, 关上); V+见: nhận biết bằng giác quan (看见, 听见); V+开: mở ra (打开); V+完: xong, hết (看完, 吃完); V+给: chuyển đến người nhận (还给, 送给).",n:["Phủ định dùng 没(有), không dùng 不: ✗不修好 → ✓没修好.","Tân ngữ đặt sau bổ ngữ: 看完了这本书 (không nói ✗看这本书完)."],ex:["晚饭已经做好了。|Wǎnfàn yǐjīng zuò hǎo le.|Cơm tối đã nấu xong rồi.","外边很冷，一定要戴上帽子。|Wàibian hěn lěng, yídìng yào dàishang màozi.|Ngoài trời rất lạnh, nhất định phải đội mũ.","我昨天看见他了。|Wǒ zuótiān kànjiàn tā le.|Hôm qua tôi đã nhìn thấy anh ấy.","我们没打开空调。|Wǒmen méi dǎkāi kōngtiáo.|Chúng tôi không bật điều hòa.","我吃完晚饭去你家。|Wǒ chīwán wǎnfàn qù nǐ jiā.|Tôi ăn xong cơm tối thì đến nhà bạn.","这本书我还没还给他呢。|Zhè běn shū wǒ hái méi huán gěi tā ne.|Quyển sách này tôi vẫn chưa trả cho anh ấy."]},
{k:["遍"],t:"Động lượng từ 遍",s:"V + 了 + số + 遍 (+ O)",d:"遍 chỉ toàn bộ quá trình hành động từ đầu đến cuối: đọc/nghe/nói “một lượt”.",n:["次 chỉ số lần nói chung; 遍 nhấn mạnh làm trọn vẹn từ đầu đến cuối."],ex:["这本书我看了两遍。|Zhè běn shū wǒ kànle liǎng biàn.|Quyển sách này tôi đọc hai lượt.","请你再说一遍。|Qǐng nǐ zài shuō yí biàn.|Bạn nói lại một lần nữa nhé.","老师说，我们再听一遍生词。|Lǎoshī shuō, wǒmen zài tīng yí biàn shēngcí.|Thầy nói chúng ta nghe lại từ mới một lượt."]}
],
gex:[
 {q:"没有车了，我们___走路回去。|Méiyǒu chē le, wǒmen ___ zǒu lù huíqu.|Hết xe rồi, chúng ta đành đi bộ về.",o:["只好","只有","一定","已经"],a:0,e:"只好 = đành phải."},
 {q:"我___朋友写了一封信。|Wǒ ___ péngyou xiěle yì fēng xìn.|Tôi viết cho bạn một lá thư.",o:["给","对","跟","在"],a:0,e:"给 + người nhận + V."},
 {q:"作业你做___了吗？|Zuòyè nǐ zuò ___ le ma?|Bài tập bạn làm xong chưa?",o:["完","见","开","上"],a:0,e:"V + 完 = làm xong."},
 {q:"你听___了吗？有人叫你。|Nǐ tīng ___ le ma? Yǒu rén jiào nǐ.|Bạn nghe thấy chưa? Có người gọi bạn.",o:["见","完","好","开"],a:0,e:"V + 见 = cảm nhận được bằng giác quan."},
 {q:"外边冷，穿___大衣吧。|Wàibian lěng, chuān ___ dàyī ba.|Ngoài trời lạnh, mặc áo khoác vào đi.",o:["上","开","见","给"],a:0,e:"穿上 = mặc vào."},
 {q:"电脑还___修好。|Diànnǎo hái ___ xiū hǎo.|Máy tính vẫn chưa sửa xong.",o:["没","不","别","没有了"],a:0,e:"Phủ định bổ ngữ kết quả dùng 没."},
 {q:"这个课文我读了三___。|Zhège kèwén wǒ dúle sān ___.|Bài khóa này tôi đọc ba lượt.",o:["遍","个","本","天"],a:0,e:"遍: lượt (từ đầu đến cuối)."},
 {q:"这本书看完了，我还___你吧。|Zhè běn shū kànwán le, wǒ huán ___ nǐ ba.|Đọc xong rồi, tôi trả lại cho bạn nhé.",o:["给","见","完","上"],a:0,e:"还给 = trả lại cho."}
],

read:{h:"八、阅读短文 · Đọc đoạn văn",p:[["汉思来北京已经三个月了，他一直在留学生宿舍住。","Hànsī lái Běijīng yǐjīng sān ge yuè le, tā yìzhí zài liúxuéshēng sùshè zhù.","Hans đến Bắc Kinh đã ba tháng, cậu ấy luôn ở ký túc xá lưu học sinh."],["住宿舍，上课很方便。可是两个人住一个房间，他觉得不舒服，也不方便。","Zhù sùshè, shàng kè hěn fāngbiàn. Kěshì liǎng ge rén zhù yí ge fángjiān, tā juéde bù shūfu, yě bù fāngbiàn.","Ở ký túc xá đi học rất tiện. Nhưng hai người ở một phòng, cậu ấy thấy không thoải mái, cũng bất tiện."],["他决定出去租房子住，但是到哪儿去找合适的房子呢？","Tā juédìng chūqu zū fángzi zhù, dànshì dào nǎr qù zhǎo héshì de fángzi ne?","Cậu quyết định ra ngoài thuê nhà, nhưng tìm nhà phù hợp ở đâu đây?"],["上星期他去看了几套房子，都不太满意。","Shàng xīngqī tā qù kànle jǐ tào fángzi, dōu bú tài mǎnyì.","Tuần trước cậu đi xem mấy căn, đều không ưng lắm."],["有的房子不错，但是离学校太远，没有公共汽车；有的房子交通方便，但是房租太贵。","Yǒu de fángzi búcuò, dànshì lí xuéxiào tài yuǎn, méiyǒu gōnggòng qìchē; yǒu de fángzi jiāotōng fāngbiàn, dànshì fángzū tài guì.","Có căn khá tốt nhưng xa trường quá, không có xe buýt; có căn đi lại thuận tiện nhưng tiền thuê đắt quá."],["他都找了一个星期了，还是没有找到合适的房子。","Tā dōu zhǎole yí ge xīngqī le, háishi méiyǒu zhǎodào héshì de fángzi.","Cậu tìm cả tuần rồi mà vẫn chưa tìm được nhà phù hợp."]],gl:[["舒服","shūfu","thoải mái"],["决定","juédìng","quyết định"],["公共汽车","gōnggòng qìchē","xe buýt"],["交通","jiāotōng","giao thông"],["满意","mǎnyì","hài lòng"],["房租","fángzū","tiền thuê nhà"]]},

{hz:"有名",py:"yǒumíng",pos:"tính từ",vi:"nổi tiếng",en:"well-known, famous",hv:"HỮU DANH",t:1,ex:[["他是一个有名的作家。","Tā shì yí ge yǒumíng de zuòjiā.","Ông ấy là một nhà văn nổi tiếng."],["这儿的烤鸭很有名。","Zhèr de kǎoyā hěn yǒumíng.","Vịt quay ở đây rất nổi tiếng."]],tip:"有 (có) + 名 (tên tuổi)."},
{hz:"外国",py:"wàiguó",pos:"danh từ",vi:"nước ngoài",en:"foreign country",hv:"NGOẠI QUỐC",t:1,ex:[["我们班有很多外国学生。","Wǒmen bān yǒu hěn duō wàiguó xuésheng.","Lớp chúng tôi có nhiều sinh viên nước ngoài."],["你去过外国吗？","Nǐ qùguo wàiguó ma?","Bạn đã ra nước ngoài chưa?"]],tip:"外国人 = người nước ngoài."},
{hz:"坐",py:"zuò",pos:"động từ",vi:"ngồi",en:"sit, take a seat",hv:"TỌA",t:1,ex:[["请坐！","Qǐng zuò!","Mời ngồi!"],["他坐在我旁边。","Tā zuò zài wǒ pángbiān.","Anh ấy ngồi cạnh tôi."]],tip:"Còn nghĩa “đi (phương tiện)”: 坐车, 坐飞机."},
{hz:"热",py:"rè",pos:"tính từ",vi:"nóng",en:"hot",hv:"NHIỆT",t:1,ex:[["今天天气很热。","Jīntiān tiānqì hěn rè.","Hôm nay trời rất nóng."],["我想喝点儿热水。","Wǒ xiǎng hē diǎnr rè shuǐ.","Tôi muốn uống chút nước nóng."]],tip:"Ngược nghĩa 冷."},
{hz:"舒服",py:"shūfu",pos:"tính từ",vi:"dễ chịu, thoải mái",en:"comfortable",hv:"THƯ PHỤC",t:1,ex:[["这把椅子坐着很舒服。","Zhè bǎ yǐzi zuòzhe hěn shūfu.","Ngồi chiếc ghế này rất thoải mái."],["我有点儿不舒服。","Wǒ yǒudiǎnr bù shūfu.","Tôi hơi khó chịu trong người."]],tip:"不舒服 cũng có nghĩa là bị mệt, ốm nhẹ."},
{hz:"服务员",py:"fúwùyuán",pos:"danh từ",vi:"nhân viên phục vụ",en:"waiter, waitress",hv:"PHỤC VỤ VIÊN",t:2,ex:[["服务员，请给我菜单。","Fúwùyuán, qǐng gěi wǒ càidān.","Phục vụ ơi, cho tôi thực đơn."],["她在饭馆当服务员。","Tā zài fànguǎn dāng fúwùyuán.","Cô ấy làm phục vụ ở nhà hàng."]],tip:"Hán Việt PHỤC VỤ VIÊN."},
{hz:"欢迎",py:"huānyíng",pos:"động từ",vi:"hoan nghênh, chào đón",en:"welcome",hv:"HOAN NGHÊNH",t:2,ex:[["欢迎你来中国！","Huānyíng nǐ lái Zhōngguó!","Chào mừng bạn đến Trung Quốc!"],["大家都很欢迎他。","Dàjiā dōu hěn huānyíng tā.","Mọi người đều rất chào đón anh ấy."]],tip:"欢迎光临 = hân hạnh chào đón quý khách."},
{hz:"光临",py:"guānglín",pos:"động từ",vi:"đến (cách nói lịch sự)",en:"be present",hv:"QUANG LÂM",t:2,ex:[["欢迎光临！","Huānyíng guānglín!","Kính chào quý khách!"],["谢谢光临，欢迎再来！","Xièxie guānglín, huānyíng zài lái!","Cảm ơn quý khách, hẹn gặp lại!"]],tip:"Lời chào của cửa hàng, nhà hàng."},
{hz:"外边",py:"wàibian",pos:"danh từ",vi:"bên ngoài",en:"out there, outside",hv:"NGOẠI BIÊN",t:2,ex:[["外边下雨了。","Wàibian xià yǔ le.","Bên ngoài mưa rồi."],["我们去外边走走吧。","Wǒmen qù wàibian zǒuzou ba.","Mình ra ngoài đi dạo chút đi."]],tip:"Ngược nghĩa 里边."},
{hz:"满",py:"mǎn",pos:"tính từ",vi:"đầy, kín",en:"full, filled, packed",hv:"MÃN",t:2,ex:[["杯子里的水满了。","Bēizi li de shuǐ mǎn le.","Nước trong cốc đầy rồi."],["电影院坐满了人。","Diànyǐngyuàn zuòmǎnle rén.","Rạp chiếu phim kín người."]],tip:"V + 满 = làm cho đầy: 坐满, 装满."},
{hz:"比萨饼",py:"bǐsàbǐng",pos:"danh từ",vi:"bánh pizza",en:"pizza",hv:"",t:2,ex:[["我们要一个大比萨饼。","Wǒmen yào yí ge dà bǐsàbǐng.","Chúng tôi lấy một cái pizza to."],["孩子们都喜欢吃比萨饼。","Háizimen dōu xǐhuan chī bǐsàbǐng.","Trẻ con đều thích ăn pizza."]],tip:"比萨 phiên âm từ “pizza”; 饼 = bánh."},
{hz:"别的",py:"biéde",pos:"đại từ",vi:"khác, cái khác",en:"other, else",hv:"BIỆT ĐÍCH",t:2,ex:[["你还要别的吗？","Nǐ hái yào biéde ma?","Bạn còn cần gì khác không?"],["我们去别的地方看看。","Wǒmen qù biéde dìfang kànkan.","Mình đi chỗ khác xem."]],tip:"别的 + danh từ: 别的人, 别的东西."},
{hz:"来",py:"lái",pos:"động từ",vi:"lấy, gọi (thay cho động từ cụ thể)",en:"want (used as a substitute for a more specific verb)",hv:"LAI",t:2,ex:[["来一杯咖啡。","Lái yì bēi kāfēi.","Cho một cốc cà phê."],["再来两碗米饭。","Zài lái liǎng wǎn mǐfàn.","Lấy thêm hai bát cơm."]],tip:"Hay dùng khi gọi món: 来 + số lượng + món."},
{hz:"面条",py:"miàntiáo",pos:"danh từ",vi:"mì sợi",en:"noodles",hv:"MIẾN ĐIỀU",t:2,ex:[["我早饭吃了一碗面条。","Wǒ zǎofàn chīle yì wǎn miàntiáo.","Bữa sáng tôi ăn một bát mì."],["北方人喜欢吃面条。","Běifāng rén xǐhuan chī miàntiáo.","Người phương Bắc thích ăn mì."]],tip:"面 (bột mì) + 条 (sợi)."},
{hz:"可乐",py:"kělè",pos:"danh từ",vi:"cola, coca",en:"cola, coke",hv:"KHẢ LẠC",t:2,ex:[["我要一杯可乐。","Wǒ yào yì bēi kělè.","Tôi lấy một cốc cola."],["可乐太甜了。","Kělè tài tián le.","Cola ngọt quá."]],tip:"Phiên âm từ “cola”: 可口可乐 = Coca-Cola."},
{hz:"走",py:"zǒu",pos:"động từ",vi:"đi, rời đi",en:"leave, go away",hv:"TẨU",t:2,ex:[["时间不早了，我得走了。","Shíjiān bù zǎo le, wǒ děi zǒu le.","Muộn rồi, tôi phải đi đây."],["他把书带走了。","Tā bǎ shū dàizǒu le.","Anh ấy mang sách đi rồi."]],tip:"V + 走 = mang/chuyển đi khỏi chỗ cũ: 带走, 搬走, 拿走."},
{hz:"好的",py:"hǎo de",pos:"cụm từ",vi:"được, vâng (đồng ý)",en:"good, OK",hv:"",t:2,ex:[["好的，我马上去。","Hǎo de, wǒ mǎshàng qù.","Được, tôi đi ngay."],["——明天见！——好的！","——Míngtiān jiàn! ——Hǎo de!","— Mai gặp nhé! — Được!"]],tip:"Câu trả lời đồng ý trong khẩu ngữ."},
{hz:"晚",py:"wǎn",pos:"tính từ",vi:"muộn",en:"late",hv:"VÃN",t:3,ex:[["太晚了，快睡觉吧。","Tài wǎn le, kuài shuì jiào ba.","Muộn quá rồi, mau đi ngủ đi."],["对不起，我来晚了。","Duìbuqǐ, wǒ lái wǎn le.","Xin lỗi, tôi đến muộn."]],tip:"Ngược nghĩa 早."},
{hz:"成",py:"chéng",pos:"động từ",vi:"trở thành, thành",en:"become, turn into",hv:"THÀNH",t:3,ex:[["我们成了好朋友。","Wǒmen chéngle hǎo péngyou.","Chúng tôi trở thành bạn thân."],["请把这句话翻译成汉语。","Qǐng bǎ zhè jù huà fānyì chéng Hànyǔ.","Hãy dịch câu này sang tiếng Trung."]],tip:"成了 + danh từ: đã trở thành…"},
{hz:"迷",py:"mí",pos:"danh từ",vi:"người mê, fan",en:"devotee, fan, enthusiast",hv:"MÊ",t:3,ex:[["他是一个足球迷。","Tā shì yí ge zúqiúmí.","Anh ấy là một fan bóng đá."],["我妈妈是电视迷。","Wǒ māma shì diànshìmí.","Mẹ tôi là người nghiện ti vi."]],tip:"Danh từ + 迷: 球迷, 歌迷, 电影迷."},
{hz:"那么",py:"nàme",pos:"đại từ",vi:"như thế, đến thế",en:"so, like that",hv:"NA MA",t:3,ex:[["他为什么那么高兴？","Tā wèi shénme nàme gāoxìng?","Sao anh ấy vui thế?"],["你别那么着急。","Nǐ bié nàme zháojí.","Bạn đừng sốt ruột thế."]],tip:"那么 + tính từ: “đến vậy” (xa người nói); 这么: gần người nói."},
{hz:"练习",py:"liànxí",pos:"động từ / danh từ",vi:"luyện tập; bài tập",en:"practice, train, drill",hv:"LUYỆN TẬP",t:3,ex:[["我每天练习写汉字。","Wǒ měi tiān liànxí xiě Hànzì.","Ngày nào tôi cũng luyện viết chữ Hán."],["这个练习不难。","Zhège liànxí bù nán.","Bài tập này không khó."]],tip:"Hán Việt LUYỆN TẬP."},
{hz:"比赛",py:"bǐsài",pos:"danh từ",vi:"trận đấu, cuộc thi",en:"match, contest, race",hv:"TỶ TÁI",t:3,ex:[["今晚有足球比赛。","Jīn wǎn yǒu zúqiú bǐsài.","Tối nay có trận bóng đá."],["我参加了汉语比赛。","Wǒ cānjiāle Hànyǔ bǐsài.","Tôi đã tham gia cuộc thi tiếng Trung."]],tip:"Lượng từ: 一场比赛."},
{hz:"节目",py:"jiémù",pos:"danh từ",vi:"chương trình, tiết mục",en:"programme, item",hv:"TIẾT MỤC",t:3,ex:[["这个电视节目很有意思。","Zhège diànshì jiémù hěn yǒu yìsi.","Chương trình ti vi này rất hay."],["晚会上有很多节目。","Wǎnhuì shang yǒu hěn duō jiémù.","Trong buổi liên hoan có nhiều tiết mục."]],tip:"Hán Việt TIẾT MỤC."},
{hz:"收音机",py:"shōuyīnjī",pos:"danh từ",vi:"máy thu thanh, radio",en:"radio, radio set",hv:"THU ÂM CƠ",t:3,ex:[["爷爷每天听收音机。","Yéye měi tiān tīng shōuyīnjī.","Ông nội ngày nào cũng nghe đài."],["这台收音机很旧了。","Zhè tái shōuyīnjī hěn jiù le.","Chiếc đài này cũ lắm rồi."]],tip:"收 (thu) + 音 (âm) + 机 (máy)."},
{hz:"主意",py:"zhǔyi",pos:"danh từ",vi:"ý kiến, ý tưởng",en:"idea, plan",hv:"CHỦ Ý",t:3,ex:[["你有什么好主意？","Nǐ yǒu shénme hǎo zhǔyi?","Bạn có ý gì hay không?"],["这是个好主意！","Zhè shì ge hǎo zhǔyi!","Đó là ý hay!"]],tip:"好主意 = ý hay. 意 đọc nhẹ."}
],
texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"20-1",at:"20-2",sc:"“Tôi” kể về việc gọi đồ ăn giao tận nhà.",
 lines:[["","我学习很忙，一般不在家里做饭，下课以后经常在食堂吃饭。","Wǒ xuéxí hěn máng, yìbān bú zài jiā li zuò fàn, xià kè yǐhòu jīngcháng zài shítáng chī fàn.","Tôi học rất bận, thường không nấu ăn ở nhà, tan học hay ăn ở nhà ăn."],
 ["","有个中国朋友告诉我，一些快餐店卖外卖，还可以送到家里。","Yǒu ge Zhōngguó péngyou gàosu wǒ, yìxiē kuàicāndiàn mài wàimài, hái kěyǐ sòngdào jiā li.","Có người bạn Trung Quốc bảo tôi, một số cửa hàng đồ ăn nhanh bán đồ mang đi, còn có thể giao tận nhà."],
 ["","以前我只知道一些有名的外国快餐店可以送外卖，现在我知道很多中国快餐店也可以送外卖。","Yǐqián wǒ zhǐ zhīdào yìxiē yǒumíng de wàiguó kuàicāndiàn kěyǐ sòng wàimài, xiànzài wǒ zhīdào hěn duō Zhōngguó kuàicāndiàn yě kěyǐ sòng wàimài.","Trước đây tôi chỉ biết vài cửa hàng nước ngoài nổi tiếng có giao đồ ăn, giờ tôi biết nhiều cửa hàng Trung Quốc cũng giao."],
 ["","这样我坐在家里就能吃到热饭热菜了，真是又方便又舒服。","Zhèyàng wǒ zuò zài jiā li jiù néng chīdào rè fàn rè cài le, zhēn shì yòu fāngbiàn yòu shūfu.","Như vậy tôi ngồi ở nhà cũng được ăn cơm canh nóng hổi, thật vừa tiện vừa thoải mái."]],
 q:[["“我”经常在哪儿吃饭？","“Wǒ” jīngcháng zài nǎr chī fàn?","“Tôi” thường ăn ở đâu?","在食堂吃饭。","Ở nhà ăn."],["中国快餐店也可以送外卖吗？","Zhōngguó kuàicāndiàn yě kěyǐ sòng wàimài ma?","Cửa hàng đồ ăn nhanh Trung Quốc có giao đồ ăn không?","可以，很多中国快餐店也可以送外卖。","Có, nhiều cửa hàng cũng giao."],["“我”为什么喜欢叫外卖？","“Wǒ” wèi shénme xǐhuan jiào wàimài?","Vì sao “tôi” thích gọi đồ ăn giao đến?","坐在家里就能吃到热饭热菜，又方便又舒服。","Ngồi nhà cũng ăn được cơm nóng, vừa tiện vừa thoải mái."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"20-3",at:"20-4",sc:"Martin ở cửa hàng Pizza Hut (必胜客).",
 lines:[["服务员","欢迎光临！您几位？","Huānyíng guānglín! Nín jǐ wèi?","Kính chào quý khách! Anh đi mấy người ạ?"],
 ["马丁","一位。","Yí wèi.","Một người."],
 ["服务员","外边都坐满了，里边请。您想吃点儿什么？","Wàibian dōu zuòmǎn le, lǐbian qǐng. Nín xiǎng chī diǎnr shénme?","Bên ngoài kín chỗ rồi, mời anh vào trong. Anh muốn dùng gì ạ?"],
 ["马丁","我想要个比萨饼。","Wǒ xiǎng yào ge bǐsàbǐng.","Tôi muốn một cái pizza."],
 ["服务员","您还需要别的吗？","Nín hái xūyào biéde ma?","Anh còn cần gì khác không ạ?"],
 ["马丁","再来一份意大利面条、两杯可乐。","Zài lái yí fèn Yìdàlì miàntiáo, liǎng bēi kělè.","Cho thêm một phần mì Ý và hai cốc cola."],
 ["服务员","您在这儿吃还是带走？","Nín zài zhèr chī háishi dàizǒu?","Anh ăn ở đây hay mang đi ạ?"],
 ["马丁","带走。","Dàizǒu.","Mang đi."],
 ["服务员","请您坐这儿等一会儿，十五分钟以后就做好了。","Qǐng nín zuò zhèr děng yíhuìr, shíwǔ fēnzhōng yǐhòu jiù zuò hǎo le.","Mời anh ngồi đây đợi một lát, mười lăm phút nữa là xong."],
 ["马丁","好的，谢谢！","Hǎo de, xièxie!","Được, cảm ơn!"]],
 q:[["马丁在快餐店买了什么？","Mǎdīng zài kuàicāndiàn mǎile shénme?","Martin mua gì ở cửa hàng?","一个比萨饼、一份意大利面条和两杯可乐。","Một pizza, một phần mì Ý và hai cốc cola."],["马丁要等多长时间？","Mǎdīng yào děng duō cháng shíjiān?","Martin phải đợi bao lâu?","十五分钟。","Mười lăm phút."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"20-5",at:"20-6",sc:"A Minh hỏi Lâm Na về chuyện xem ti vi.",
 lines:[["阿明","林娜，听说你每天看电视看到很晚。","Línnà, tīngshuō nǐ měi tiān kàn diànshì kàndào hěn wǎn.","Lâm Na, nghe nói ngày nào cậu cũng xem ti vi đến khuya."],
 ["林娜","现在我都成了电视迷了，一打开电视就看到十一二点。","Xiànzài wǒ dōu chéngle diànshìmí le, yì dǎkāi diànshì jiù kàndào shíyī-èr diǎn.","Giờ mình thành người nghiện ti vi rồi, hễ bật ti vi lên là xem đến mười một, mười hai giờ."],
 ["阿明","为什么你对看电视那么有兴趣？","Wèi shénme nǐ duì kàn diànshì nàme yǒu xìngqù?","Sao cậu hứng thú với ti vi thế?"],
 ["林娜","练习汉语呀。我喜欢看新闻，看电影，看比赛，电视里还有学汉语的节目呢。你不看电视吗？","Liànxí Hànyǔ ya. Wǒ xǐhuan kàn xīnwén, kàn diànyǐng, kàn bǐsài, diànshì li hái yǒu xué Hànyǔ de jiémù ne. Nǐ bú kàn diànshì ma?","Để luyện tiếng Trung mà. Mình thích xem thời sự, xem phim, xem thi đấu, trên ti vi còn có chương trình học tiếng Trung nữa. Cậu không xem ti vi à?"],
 ["阿明","我很少看。我每天要听两个小时收音机。","Wǒ hěn shǎo kàn. Wǒ měi tiān yào tīng liǎng ge xiǎoshí shōuyīnjī.","Mình ít xem lắm. Ngày nào mình cũng nghe đài hai tiếng."],

{k:["到","在","走","满","送到","坐在","带走","坐满","看到","买到","搬走"],t:"Bổ ngữ kết quả (2): 到 / 在 / 走 / 满",s:"V + 到 / 在 / 走 / 满 (+ O)",d:"V+到: đạt tới mục đích, tới nơi/tới lúc (送到, 买到, 看到). V+在: kết quả là ở một nơi chốn (坐在, 住在, 放在). V+走: rời khỏi chỗ cũ (带走, 搬走). V+满: làm cho đầy (坐满, 装满).",n:["Phủ định: 没 + V + bổ ngữ: 没买到, 没坐满.","V + 在 + nơi chốn: ✗他坐教室里 → ✓他坐在教室里。"],ex:["这里可以买到新鲜的水果。|Zhèlǐ kěyǐ mǎidào xīnxiān de shuǐguǒ.|Ở đây mua được hoa quả tươi.","他坐在教室里。|Tā zuò zài jiàoshì li.|Anh ấy ngồi trong lớp.","他带走了我的汉语书。|Tā dàizǒule wǒ de Hànyǔ shū.|Anh ấy mang sách tiếng Trung của tôi đi rồi.","教室里坐满了人。|Jiàoshì li zuòmǎnle rén.|Lớp học kín người."]},
{k:["又"],t:"又…又…: vừa… vừa…",s:"又 + A + 又 + B",d:"Biểu thị nhiều hành động, trạng thái, tính chất cùng tồn tại.",n:["A và B cùng loại: cùng là động từ hoặc cùng là tính từ."],ex:["他跟朋友一起又吃又喝。|Tā gēn péngyou yìqǐ yòu chī yòu hē.|Anh ấy cùng bạn vừa ăn vừa uống.","他每天又学习又工作。|Tā měi tiān yòu xuéxí yòu gōngzuò.|Ngày nào anh ấy cũng vừa học vừa làm.","这儿的东西又便宜又好。|Zhèr de dōngxi yòu piányi yòu hǎo.|Đồ ở đây vừa rẻ vừa tốt.","她的衣服又漂亮又便宜。|Tā de yīfu yòu piàoliang yòu piányi.|Quần áo của cô ấy vừa đẹp vừa rẻ."]},

{k:["对了"],t:"对了: chợt nhớ ra điều gì",s:"对了，……",d:"Đặt đầu câu, biểu thị người nói chợt nhớ ra một việc: “À phải rồi…”.",n:[],ex:["对了，我要告诉你一件事。|Duì le, wǒ yào gàosu nǐ yí jiàn shì.|À phải rồi, mình muốn nói với bạn một chuyện.","对了，你还没吃饭吧？|Duì le, nǐ hái méi chī fàn ba?|À, bạn vẫn chưa ăn cơm nhỉ?","对了，一会儿我还要去上课。|Duì le, yíhuìr wǒ hái yào qù shàng kè.|À phải, lát nữa mình còn phải đi học."]},
{k:["吧"],t:"吧 (2): hỏi kèm phỏng đoán",s:"…吧？",d:"吧 ở cuối câu hỏi, cho biết người hỏi đã đoán phần nào, muốn xác nhận: “…nhỉ?, …phải không?”.",n:["Khác 吗 (hỏi thông thường, chưa đoán trước)."],ex:["你也没去过吧？|Nǐ yě méi qùguo ba?|Bạn cũng chưa đi bao giờ nhỉ?","你是日本人吧？|Nǐ shì Rìběn rén ba?|Bạn là người Nhật phải không?","今天是十五号吧？|Jīntiān shì shíwǔ hào ba?|Hôm nay là ngày mười lăm nhỉ?"]}
