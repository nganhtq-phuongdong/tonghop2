{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"21-1",at:"21-2",sc:"Thói quen trả tiền khi đi ăn của người Trung Quốc và “AA制”.",
 lines:[["","中国人一起吃饭的时候，一般是一个人付钱，这次我请客，下次他请客。","Zhōngguó rén yìqǐ chī fàn de shíhou, yìbān shì yí ge rén fù qián, zhè cì wǒ qǐng kè, xià cì tā qǐng kè.","Người Trung Quốc khi ăn cùng nhau thường là một người trả tiền, lần này tôi mời, lần sau anh ấy mời."],
 ["","很多国家跟中国不一样，大家一起喝完咖啡、吃完饭以后，自己付自己的钱。","Hěn duō guójiā gēn Zhōngguó bù yíyàng, dàjiā yìqǐ hēwán kāfēi, chīwán fàn yǐhòu, zìjǐ fù zìjǐ de qián.","Nhiều nước không giống Trung Quốc, mọi người uống cà phê, ăn cơm xong thì ai trả phần người nấy."],
 ["","这种做法，中国人叫“AA制”。","Zhè zhǒng zuòfǎ, Zhōngguó rén jiào “AA zhì”.","Cách làm này người Trung Quốc gọi là “AA制”."],
 ["","“AA制”到了中国，对年轻人影响很大，很多年轻人也愿意这么做，但是大多数中国人还不习惯。","“AA zhì” dàole Zhōngguó, duì niánqīngrén yǐngxiǎng hěn dà, hěn duō niánqīngrén yě yuànyì zhème zuò, dànshì dàduōshù Zhōngguó rén hái bù xíguàn.","“AA制” vào Trung Quốc có ảnh hưởng lớn đến giới trẻ, nhiều người trẻ cũng muốn làm thế, nhưng đa số người Trung Quốc vẫn chưa quen."]],
 q:[["大家一起吃饭，付钱的时候中国人一般怎么做？你们国家呢？","Dàjiā yìqǐ chī fàn, fù qián de shíhou Zhōngguó rén yìbān zěnme zuò? Nǐmen guójiā ne?","Khi ăn cùng nhau, lúc trả tiền người Trung Quốc thường làm thế nào? Nước bạn thì sao?","一般是一个人付钱，这次我请客，下次他请客。","Thường một người trả, lần này tôi mời, lần sau người kia mời."],["中国人都习惯AA制吗？","Zhōngguó rén dōu xíguàn AA zhì ma?","Người Trung Quốc đều quen AA制 chứ?","不，大多数中国人还不习惯。","Không, đa số người Trung Quốc vẫn chưa quen."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"21-3",at:"21-4",sc:"Ở nhà hàng, Lâm Na và các bạn tính tiền.",
 lines:[["林娜","服务员，结账。","Fúwùyuán, jié zhàng.","Phục vụ ơi, tính tiền."],
 ["服务员","一共180块钱。","Yígòng yìbǎi bāshí kuài qián.","Tổng cộng 180 tệ."],
 ["林娜","咱们六个人AA制，好吗？","Zánmen liù ge rén AA zhì, hǎo ma?","Sáu người mình chia đều nhé?"],
 ["大家","好，每人30，再给点儿小费。","Hǎo, měi rén sānshí, zài gěi diǎnr xiǎofèi.","Được, mỗi người 30, cho thêm chút tiền boa."],
 ["林娜","这些菜请帮我们打包，把饭盒都放在袋子里。","Zhèxiē cài qǐng bāng wǒmen dǎ bāo, bǎ fànhé dōu fàng zài dàizi li.","Những món này gói giúp chúng tôi, để hết hộp cơm vào túi nhé."],
 ["服务员","没问题。","Méi wèntí.","Không vấn đề gì."],
 ["林娜","这是200块钱，零钱不用找了，是小费。","Zhè shì èrbǎi kuài qián, língqián búyòng zhǎo le, shì xiǎofèi.","Đây là 200 tệ, tiền lẻ không cần trả lại, coi như tiền boa."],
 ["服务员","我们不收小费。","Wǒmen bù shōu xiǎofèi.","Chúng tôi không nhận tiền boa."],
 ["林娜","不收小费？所有的饭馆都不收小费吗？","Bù shōu xiǎofèi? Suǒyǒu de fànguǎn dōu bù shōu xiǎofèi ma?","Không nhận tiền boa à? Tất cả nhà hàng đều không nhận sao?"],
 ["服务员","应该是这样吧。","Yīnggāi shì zhèyàng ba.","Chắc là như vậy."],
 ["林娜","宾馆和酒吧呢？","Bīnguǎn hé jiǔbā ne?","Thế khách sạn và quán bar thì sao?"],
 ["服务员","一般也不收，是不是有的地方收，我不太清楚。","Yìbān yě bù shōu, shì bu shì yǒude dìfang shōu, wǒ bú tài qīngchu.","Thường cũng không nhận, có nơi nào nhận hay không thì tôi không rõ lắm."]],
 q:[["林娜他们每人付多少钱？","Línnà tāmen měi rén fù duōshao qián?","Nhóm Lâm Na mỗi người trả bao nhiêu?","每人30块钱。","Mỗi người 30 tệ."],["中国饭馆服务员一般收小费吗？你们国家呢？","Zhōngguó fànguǎn fúwùyuán yìbān shōu xiǎofèi ma? Nǐmen guójiā ne?","Phục vụ nhà hàng Trung Quốc thường có nhận tiền boa không? Nước bạn thì sao?","一般不收小费。","Thường không nhận."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"21-5",at:"21-6",sc:"Lâm Na và Yamada nói về AA制.",
 lines:[["林娜","日本人都很习惯AA制吗？","Rìběn rén dōu hěn xíguàn AA zhì ma?","Người Nhật đều rất quen AA制 à?"],
 ["山田","当然习惯了。","Dāngrán xíguàn le.","Tất nhiên là quen rồi."],
 ["林娜","我觉得大多数中国人不太习惯AA制，他们常一个人请客。","Wǒ juéde dàduōshù Zhōngguó rén bú tài xíguàn AA zhì, tāmen cháng yí ge rén qǐng kè.","Mình thấy đa số người Trung Quốc không quen AA制, họ hay để một người mời."],
 ["山田","他们经常这次你请客，下次他请客，这样也不错，和AA制一样。","Tāmen jīngcháng zhè cì nǐ qǐng kè, xià cì tā qǐng kè, zhèyàng yě búcuò, hé AA zhì yíyàng.","Họ thường lần này cậu mời, lần sau người kia mời, như thế cũng hay, giống AA制."],
 ["林娜","我们也要慢慢习惯中国人的做法。","Wǒmen yě yào mànmàn xíguàn Zhōngguó rén de zuòfǎ.","Chúng mình cũng phải dần quen với cách làm của người Trung Quốc."],
 ["山田","我看见你打包了，你把东西放在哪儿了？","Wǒ kànjiàn nǐ dǎ bāo le, nǐ bǎ dōngxi fàng zài nǎr le?","Mình thấy cậu gói đồ ăn rồi, cậu để đồ ở đâu?"],
 ["林娜","我把袋子放在旁边的桌子上了，我去拿。","Wǒ bǎ dàizi fàng zài pángbiān de zhuōzi shang le, wǒ qù ná.","Mình để cái túi trên bàn bên cạnh, để mình đi lấy."]],
 q:[["日本人习惯AA制吗？","Rìběn rén xíguàn AA zhì ma?","Người Nhật có quen AA制 không?","很习惯。","Rất quen."],["林娜已经习惯中国人的做法了吗？","Línnà yǐjīng xíguàn Zhōngguó rén de zuòfǎ le ma?","Lâm Na đã quen cách làm của người Trung Quốc chưa?","还没有，她说要慢慢习惯。","Chưa, cô ấy nói phải dần dần quen."]]}
],
notes:[
{k:["一样","不一样"],t:"A 跟（和）B（不）一样",s:"A + 跟/和 + B + (不) + 一样 (+ Adj)",d:"So sánh hai sự vật: 一样 = giống nhau, 不一样 = khác nhau. Có thể thêm tính từ sau 一样: 一样大, 一样好.",n:["不 đặt trước 一样: ✗不跟他一样 (sai về nghĩa) → ✓跟他不一样."],ex:["我的习惯跟他的习惯不一样。|Wǒ de xíguàn gēn tā de xíguàn bù yíyàng.|Thói quen của tôi khác thói quen của anh ấy.","这本书跟那本书不一样。|Zhè běn shū gēn nà běn shū bù yíyàng.|Quyển sách này khác quyển kia.","我的兴趣跟她的一样。|Wǒ de xìngqù gēn tā de yíyàng.|Sở thích của tôi giống của cô ấy."]},
{k:["好吗"],t:"…，好吗？: hỏi ý kiến",s:"Nêu đề nghị + 好吗？",d:"Người nói nêu ý mình trước rồi dùng 好吗 để hỏi ý người nghe. Đồng ý: 好 / 好的 / 好啊 / 行. Không đồng ý thường nói ý khác, ít khi chỉ nói “不好/不行”.",n:[],ex:["A：我们一起吃饭，好吗？ B：好啊。|A: Wǒmen yìqǐ chī fàn, hǎo ma? B: Hǎo a.|A: Mình cùng ăn cơm nhé? B: Được thôi.","A：我用一下你的自行车，好吗？ B：上午不行，我要去一趟书店。|A: Wǒ yòng yíxià nǐ de zìxíngchē, hǎo ma? B: Shàngwǔ bù xíng, wǒ yào qù yí tàng shūdiàn.|A: Mình mượn xe đạp của cậu chút nhé? B: Sáng thì không được, mình phải ra hiệu sách."]},
{k:["把"],t:"Câu chữ 把 (1): S + 把 + O₁ + V + 在 + O₂",s:"S + 把 + O₁ + V + 在 + nơi chốn",d:"Thông qua hành động, làm cho O₁ thay đổi vị trí, chuyển đến nơi chốn O₂. Tân ngữ O₁ phải là vật xác định.",n:["Phủ định 不/没/别 và trợ động từ đặt trước 把: 我没把钱放在家里。","Sai: 我放词典在桌子上 → Đúng: 我把词典放在桌子上。"],ex:["我把词典放在桌子上了。|Wǒ bǎ cídiǎn fàng zài zhuōzi shang le.|Tôi để từ điển trên bàn rồi.","我把自行车放在家里了。|Wǒ bǎ zìxíngchē fàng zài jiā li le.|Tôi để xe đạp ở nhà rồi.","我没把钱放在家里。|Wǒ méi bǎ qián fàng zài jiā li.|Tôi không để tiền ở nhà.","别把自行车放在门口。|Bié bǎ zìxíngchē fàng zài ménkǒu.|Đừng để xe đạp ở cửa."]}
],

{h:"三、模仿例子组词",vi:"Ghép từ theo mẫu (gõ cả từ, nhiều đáp án đúng)",type:"colloc",items:[["习","xí",["学习","习惯","练习","复习","预习"]],["年","nián",["学年","年轻","今年","明年","新年"]],["法","fǎ",["做法","法语","办法","语法","书法"]],["次","cì",["下次","上次","这次","每次"]],["些","xiē",["这些","那些","一些","哪些"]],["费","fèi",["小费","学费","电话费","水费","房费"]]]},
{h:"四、选择适当的词语填空",vi:"Chọn từ thích hợp điền vào chỗ trống",type:"fill",bank:["下次","习惯","把","慢慢","清楚","拿","自己","所有","一样","影响"],items:[{s:"这是我__的事，我自己知道怎么办。",a:[["自己"]]},{s:"别着急，请你__说。",a:[["慢慢"]]},{s:"我们班二十个人，今天__的人都来了。",a:[["所有"]]},{s:"这次我一个人去，__我们一起去。",a:[["下次"]]},{s:"这些东西你都要__走吗？",a:[["拿"]]},{s:"别__手机放在桌子上。",a:[["把"]]},{s:"我还不__吃中国菜。",a:[["习惯"]]},{s:"她的帽子跟我的__。",a:[["一样"]]},{s:"这件事对我__很大。",a:[["影响"]]},{s:"我不太__他来不来。",a:[["清楚"]]}]},
{h:"五、把下面的句子改写成“把”字句",vi:"Viết lại thành câu chữ 把",type:"open",items:[{q:"书你放在桌子上。",a:["你把书放在桌子上。"]},{q:"手机你放在背包里吧。",a:["你把手机放在背包里吧。"]},{q:"词典我没放在桌子上。",a:["我没把词典放在桌子上。"]},{q:"笔你放在哪儿了？",a:["你把笔放在哪儿了？"]},{q:"你的自行车我放在宿舍前边了。",a:["我把你的自行车放在宿舍前边了。"]}]},

{hz:"正好",py:"zhènghǎo",pos:"tính từ / phó từ",vi:"vừa vặn, vừa đúng",en:"(of time, size, number etc.) just right",hv:"CHÍNH HẢO",t:2,ex:[["这双鞋我穿正好。","Zhè shuāng xié wǒ chuān zhènghǎo.","Đôi giày này tôi đi vừa vặn."],["你来得正好！","Nǐ lái de zhènghǎo!","Bạn đến đúng lúc quá!"]],tip:"不大不小，正好 = không to không nhỏ, vừa."},
{hz:"双",py:"shuāng",pos:"lượng từ",vi:"đôi",en:"pair",hv:"SONG",t:2,ex:[["我买了一双运动鞋。","Wǒ mǎile yì shuāng yùndòngxié.","Tôi mua một đôi giày thể thao."],["这双筷子是新的。","Zhè shuāng kuàizi shì xīn de.","Đôi đũa này mới."]],tip:"双: giày, tất, găng tay, đũa…"},
{hz:"鞋",py:"xié",pos:"danh từ",vi:"giày",en:"shoes",hv:"HÀI",t:2,ex:[["这双鞋很舒服。","Zhè shuāng xié hěn shūfu.","Đôi giày này rất êm."],["进门要换鞋。","Jìn mén yào huàn xié.","Vào nhà phải thay giày."]],tip:"革 (da) + 圭."},
{hz:"便宜",py:"piányi",pos:"tính từ",vi:"rẻ",en:"cheap",hv:"TIỆN NGHI",t:2,ex:[["这儿的东西很便宜。","Zhèr de dōngxi hěn piányi.","Đồ ở đây rất rẻ."],["能便宜一点儿吗？","Néng piányi yìdiǎnr ma?","Rẻ hơn chút được không?"]],tip:"Đọc piányi (không phải biànyí)."},
{hz:"会",py:"huì",pos:"trợ động từ",vi:"sẽ, có thể (khả năng xảy ra)",en:"be likely to, be sure to",hv:"HỘI",t:3,ex:[["明天会下雨吗？","Míngtiān huì xià yǔ ma?","Mai có mưa không?"],["他不会不来的。","Tā bú huì bù lái de.","Anh ấy không thể không đến đâu."]],tip:"会 (3): dự đoán khả năng; khác 会 = biết (kỹ năng)."},
{hz:"记",py:"jì",pos:"động từ",vi:"nhớ; ghi",en:"remember",hv:"KÝ",t:3,ex:[["我记不清楚了。","Wǒ jì bu qīngchu le.","Tôi không nhớ rõ nữa."],["请记一下这个号码。","Qǐng jì yíxià zhège hàomǎ.","Hãy ghi lại số này."]],tip:"记错 = nhớ nhầm, 记住 = nhớ kỹ."},
{hz:"错",py:"cuò",pos:"tính từ",vi:"sai, nhầm",en:"wrong",hv:"THÁC",t:3,ex:[["这个字写错了。","Zhège zì xiěcuò le.","Chữ này viết sai rồi."],["对不起，我打错了。","Duìbuqǐ, wǒ dǎcuò le.","Xin lỗi, tôi gọi nhầm số."]],tip:"V + 错 = làm sai: 听错, 看错, 记错. 不错 = khá tốt."},
{hz:"样子",py:"yàngzi",pos:"danh từ",vi:"hình dáng, kiểu dáng",en:"appearance, look",hv:"DẠNG TỬ",t:3,ex:[["这件衣服的样子很好看。","Zhè jiàn yīfu de yàngzi hěn hǎokàn.","Kiểu dáng bộ quần áo này rất đẹp."],["你的手机是什么样子的？","Nǐ de shǒujī shì shénme yàngzi de?","Điện thoại của bạn trông như thế nào?"]],tip:"什么样子的 = trông thế nào."},
{hz:"红色",py:"hóngsè",pos:"danh từ",vi:"màu đỏ",en:"red (colour)",hv:"HỒNG SẮC",t:3,ex:[["中国人喜欢红色。","Zhōngguó rén xǐhuan hóngsè.","Người Trung Quốc thích màu đỏ."],["她穿着红色的裙子。","Tā chuānzhe hóngsè de qúnzi.","Cô ấy mặc váy đỏ."]],tip:"Màu đỏ tượng trưng may mắn."},
{hz:"红",py:"hóng",pos:"tính từ",vi:"đỏ",en:"red",hv:"HỒNG",t:3,ex:[["她的脸红了。","Tā de liǎn hóng le.","Mặt cô ấy đỏ lên."],["红的那个是我的。","Hóng de nàge shì wǒ de.","Cái màu đỏ là của tôi."]],tip:"纟 + 工."},
{hz:"旧",py:"jiù",pos:"tính từ",vi:"cũ",en:"old, used, worn",hv:"CỰU",t:3,ex:[["这辆车很旧了。","Zhè liàng chē hěn jiù le.","Chiếc xe này cũ lắm rồi."],["我买了一些旧书。","Wǒ mǎile yìxiē jiù shū.","Tôi mua một ít sách cũ."]],tip:"Ngược nghĩa 新 (mới)."},
{hz:"算了",py:"suàn le",pos:"cụm từ",vi:"thôi bỏ đi, thôi vậy",en:"let it be, let it pass, forget it",hv:"",t:3,ex:[["算了，别说了。","Suàn le, bié shuō le.","Thôi, đừng nói nữa."],["下雨了，算了，不去了。","Xià yǔ le, suàn le, bú qù le.","Mưa rồi, thôi không đi nữa."]],tip:"Bỏ qua, không tính toán nữa."}
],
texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"22-1",at:"22-2",sc:"Mẹ Lâm Na từ Pháp sang thăm.",
 lines:[["","我妈妈从法国来看我了。","Wǒ māma cóng Fǎguó lái kàn wǒ le.","Mẹ tôi từ Pháp sang thăm tôi."],
 ["","她给我带了很多好吃的，还带了一些衣服。","Tā gěi wǒ dàile hěn duō hǎochī de, hái dàile yìxiē yīfu.","Mẹ mang cho tôi rất nhiều đồ ăn ngon, còn mang một ít quần áo."],
 ["","她给我买了一件黄色的衬衫、一件蓝色的上衣和一条黑色的裤子。","Tā gěi wǒ mǎile yí jiàn huángsè de chènshān, yí jiàn lánsè de shàngyī hé yì tiáo hēisè de kùzi.","Mẹ mua cho tôi một chiếc sơ mi vàng, một chiếc áo khoác xanh và một cái quần đen."],
 ["","那件蓝上衣是我最喜欢的，衬衫和裤子也是我现在需要的。","Nà jiàn lán shàngyī shì wǒ zuì xǐhuan de, chènshān hé kùzi yě shì wǒ xiànzài xūyào de.","Chiếc áo xanh là cái tôi thích nhất, sơ mi và quần cũng là thứ tôi đang cần."],
 ["","那些吃的，我要带给大家尝一尝。","Nàxiē chī de, wǒ yào dài gěi dàjiā cháng yi cháng.","Những đồ ăn kia, tôi sẽ mang cho mọi người nếm thử."],
 ["","妈妈来了，我当然很高兴。可是我的自行车丢了，我有点儿生气。","Māma lái le, wǒ dāngrán hěn gāoxìng. Kěshì wǒ de zìxíngchē diū le, wǒ yǒudiǎnr shēng qì.","Mẹ sang, tôi đương nhiên rất vui. Nhưng xe đạp của tôi bị mất, tôi hơi bực."]],
 q:[["妈妈给“我”带了什么东西？","Māma gěi “wǒ” dàile shénme dōngxi?","Mẹ mang cho “tôi” những gì?","很多好吃的，还有一件黄色的衬衫、一件蓝色的上衣和一条黑色的裤子。","Nhiều đồ ăn ngon, một sơ mi vàng, một áo xanh và một quần đen."],["“我”最喜欢的是什么东西？","“Wǒ” zuì xǐhuan de shì shénme dōngxi?","“Tôi” thích nhất thứ gì?","那件蓝上衣。","Chiếc áo khoác màu xanh."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"22-3",at:"22-4",sc:"Trong cửa hàng, Lâm Na và mẹ chọn áo.",
 lines:[["林娜","妈妈，您看，这件上衣好看吗？","Māma, nín kàn, zhè jiàn shàngyī hǎokàn ma?","Mẹ ơi, mẹ xem, chiếc áo này có đẹp không?"],
 ["妈妈","好看。","Hǎokàn.","Đẹp."],
 ["林娜","您喜欢吗？","Nín xǐhuan ma?","Mẹ có thích không?"],
 ["妈妈","喜欢。","Xǐhuan.","Thích."],
 ["林娜","我觉得这个颜色您穿特别合适，您试试吧。","Wǒ juéde zhège yánsè nín chuān tèbié héshì, nín shìshi ba.","Con thấy màu này mẹ mặc rất hợp, mẹ thử đi."],
 ["妈妈","好。","Hǎo.","Được."],
 ["营业员","那边有试衣间。","Nàbian yǒu shìyījiān.","Đằng kia có phòng thử đồ."],
 ["林娜","这件有点儿瘦，还有点儿短，能不能换一件肥点儿的、长点儿的？","Zhè jiàn yǒudiǎnr shòu, hái yǒudiǎnr duǎn, néng bu néng huàn yí jiàn féi diǎnr de, cháng diǎnr de?","Cái này hơi chật, lại hơi ngắn, có thể đổi cái rộng hơn, dài hơn một chút không?"],
 ["营业员","您再试试这件。","Nín zài shìshi zhè jiàn.","Chị thử lại cái này xem."],
 ["林娜","这件不长不短，不肥不瘦，正好。多少钱？","Zhè jiàn bù cháng bù duǎn, bù féi bú shòu, zhènghǎo. Duōshao qián?","Cái này không dài không ngắn, không rộng không chật, vừa vặn. Bao nhiêu tiền?"],
 ["营业员","490块钱。","Sìbǎi jiǔshí kuài qián.","490 tệ."],
 ["林娜","太贵了。","Tài guì le.","Đắt quá."],
 ["营业员","这么好的衣服才490块，不贵。","Zhème hǎo de yīfu cái sìbǎi jiǔshí kuài, bú guì.","Áo đẹp thế này mới có 490 tệ, không đắt đâu."],
 ["林娜","你看，我这双鞋又好看又舒服，才300。这件衣服当然不便宜了。","Nǐ kàn, wǒ zhè shuāng xié yòu hǎokàn yòu shūfu, cái sānbǎi. Zhè jiàn yīfu dāngrán bù piányi le.","Chị xem, đôi giày này của tôi vừa đẹp vừa êm, mới 300. Chiếc áo này đương nhiên là không rẻ rồi."]],
 q:[["那件上衣怎么样？","Nà jiàn shàngyī zěnmeyàng?","Chiếc áo đó thế nào?","不长不短，不肥不瘦，正好。","Không dài không ngắn, không rộng không chật, vừa vặn."],["林娜觉得那件上衣贵不贵？","Línnà juéde nà jiàn shàngyī guì bu guì?","Lâm Na thấy chiếc áo đắt không?","她觉得太贵了。","Cô ấy thấy đắt quá."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"22-5",at:"22-6",sc:"Xe đạp của Lâm Na không thấy đâu, các bạn giúp cô tìm.",
 lines:[["崔浩","你把自行车放在哪儿了？","Nǐ bǎ zìxíngchē fàng zài nǎr le?","Cậu để xe đạp ở đâu?"],
 ["林娜","我就放在这儿了。","Wǒ jiù fàng zài zhèr le.","Mình để ngay ở đây mà."],
 ["崔浩","你不会记错吧？","Nǐ bú huì jìcuò ba?","Cậu không nhớ nhầm chứ?"],
 ["林娜","不会。","Bú huì.","Không đâu."],
 ["崔浩","你的自行车是什么样子的？","Nǐ de zìxíngchē shì shénme yàngzi de?","Xe đạp của cậu trông thế nào?"],
 ["林娜","是红色的，比较大的那种。","Shì hóngsè de, bǐjiào dà de nà zhǒng.","Màu đỏ, loại khá to."],
 ["马丁","这辆自行车是你的吗？","Zhè liàng zìxíngchē shì nǐ de ma?","Chiếc xe này có phải của cậu không?"],
 ["林娜","不是。我的是红的，不是黄的。","Bú shì. Wǒ de shì hóng de, bú shì huáng de.","Không phải. Xe mình màu đỏ, không phải màu vàng."],
 ["山田","这辆呢？","Zhè liàng ne?","Còn chiếc này?"],
 ["林娜","也不是。这辆是旧的，我的是新的。算了，咱们别找了。","Yě bú shì. Zhè liàng shì jiù de, wǒ de shì xīn de. Suàn le, zánmen bié zhǎo le.","Cũng không phải. Chiếc này cũ, xe mình mới. Thôi, mình đừng tìm nữa."]],
 q:[["林娜的自行车是什么样子的？","Línnà de zìxíngchē shì shénme yàngzi de?","Xe đạp của Lâm Na trông thế nào?","红色的，比较大，是新的。","Màu đỏ, khá to, xe mới."],["林娜的自行车找到了吗？","Línnà de zìxíngchē zhǎodào le ma?","Đã tìm thấy xe của Lâm Na chưa?","没有找到。","Chưa tìm thấy."]]}
],
notes:[
{k:["的"],t:"Cụm chữ 的 (的字短语)",s:"N / Pron / V(P) / Adj + 的",d:"Thêm 的 sau danh từ, đại từ, động từ, tính từ… tạo thành cụm có chức năng như danh từ, thay cho danh từ đã rõ: 红色的 (cái màu đỏ), 吃的 (đồ ăn), 开车的 (người lái xe).",n:["N + 的: 外国的, 老师的, 图书馆的; Pron + 的: 我的, 你的; V + 的: 吃的, 穿的, 跑步的; Adj + 的: 红色的, 短的, 旧的."],ex:["这是你的，那是我的。|Zhè shì nǐ de, nà shì wǒ de.|Cái này của bạn, cái kia của tôi.","你的车是红的还是黑的？|Nǐ de chē shì hóng de háishi hēi de?|Xe của bạn màu đỏ hay màu đen?","吃的、穿的、用的我都买了。|Chī de, chuān de, yòng de wǒ dōu mǎi le.|Đồ ăn, đồ mặc, đồ dùng tôi đều mua rồi.","这本书是图书馆的。|Zhè běn shū shì túshūguǎn de.|Quyển sách này của thư viện."]},
{k:["有点儿"],t:"有点儿: hơi, có chút",s:"有点儿 + Adj / V",d:"有点儿 là phó từ đặt trước tính từ/động từ, chỉ mức độ không cao, thường dùng cho điều không vừa ý.",n:["Không dùng cho điều tích cực: ✗有点儿漂亮 → ✓很漂亮 / 挺漂亮."],ex:["今天有点儿热。|Jīntiān yǒudiǎnr rè.|Hôm nay hơi nóng.","这条裤子有点儿短。|Zhè tiáo kùzi yǒudiǎnr duǎn.|Cái quần này hơi ngắn.","他有点儿不太高兴。|Tā yǒudiǎnr bú tài gāoxìng.|Anh ấy có vẻ hơi không vui.","我的自行车丢了，我有点儿生气。|Wǒ de zìxíngchē diū le, wǒ yǒudiǎnr shēng qì.|Xe đạp tôi bị mất, tôi hơi bực."]},
{k:["一点儿","点儿"],t:"Adj + (一)点儿: …hơn một chút",s:"Adj + (一)点儿",d:"Dùng trong câu có ý so sánh, chỉ mức độ chênh lệch nhỏ: 长一点儿 (dài hơn chút), 便宜点儿 (rẻ hơn chút).",n:["Phân biệt: 有点儿 + Adj (hơi… – không hài lòng) ↔ Adj + 一点儿 (…hơn chút – so sánh, yêu cầu)."],ex:["帮我换件长一点儿的。|Bāng wǒ huàn jiàn cháng yìdiǎnr de.|Đổi giúp tôi cái dài hơn chút.","这条太瘦，能不能换一条肥点儿的？|Zhè tiáo tài shòu, néng bu néng huàn yì tiáo féi diǎnr de?|Cái này chật quá, đổi cái rộng hơn được không?","你今天好点儿了吗？|Nǐ jīntiān hǎo diǎnr le ma?|Hôm nay bạn đỡ hơn chưa?"]},
{k:["才"],t:"才 (2): chỉ (ít, sớm, rẻ)",s:"才 + số lượng",d:"才 đặt trước từ chỉ số lượng, nhấn mạnh số lượng ít, thời gian sớm, giá rẻ: “mới có, chỉ có”.",n:["So sánh 才 (1) (L17): thời gian + 才 + V = muộn."],ex:["我们班一共才十个人。|Wǒmen bān yígòng cái shí ge rén.|Lớp chúng tôi tổng cộng chỉ có mười người.","才星期二，还早呢。|Cái xīngqī'èr, hái zǎo ne.|Mới thứ Ba, còn sớm mà.","这双鞋才300元。|Zhè shuāng xié cái sānbǎi yuán.|Đôi giày này chỉ có 300 tệ."]},
{k:["算了"],t:"算了: thôi, bỏ đi",s:"算了，…",d:"Biểu thị thôi không làm nữa, bỏ qua, không so đo.",n:[],ex:["这么麻烦，算了，不吃了。|Zhème máfan, suàn le, bù chī le.|Phiền thế, thôi không ăn nữa.","太冷了，算了，今天不去了。|Tài lěng le, suàn le, jīntiān bú qù le.|Lạnh quá, thôi hôm nay không đi nữa.","一点儿小东西，别找了，算了。|Yìdiǎnr xiǎo dōngxi, bié zhǎo le, suàn le.|Đồ lặt vặt thôi, đừng tìm nữa, bỏ đi."]}
],
gex:[
 {q:"这辆车是新___，那辆是旧___。|Zhè liàng chē shì xīn ___, nà liàng shì jiù ___.|Xe này mới, xe kia cũ.",o:["的","了","吗","呢"],a:0,e:"Cụm chữ 的: Adj + 的."},
 {q:"今天___冷，多穿点儿衣服。|Jīntiān ___ lěng, duō chuān diǎnr yīfu.|Hôm nay hơi lạnh, mặc thêm chút áo.",o:["有点儿","一点儿","点儿","一些"],a:0,e:"有点儿 + Adj (đứng trước)."},

{hz:"场",py:"cháng",pos:"lượng từ",vi:"trận, cơn (mưa, tuyết, bệnh)",en:"used to indicate a process",hv:"TRƯỜNG",t:1,ex:[["昨天下了一场大雨。","Zuótiān xiàle yì cháng dà yǔ.","Hôm qua có một trận mưa to."],["他生了一场病。","Tā shēngle yì cháng bìng.","Anh ấy bị một trận ốm."]],tip:"Đọc cháng (lượng từ cho quá trình); đọc chǎng: 一场比赛 (trận đấu)."},
{hz:"气温",py:"qìwēn",pos:"danh từ",vi:"nhiệt độ (không khí)",en:"temperature",hv:"KHÍ ÔN",t:1,ex:[["今天气温很高。","Jīntiān qìwēn hěn gāo.","Hôm nay nhiệt độ rất cao."],["明天气温会下降。","Míngtiān qìwēn huì xiàjiàng.","Ngày mai nhiệt độ sẽ giảm."]],tip:"气 (khí) + 温 (ấm)."},
{hz:"低",py:"dī",pos:"tính từ",vi:"thấp",en:"low",hv:"ĐÊ",t:1,ex:[["今天气温很低。","Jīntiān qìwēn hěn dī.","Hôm nay nhiệt độ rất thấp."],["请说话声音低一点儿。","Qǐng shuō huà shēngyīn dī yìdiǎnr.","Xin nói nhỏ giọng một chút."]],tip:"Ngược nghĩa 高."},
{hz:"零下",py:"língxià",pos:"danh từ",vi:"âm (dưới 0 độ)",en:"below zero",hv:"LINH HẠ",t:1,ex:[["今天零下五度。","Jīntiān língxià wǔ dù.","Hôm nay âm năm độ."],["哈尔滨冬天常常零下二十度。","Hā'ěrbīn dōngtiān chángcháng língxià èrshí dù.","Mùa đông Cáp Nhĩ Tân thường âm hai mươi độ."]],tip:"零 (số không) + 下 (dưới)."},
{hz:"度",py:"dù",pos:"lượng từ",vi:"độ",en:"degree",hv:"ĐỘ",t:1,ex:[["今天三十度。","Jīntiān sānshí dù.","Hôm nay ba mươi độ."],["他发烧三十九度。","Tā fā shāo sānshíjiǔ dù.","Anh ấy sốt ba mươi chín độ."]],tip:"Đơn vị nhiệt độ, góc…"},
{hz:"左右",py:"zuǒyòu",pos:"danh từ",vi:"khoảng, chừng (sau số lượng)",en:"around, about, or so",hv:"TẢ HỮU",t:1,ex:[["我七点左右起床。","Wǒ qī diǎn zuǒyòu qǐ chuáng.","Tôi dậy khoảng bảy giờ."],["这个包两百块左右。","Zhège bāo liǎngbǎi kuài zuǒyòu.","Cái túi này khoảng hai trăm tệ."]],tip:"Số lượng + 左右 = xấp xỉ."},
{hz:"差不多",py:"chàbuduō",pos:"phó từ",vi:"gần như, xấp xỉ",en:"almost, nearly",hv:"SAI BẤT ĐA",t:1,ex:[["我差不多做完了。","Wǒ chàbuduō zuòwán le.","Tôi gần làm xong rồi."],["他们俩差不多高。","Tāmen liǎ chàbuduō gāo.","Hai người họ cao xấp xỉ nhau."]],tip:"差 đọc chà: chênh lệch không nhiều."},
{hz:"老人",py:"lǎorén",pos:"danh từ",vi:"người già",en:"old people",hv:"LÃO NHÂN",t:1,ex:[["公园里有很多老人。","Gōngyuán li yǒu hěn duō lǎorén.","Trong công viên có nhiều người già."],["我们要照顾老人。","Wǒmen yào zhàogù lǎorén.","Chúng ta phải chăm sóc người già."]],tip:"老 (già) + 人."},
{hz:"年",py:"nián",pos:"danh từ / lượng từ",vi:"năm",en:"year",hv:"NIÊN",t:1,ex:[["我学了两年汉语。","Wǒ xuéle liǎng nián Hànyǔ.","Tôi học tiếng Trung hai năm."],["一年有十二个月。","Yì nián yǒu shí'èr ge yuè.","Một năm có mười hai tháng."]],tip:"年 không cần lượng từ 个."},
{hz:"寒冷",py:"hánlěng",pos:"tính từ",vi:"lạnh giá, rét",en:"cold, frigid",hv:"HÀN LÃNH",t:1,ex:[["寒冷的冬天来了。","Hánlěng de dōngtiān lái le.","Mùa đông giá rét đã đến."],["这里的冬天很寒冷。","Zhèlǐ de dōngtiān hěn hánlěng.","Mùa đông ở đây rất giá rét."]],tip:"Sắc thái văn viết hơn 冷."},
{hz:"人们",py:"rénmen",pos:"danh từ",vi:"mọi người, người ta",en:"people",hv:"NHÂN MÔN",t:1,ex:[["春节的时候人们都回家。","Chūn Jié de shíhou rénmen dōu huí jiā.","Dịp Tết mọi người đều về nhà."],["人们都说他是好人。","Rénmen dōu shuō tā shì hǎo rén.","Mọi người đều nói anh ấy là người tốt."]],tip:"人 + 们 (số nhiều)."},
{hz:"突然",py:"tūrán",pos:"tính từ",vi:"đột nhiên, bất ngờ",en:"sudden, unexpected",hv:"ĐỘT NHIÊN",t:1,ex:[["他突然不说话了。","Tā tūrán bù shuō huà le.","Anh ấy bỗng nhiên im lặng."],["这件事太突然了。","Zhè jiàn shì tài tūrán le.","Việc này quá bất ngờ."]],tip:"Hán Việt ĐỘT NHIÊN."},
{hz:"变",py:"biàn",pos:"động từ",vi:"thay đổi, biến thành",en:"change",hv:"BIẾN",t:1,ex:[["天气变冷了。","Tiānqì biàn lěng le.","Thời tiết trở lạnh rồi."],["他变了很多。","Tā biànle hěn duō.","Anh ấy thay đổi nhiều."]],tip:"变 + Adj + 了 = trở nên…"},
{hz:"专家",py:"zhuānjiā",pos:"danh từ",vi:"chuyên gia",en:"expert, specialist",hv:"CHUYÊN GIA",t:1,ex:[["他是电脑专家。","Tā shì diànnǎo zhuānjiā.","Anh ấy là chuyên gia máy tính."],["专家说明年会更热。","Zhuānjiā shuō míngnián huì gèng rè.","Chuyên gia nói năm sau sẽ nóng hơn."]],tip:"Hán Việt CHUYÊN GIA."},
{hz:"地球",py:"dìqiú",pos:"danh từ",vi:"Trái Đất",en:"earth, globe",hv:"ĐỊA CẦU",t:1,ex:[["我们要保护地球。","Wǒmen yào bǎohù dìqiú.","Chúng ta phải bảo vệ Trái Đất."],["地球是圆的。","Dìqiú shì yuán de.","Trái Đất hình cầu."]],tip:"Hán Việt ĐỊA CẦU."},
{hz:"暖",py:"nuǎn",pos:"tính từ",vi:"ấm",en:"warm",hv:"NOÃN",t:1,ex:[["春天来了，天气变暖了。","Chūntiān lái le, tiānqì biàn nuǎn le.","Mùa xuân đến, trời ấm lên rồi."],["这件衣服很暖。","Zhè jiàn yīfu hěn nuǎn.","Bộ quần áo này rất ấm."]],tip:"暖和 = ấm áp."},
{hz:"注意",py:"zhùyì",pos:"động từ",vi:"chú ý, cẩn thận",en:"pay attention to, be careful about",hv:"CHÚ Ý",t:2,ex:[["过马路要注意安全。","Guò mǎlù yào zhùyì ānquán.","Qua đường phải chú ý an toàn."],["请注意听。","Qǐng zhùyì tīng.","Hãy chú ý lắng nghe."]],tip:"注意身体 = giữ gìn sức khỏe."},
{hz:"气候",py:"qìhòu",pos:"danh từ",vi:"khí hậu",en:"climate",hv:"KHÍ HẬU",t:2,ex:[["这儿的气候很好。","Zhèr de qìhòu hěn hǎo.","Khí hậu ở đây rất tốt."],["我还不习惯这儿的气候。","Wǒ hái bù xíguàn zhèr de qìhòu.","Tôi vẫn chưa quen khí hậu ở đây."]],tip:"天气 = thời tiết (ngắn hạn); 气候 = khí hậu (lâu dài)."},
{hz:"爱",py:"ài",pos:"động từ",vi:"hay, dễ (xảy ra)",en:"be liable to, be apt to",hv:"ÁI",t:2,ex:[["我小时候爱生病。","Wǒ xiǎoshíhou ài shēng bìng.","Hồi nhỏ tôi hay ốm."],["这儿的夏天爱下雨。","Zhèr de xiàtiān ài xià yǔ.","Mùa hè ở đây hay mưa."]],tip:"爱 + V: có xu hướng hay xảy ra."},
{hz:"锻炼",py:"duànliàn",pos:"động từ",vi:"rèn luyện (thân thể)",en:"do physical training, take exercise",hv:"ĐOÁN LUYỆN",t:2,ex:[["爷爷常在公园锻炼。","Yéye cháng zài gōngyuán duànliàn.","Ông hay tập thể dục ở công viên."],["多锻炼，身体好。","Duō duànliàn, shēntǐ hǎo.","Tập luyện nhiều thì khỏe."]],tip:"锻炼身体 = rèn luyện thân thể."},
{hz:"出门",py:"chū mén",pos:"động từ",vi:"ra ngoài, ra khỏi nhà",en:"go out",hv:"XUẤT MÔN",t:2,ex:[["出门别忘了带钥匙。","Chū mén bié wàngle dài yàoshi.","Ra ngoài đừng quên mang chìa khóa."],["下雨了，别出门了。","Xià yǔ le, bié chū mén le.","Mưa rồi, đừng ra ngoài nữa."]],tip:"Ly hợp: 出了门."},
{hz:"季节",py:"jìjié",pos:"danh từ",vi:"mùa",en:"season",hv:"QUÝ TIẾT",t:3,ex:[["一年有四个季节。","Yì nián yǒu sì ge jìjié.","Một năm có bốn mùa."],["你最喜欢哪个季节？","Nǐ zuì xǐhuan nǎge jìjié?","Bạn thích mùa nào nhất?"]],tip:"春夏秋冬: xuân, hạ, thu, đông."},
{hz:"下雨",py:"xià yǔ",pos:"động từ",vi:"mưa",en:"rain",hv:"HẠ VŨ",t:3,ex:[["外边下雨了。","Wàibian xià yǔ le.","Bên ngoài mưa rồi."],["明天会下雨吗？","Míngtiān huì xià yǔ ma?","Mai có mưa không?"]],tip:"下大雨 (mưa to), 下小雨 (mưa nhỏ)."},
{hz:"雨",py:"yǔ",pos:"danh từ",vi:"mưa",en:"rain",hv:"VŨ",t:3,ex:[["雨很大。","Yǔ hěn dà.","Mưa rất to."],["雨停了。","Yǔ tíng le.","Mưa tạnh rồi."]],tip:"Chữ tượng hình: những giọt mưa rơi từ mây."},
{hz:"正常",py:"zhèngcháng",pos:"tính từ",vi:"bình thường",en:"normal, regular",hv:"CHÍNH THƯỜNG",t:3,ex:[["他的体温很正常。","Tā de tǐwēn hěn zhèngcháng.","Thân nhiệt anh ấy bình thường."],["他的体温很正常。","Tā de tǐwēn hěn zhèngcháng.","Nhiệt độ cơ thể anh ấy bình thường."]],tip:"Ngược nghĩa: 不正常."}
],
texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"23-1",at:"23-2",sc:"Mùa đông năm nay ở Bắc Kinh.",
 lines:[["","今年冬天很特别，从北方到南方，已经下了四场大雪，气温也非常低。","Jīnnián dōngtiān hěn tèbié, cóng běifāng dào nánfāng, yǐjīng xiàle sì cháng dà xuě, qìwēn yě fēicháng dī.","Mùa đông năm nay rất đặc biệt, từ Bắc vào Nam đã có bốn trận tuyết lớn, nhiệt độ cũng rất thấp."],
 ["","在北京，冬天的最低气温一般在零下十度左右。","Zài Běijīng, dōngtiān de zuì dī qìwēn yìbān zài língxià shí dù zuǒyòu.","Ở Bắc Kinh, nhiệt độ thấp nhất mùa đông thường khoảng âm mười độ."],
 ["","可是今年冬天才冷呢，最冷的一天差不多有零下十七度。","Kěshì jīnnián dōngtiān cái lěng ne, zuì lěng de yì tiān chàbuduō yǒu língxià shíqī dù.","Nhưng mùa đông năm nay mới thật là lạnh, ngày lạnh nhất gần âm mười bảy độ."],
 ["","老人们都说，这是最近四十年最寒冷的冬天。","Lǎorénmen dōu shuō, zhè shì zuìjìn sìshí nián zuì hánlěng de dōngtiān.","Các cụ đều nói đây là mùa đông lạnh nhất trong bốn mươi năm gần đây."],
 ["","人们觉得冬天突然变冷了，可是有的专家说地球变暖了。","Rénmen juéde dōngtiān tūrán biàn lěng le, kěshì yǒude zhuānjiā shuō dìqiú biàn nuǎn le.","Mọi người thấy mùa đông đột nhiên lạnh hơn, nhưng có chuyên gia lại nói Trái Đất đang ấm lên."],
 ["","你们说，地球是变冷了，还是变暖了呢？","Nǐmen shuō, dìqiú shì biàn lěng le, háishi biàn nuǎn le ne?","Các bạn nói xem, Trái Đất lạnh đi hay ấm lên?"]],
 q:[["今年冬天最冷的时候是多少度？","Jīnnián dōngtiān zuì lěng de shíhou shì duōshao dù?","Lúc lạnh nhất mùa đông năm nay bao nhiêu độ?","差不多零下十七度。","Gần âm mười bảy độ."],["这样冷的冬天经常有吗？","Zhèyàng lěng de dōngtiān jīngcháng yǒu ma?","Mùa đông lạnh như vậy có thường xuyên không?","不经常，这是最近四十年最寒冷的冬天。","Không, đây là mùa đông lạnh nhất 40 năm gần đây."],["您觉得冬天是变冷了，还是变暖了？","Nín juéde dōngtiān shì biàn lěng le, háishi biàn nuǎn le?","Bạn thấy mùa đông lạnh đi hay ấm lên?","（tự trả lời）我觉得……","(Câu hỏi mở)"]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"23-3",at:"23-4",sc:"Giờ ra chơi, thầy Lý trò chuyện với học sinh.",
 lines:[["李一民","现在天气冷了，大家要注意身体，别感冒了。","Xiànzài tiānqì lěng le, dàjiā yào zhùyì shēntǐ, bié gǎnmào le.","Bây giờ trời lạnh rồi, mọi người phải giữ sức khỏe, đừng để bị cảm."],
 ["林娜","老师，阿明又感冒了，我觉得他还没习惯北京的气候。","Lǎoshī, Āmíng yòu gǎnmào le, wǒ juéde tā hái méi xíguàn Běijīng de qìhòu.","Thầy ơi, A Minh lại bị cảm rồi, em thấy cậu ấy chưa quen khí hậu Bắc Kinh."],
 ["李一民","他现在怎么样了？","Tā xiànzài zěnmeyàng le?","Bây giờ cậu ấy thế nào rồi?"],
 ["林娜","他现在好点儿了。","Tā xiànzài hǎo diǎnr le.","Bây giờ cậu ấy đỡ hơn rồi."],
 ["李一民","你们怎么样？","Nǐmen zěnmeyàng?","Còn các em thế nào?"],
 ["学生们","还可以。","Hái kěyǐ.","Cũng ổn ạ."],
 ["林娜","以前我爱感冒。现在常常锻炼，不爱感冒了。","Yǐqián wǒ ài gǎnmào. Xiànzài chángcháng duànliàn, bú ài gǎnmào le.","Trước đây em hay bị cảm. Giờ thường xuyên tập luyện nên không hay bị cảm nữa."],
 ["李一民","出门的时候多穿点儿衣服，平时多吃水果，多喝水。","Chū mén de shíhou duō chuān diǎnr yīfu, píngshí duō chī shuǐguǒ, duō hē shuǐ.","Lúc ra ngoài mặc thêm áo, ngày thường ăn nhiều hoa quả, uống nhiều nước."],
 ["学生们","谢谢老师！","Xièxie lǎoshī!","Cảm ơn thầy ạ!"]],
 q:[["阿明习惯北京的气候了吗？","Āmíng xíguàn Běijīng de qìhòu le ma?","A Minh quen khí hậu Bắc Kinh chưa?","还没习惯。","Chưa quen."],["阿明现在身体怎么样？","Āmíng xiànzài shēntǐ zěnmeyàng?","A Minh giờ sức khỏe thế nào?","他现在好点儿了。","Đỡ hơn rồi."],["林娜现在还爱感冒吗？","Línnà xiànzài hái ài gǎnmào ma?","Lâm Na giờ còn hay bị cảm không?","不爱感冒了，她常常锻炼。","Không hay bị nữa, cô ấy thường tập luyện."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"23-5",at:"23-6",sc:"Yamada hỏi A Minh về thời tiết ở Thái Lan.",
 lines:[["山田","阿明，最近泰国天气怎么样？","Āmíng, zuìjìn Tàiguó tiānqì zěnmeyàng?","A Minh, dạo này thời tiết Thái Lan thế nào?"],
 ["阿明","一般这个季节我们那儿不常下雨，可是最近也下了两场大雨。","Yìbān zhège jìjié wǒmen nàr bù cháng xià yǔ, kěshì zuìjìn yě xiàle liǎng cháng dà yǔ.","Thường mùa này ở bên mình ít mưa, nhưng gần đây cũng có hai trận mưa to."],
 ["山田","冷吗？","Lěng ma?","Có lạnh không?"],
 ["阿明","听妈妈说，今年很冷，很多人都穿棉衣了。","Tīng māma shuō, jīnnián hěn lěng, hěn duō rén dōu chuān miányī le.","Nghe mẹ nói năm nay rất lạnh, nhiều người đã mặc áo bông."],
 ["山田","是吗？以前也是这样吗？","Shì ma? Yǐqián yě shì zhèyàng ma?","Thế à? Trước đây cũng như vậy à?"],
 ["阿明","不是这样，以前这个季节不冷也不热，是最舒服的时候，今年很不正常。","Bú shì zhèyàng, yǐqián zhège jìjié bù lěng yě bú rè, shì zuì shūfu de shíhou, jīnnián hěn bú zhèngcháng.","Không phải vậy, trước đây mùa này không lạnh cũng không nóng, là lúc dễ chịu nhất, năm nay rất bất thường."]],
 q:[["今年冬天泰国气候怎么样？","Jīnnián dōngtiān Tàiguó qìhòu zěnmeyàng?","Mùa đông năm nay khí hậu Thái Lan thế nào?","下了两场大雨，也很冷。","Có hai trận mưa to, lại rất lạnh."],["今年泰国的气候跟以前一样吗？","Jīnnián Tàiguó de qìhòu gēn yǐqián yíyàng ma?","Khí hậu Thái Lan năm nay có giống trước không?","不一样，今年很不正常。","Không giống, năm nay rất bất thường."]]}

notes:[

read:{h:"七、阅读短文 · Dự báo thời tiết",p:[["巴黎天气预报：6月26日星期六，多云，最高气温26℃，最低气温14℃，风力1～2级。","Bālí tiānqì yùbào: liù yuè èrshíliù rì xīngqīliù, duōyún, zuì gāo qìwēn èrshíliù dù, zuì dī qìwēn shísì dù, fēnglì yī dào èr jí.","Dự báo thời tiết Paris: thứ Bảy 26/6, nhiều mây, cao nhất 26℃, thấp nhất 14℃, gió cấp 1–2."],["6月27日星期日，小雨，最高气温26℃，最低气温14℃，风力2～3级。","Liù yuè èrshíqī rì xīngqīrì, xiǎoyǔ, zuì gāo qìwēn èrshíliù dù, zuì dī qìwēn shísì dù, fēnglì èr dào sān jí.","Chủ nhật 27/6, mưa nhỏ, cao nhất 26℃, thấp nhất 14℃, gió cấp 2–3."],["北京天气预报：12月10日白天多云转阴，夜间有小雪，南风二三级，最高气温3℃，最低气温-1℃。","Běijīng tiānqì yùbào: shí'èr yuè shí rì báitiān duōyún zhuǎn yīn, yèjiān yǒu xiǎo xuě, nánfēng èr sān jí, zuì gāo qìwēn sān dù, zuì dī qìwēn língxià yī dù.","Dự báo Bắc Kinh: 10/12 ban ngày nhiều mây chuyển âm u, đêm có tuyết nhỏ, gió nam cấp 2–3, cao nhất 3℃, thấp nhất -1℃."],["12月11日多云转晴，北风二三级转四五级，最高气温6℃，最低气温-5℃。","Shí'èr yuè shíyī rì duōyún zhuǎn qíng, běifēng èr sān jí zhuǎn sì wǔ jí, zuì gāo qìwēn liù dù, zuì dī qìwēn língxià wǔ dù.","11/12 nhiều mây chuyển nắng, gió bắc cấp 2–3 chuyển cấp 4–5, cao nhất 6℃, thấp nhất -5℃."]],gl:[["巴黎","Bālí","Paris"],["白天","báitiān","ban ngày"],["夜间","yèjiān","ban đêm"]]},

texts:[
{n:1,title:"Bài khóa 1 · Thư mời",vt:"24-1",at:"24-2",sc:"Martin gửi email mời các bạn đến dự tiệc.",
 lines:[["","亲爱的朋友：","Qīn'ài de péngyou:","Các bạn thân mến:"],
 ["","下个星期四是美国的感恩节。","Xià ge xīngqīsì shì Měiguó de Gǎn'ēn Jié.","Thứ Năm tuần sau là Lễ Tạ ơn của Mỹ."],
 ["","为了庆祝这个重要的节日，美国大使馆在国际大厦四层举行晚会。","Wèile qìngzhù zhège zhòngyào de jiérì, Měiguó dàshǐguǎn zài Guójì Dàshà sì céng jǔxíng wǎnhuì.","Để mừng ngày lễ quan trọng này, Đại sứ quán Mỹ tổ chức tiệc tối ở tầng bốn Tòa nhà Quốc tế."],
 ["","我们很希望您能来参加我们的晚会，也非常欢迎您带朋友一起来。","Wǒmen hěn xīwàng nín néng lái cānjiā wǒmen de wǎnhuì, yě fēicháng huānyíng nín dài péngyou yìqǐ lái.","Chúng tôi rất mong bạn đến dự tiệc, cũng rất hoan nghênh bạn dẫn bạn bè cùng đến."],
 ["","时间：11月25日晚上18:00到23:00。地址：平安大街25号。","Shíjiān: shíyī yuè èrshíwǔ rì wǎnshang shíbā diǎn dào èrshísān diǎn. Dìzhǐ: Píng'ān Dàjiē èrshíwǔ hào.","Thời gian: tối 25/11 từ 18:00 đến 23:00. Địa chỉ: số 25 phố Bình An."],
 ["","电话：82043980。手机：13200778821。邮箱：mading1234@hotmail.com。","Diànhuà: bā èr líng sì sān jiǔ bā líng. Shǒujī: yāo sān èr líng líng qī qī bā bā èr yāo.","Điện thoại: 82043980. Di động: 13200778821. Email: mading1234@hotmail.com."],
 ["","如果您愿意参加这个活动，就给我们发个短信、打个电话或者发个电子邮件。","Rúguǒ nín yuànyì cānjiā zhège huódòng, jiù gěi wǒmen fā ge duǎnxìn, dǎ ge diànhuà huòzhě fā ge diànzǐ yóujiàn.","Nếu bạn muốn tham gia hoạt động này, hãy nhắn tin, gọi điện hoặc gửi email cho chúng tôi."],
 ["","马丁，11月18日","Mǎdīng, shíyī yuè shíbā rì","Martin, ngày 18/11"]],
 q:[["下星期四美国大使馆有什么活动？","Xià xīngqīsì Měiguó dàshǐguǎn yǒu shénme huódòng?","Thứ Năm tuần sau Đại sứ quán Mỹ có hoạt động gì?","举行感恩节晚会。","Tổ chức tiệc tối Lễ Tạ ơn."],["活动在哪儿举行？","Huódòng zài nǎr jǔxíng?","Hoạt động tổ chức ở đâu?","在国际大厦四层。","Ở tầng bốn Tòa nhà Quốc tế."]]},
{n:2,title:"Bài khóa 2 · Gọi điện",vt:"24-3",at:"24-4",sc:"Thôi Hạo gọi điện cho Martin.",
 lines:[["崔浩","喂，是马丁吗？我是崔浩。","Wèi, shì Mǎdīng ma? Wǒ shì Cuī Hào.","Alô, Martin đấy à? Mình là Thôi Hạo."],
 ["马丁","是你呀，你看到我的邮件了吗？你知道我们班有几个人去吗？","Shì nǐ ya, nǐ kàndào wǒ de yóujiàn le ma? Nǐ zhīdào wǒmen bān yǒu jǐ ge rén qù ma?","Cậu đấy à, cậu đọc email của mình chưa? Cậu biết lớp mình có mấy người đi không?"],
 ["崔浩","我们班所有的同学都去。","Wǒmen bān suǒyǒu de tóngxué dōu qù.","Tất cả các bạn lớp mình đều đi."],
 ["马丁","大家全去？","Dàjiā quán qù?","Mọi người đi hết à?"],
 ["崔浩","对呀。","Duì ya.","Đúng vậy."],
 ["马丁","太好了！","Tài hǎo le!","Tuyệt quá!"],
 ["崔浩","对了，你能告诉我国际大厦在哪儿吗？","Duì le, nǐ néng gàosu wǒ Guójì Dàshà zài nǎr ma?","À này, cậu chỉ cho mình Tòa nhà Quốc tế ở đâu được không?"],
 ["马丁","友谊宾馆东边就是国际大厦。你知道友谊宾馆吧？","Yǒuyì Bīnguǎn dōngbian jiù shì Guójì Dàshà. Nǐ zhīdào Yǒuyì Bīnguǎn ba?","Phía đông Khách sạn Hữu Nghị chính là Tòa nhà Quốc tế. Cậu biết Khách sạn Hữu Nghị chứ?"],
 ["崔浩","不知道。","Bù zhīdào.","Không biết."],
 ["马丁","这样吧，下午四点你让大家到我宿舍来，跟我一起过去，怎么样？","Zhèyàng ba, xiàwǔ sì diǎn nǐ ràng dàjiā dào wǒ sùshè lái, gēn wǒ yìqǐ guòqu, zěnmeyàng?","Thế này nhé, bốn giờ chiều cậu bảo mọi người đến ký túc xá mình, cùng mình đi qua đó, được không?"],
 ["崔浩","好啊！","Hǎo a!","Được đấy!"],
 ["马丁","晚上用不用我送你们回来呀？","Wǎnshang yòng bu yòng wǒ sòng nǐmen huílai ya?","Tối có cần mình đưa các cậu về không?"],
 ["崔浩","不用了。","Búyòng le.","Không cần đâu."]],
 q:[["马丁的班谁去参加晚会？","Mǎdīng de bān shéi qù cānjiā wǎnhuì?","Lớp Martin ai đi dự tiệc?","所有的同学都去。","Tất cả các bạn đều đi."],["国际大厦在哪儿？","Guójì Dàshà zài nǎr?","Tòa nhà Quốc tế ở đâu?","在友谊宾馆东边。","Ở phía đông Khách sạn Hữu Nghị."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"24-5",at:"24-6",sc:"Martin hỏi đường đến bưu điện.",
 lines:[["马丁","我妈妈给我寄来了感恩节礼物，可是我还不知道邮局在哪儿。你知道吗？","Wǒ māma gěi wǒ jìlaile Gǎn'ēn Jié lǐwù, kěshì wǒ hái bù zhīdào yóujú zài nǎr. Nǐ zhīdào ma?","Mẹ mình gửi quà Lễ Tạ ơn cho mình, nhưng mình chưa biết bưu điện ở đâu. Cậu biết không?"],
 ["崔浩","知道。你看见前边那个深灰色的大楼了吗？","Zhīdào. Nǐ kànjiàn qiánbian nàge shēn huīsè de dàlóu le ma?","Biết chứ. Cậu thấy tòa nhà màu xám đậm phía trước kia không?"],
 ["马丁","看见了。","Kànjiàn le.","Thấy rồi."],
 ["崔浩","大楼后边是一个书店和一个超市，邮局就在超市东边，那个楼是浅绿色的，上边还有英文，你一看就知道了。","Dàlóu hòubian shì yí ge shūdiàn hé yí ge chāoshì, yóujú jiù zài chāoshì dōngbian, nàge lóu shì qiǎn lǜsè de, shàngbian hái yǒu Yīngwén, nǐ yí kàn jiù zhīdào le.","Sau tòa nhà là một hiệu sách và một siêu thị, bưu điện ở ngay phía đông siêu thị, tòa nhà màu xanh lá nhạt, phía trên còn có chữ tiếng Anh, cậu nhìn là biết ngay."],
 ["马丁","谢谢了！","Xièxie le!","Cảm ơn nhé!"],
 ["崔浩","不客气。你快去吧，别忘了把护照带去。","Bú kèqi. Nǐ kuài qù ba, bié wàngle bǎ hùzhào dàiqu.","Không có gì. Cậu đi nhanh đi, đừng quên mang hộ chiếu theo."],
 ["马丁","忘不了。","Wàng bu liǎo.","Không quên được đâu."]],
 q:[["马丁去邮局干什么？","Mǎdīng qù yóujú gàn shénme?","Martin đến bưu điện làm gì?","去取妈妈寄来的感恩节礼物。","Đi nhận quà Lễ Tạ ơn mẹ gửi."],["邮局在哪儿？","Yóujú zài nǎr?","Bưu điện ở đâu?","在超市东边，是一个浅绿色的楼。","Ở phía đông siêu thị, tòa nhà màu xanh lá nhạt."]]}
],
notes:[
{k:["为了"],t:"为了: để, nhằm (mục đích)",s:"为了 + mục đích，(S) + V…",d:"为了 biểu thị mục đích, thường đứng đầu câu.",n:["Có thể dùng “…是为了…”: 学习是为了以后更好地工作。"],ex:["学习是为了以后更好地工作。|Xuéxí shì wèile yǐhòu gèng hǎo de gōngzuò.|Học là để sau này làm việc tốt hơn.","为了学好汉语，我来到中国。|Wèile xuéhǎo Hànyǔ, wǒ láidào Zhōngguó.|Để học giỏi tiếng Trung, tôi đến Trung Quốc.","为了练习听力，我每天都要听两个小时收音机。|Wèile liànxí tīnglì, wǒ měi tiān dōu yào tīng liǎng ge xiǎoshí shōuyīnjī.|Để luyện nghe, ngày nào tôi cũng nghe đài hai tiếng."]},
{k:["如果","就"],t:"如果…就…: nếu… thì…",s:"如果 + giả thiết，(S) + 就 + V",d:"如果 nêu giả thiết, vế sau thường dùng 就. Đôi khi có thể bỏ 如果.",n:["就 đứng sau chủ ngữ của vế sau: ✗就你来 → ✓你就来."],ex:["（如果）你想参加晚会，就给我打电话。|(Rúguǒ) nǐ xiǎng cānjiā wǎnhuì, jiù gěi wǒ dǎ diànhuà.|(Nếu) bạn muốn dự tiệc thì gọi điện cho tôi.","（如果）天气好，我就去爬山。|(Rúguǒ) tiānqì hǎo, wǒ jiù qù pá shān.|(Nếu) trời đẹp thì tôi đi leo núi.","（如果）不太贵，就可以买。|(Rúguǒ) bú tài guì, jiù kěyǐ mǎi.|(Nếu) không đắt lắm thì mua được.","（如果）你不去，他怎么办？|(Rúguǒ) nǐ bú qù, tā zěnme bàn?|(Nếu) bạn không đi thì anh ấy làm sao?"]},
{k:["是"],t:"Câu tồn tại (2): nơi chốn + 是 + người/vật",s:"Nơi chốn + 是 + N",d:"是 có thể biểu thị sự tồn tại: ở nơi đó là ai/cái gì (thường biết rõ chỉ có thứ đó).",n:["So sánh: N + 在 + nơi chốn (đồ vật ở đâu) ↔ nơi chốn + 是 + N (ở chỗ đó là gì)."],ex:["大楼后边是书店和超市。|Dàlóu hòubian shì shūdiàn hé chāoshì.|Phía sau tòa nhà là hiệu sách và siêu thị.","林娜左边是山田。|Línnà zuǒbian shì Shāntián.|Bên trái Lâm Na là Yamada.","友谊宾馆东边就是国际大厦。|Yǒuyì Bīnguǎn dōngbian jiù shì Guójì Dàshà.|Phía đông Khách sạn Hữu Nghị chính là Tòa nhà Quốc tế."]},
{k:["来","去","过去","回来","下来","带来","带去"],t:"Bổ ngữ xu hướng đơn: V + 来 / 去",s:"V + 来/去　|　V + nơi chốn + 来/去　|　V + 来/去 + O",d:"来: hành động hướng về phía người nói; 去: rời xa người nói. Các động từ hay gặp: 进, 出, 上, 下, 回, 过, 起, 带, 寄, 拿.",n:["Tân ngữ chỉ nơi chốn đặt giữa động từ và 来/去: 回宿舍去了, 进教室去 (✗回去宿舍).","Tân ngữ thường (vật) có thể đặt trước 来/去 hoặc sau: 带来了一个词典 / 带了一个词典来."],ex:["你们跟我一起过去吧。|Nǐmen gēn wǒ yìqǐ guòqu ba.|Các bạn cùng tôi qua đó nhé.","你什么时候回来？|Nǐ shénme shíhou huílai?|Khi nào bạn về?","他回宿舍去了。|Tā huí sùshè qu le.|Anh ấy về ký túc xá rồi.","他带来了一个电子词典。|Tā dàilaile yí ge diànzǐ cídiǎn.|Anh ấy mang đến một cuốn từ điển điện tử."]},
{k:["把"],t:"Câu chữ 把 (2): 把 + O + V + 来/去",s:"S + 把 + O + V + 来/去",d:"Dùng câu chữ 把 với bổ ngữ xu hướng 来/去 để nói mang/chuyển một vật xác định về phía/ra xa người nói.",n:[],ex:["您可以把朋友带来。|Nín kěyǐ bǎ péngyou dàilai.|Bạn có thể dẫn bạn bè đến.","妈妈把药寄来了。|Māma bǎ yào jìlai le.|Mẹ đã gửi thuốc đến.","马丁把我的词典拿去了。|Mǎdīng bǎ wǒ de cídiǎn náqu le.|Martin lấy từ điển của tôi đi rồi.","别忘了把护照带去。|Bié wàngle bǎ hùzhào dàiqu.|Đừng quên mang hộ chiếu theo."]}

{hz:"谈",py:"tán",pos:"động từ",vi:"nói chuyện, bàn",en:"talk, converse, chat",hv:"ĐÀM",t:3,ex:[["我们谈谈吧。","Wǒmen tántan ba.","Chúng ta nói chuyện chút nhé."],["他们在谈工作。","Tāmen zài tán gōngzuò.","Họ đang bàn chuyện công việc."]],tip:"Trang trọng hơn 聊."},

{hz:"经济",py:"jīngjì",pos:"danh từ",vi:"kinh tế",en:"economy",hv:"KINH TẾ",t:3,ex:[["中国经济发展得很快。","Zhōngguó jīngjì fāzhǎn de hěn kuài.","Kinh tế Trung Quốc phát triển rất nhanh."],["他是学经济的。","Tā shì xué jīngjì de.","Anh ấy học kinh tế."]],tip:"Hán Việt KINH TẾ."},
{hz:"发展",py:"fāzhǎn",pos:"danh từ / động từ",vi:"sự phát triển; phát triển",en:"development",hv:"PHÁT TRIỂN",t:3,ex:[["这个城市发展得很快。","Zhège chéngshì fāzhǎn de hěn kuài.","Thành phố này phát triển rất nhanh."],["经济发展很重要。","Jīngjì fāzhǎn hěn zhòngyào.","Phát triển kinh tế rất quan trọng."]],tip:"Hán Việt PHÁT TRIỂN."},
{hz:"变化",py:"biànhuà",pos:"danh từ",vi:"sự thay đổi",en:"change",hv:"BIẾN HÓA",t:3,ex:[["这几年家乡的变化很大。","Zhè jǐ nián jiāxiāng de biànhuà hěn dà.","Mấy năm nay quê hương thay đổi nhiều."],["天气变化很快。","Tiānqì biànhuà hěn kuài.","Thời tiết thay đổi rất nhanh."]],tip:"变 (động từ) – 变化 (danh từ)."},
{hz:"生活",py:"shēnghuó",pos:"danh từ",vi:"cuộc sống",en:"life",hv:"SINH HOẠT",t:3,ex:[["你习惯这儿的生活了吗？","Nǐ xíguàn zhèr de shēnghuó le ma?","Bạn quen cuộc sống ở đây chưa?"],["他们的生活很好。","Tāmen de shēnghuó hěn hǎo.","Cuộc sống của họ rất tốt."]],tip:"Còn là động từ: 在北京生活 (sống ở Bắc Kinh)."},
{hz:"比如",py:"bǐrú",pos:"động từ",vi:"ví dụ như",en:"for example, such as",hv:"TỶ NHƯ",t:3,ex:[["我喜欢水果，比如苹果、香蕉。","Wǒ xǐhuan shuǐguǒ, bǐrú píngguǒ, xiāngjiāo.","Tôi thích hoa quả, ví dụ táo, chuối."],["比如说，你可以每天听录音。","Bǐrú shuō, nǐ kěyǐ měi tiān tīng lùyīn.","Ví dụ, bạn có thể nghe băng mỗi ngày."]],tip:"= 例如."},
{hz:"留学",py:"liú xué",pos:"động từ",vi:"du học",en:"study abroad",hv:"LƯU HỌC",t:3,ex:[["我想去中国留学。","Wǒ xiǎng qù Zhōngguó liú xué.","Tôi muốn đi Trung Quốc du học."],["他在美国留过学。","Tā zài Měiguó liúguo xué.","Anh ấy từng du học ở Mỹ."]],tip:"留学生 = lưu học sinh."},
{hz:"普通",py:"pǔtōng",pos:"tính từ",vi:"bình thường, phổ thông",en:"common, ordinary",hv:"PHỔ THÔNG",t:3,ex:[["我是一个普通的学生。","Wǒ shì yí ge pǔtōng de xuésheng.","Tôi là một học sinh bình thường."],["他说普通话。","Tā shuō pǔtōnghuà.","Anh ấy nói tiếng phổ thông."]],tip:"普通话 = tiếng phổ thông (Quan thoại)."},
{hz:"像",py:"xiàng",pos:"động từ",vi:"giống",en:"be like",hv:"TƯỢNG",t:3,ex:[["他很像他爸爸。","Tā hěn xiàng tā bàba.","Cậu ấy rất giống bố."],["今天像春天一样暖和。","Jīntiān xiàng chūntiān yíyàng nuǎnhuo.","Hôm nay ấm như mùa xuân."]],tip:"像…一样 = giống như…"},
{hz:"那样",py:"nàyàng",pos:"đại từ",vi:"như thế, như vậy",en:"like that, such, so",hv:"NA DẠNG",t:3,ex:[["你别那样说。","Nǐ bié nàyàng shuō.","Bạn đừng nói thế."],["我也想像他那样说汉语。","Wǒ yě xiǎng xiàng tā nàyàng shuō Hànyǔ.","Tôi cũng muốn nói tiếng Trung như anh ấy."]],tip:"这样 (thế này) / 那样 (thế kia)."},
{hz:"方法",py:"fāngfǎ",pos:"danh từ",vi:"phương pháp, cách",en:"method, way, means",hv:"PHƯƠNG PHÁP",t:3,ex:[["你学汉语的方法很好。","Nǐ xué Hànyǔ de fāngfǎ hěn hǎo.","Phương pháp học tiếng Trung của bạn rất tốt."],["有没有好方法？","Yǒu méiyǒu hǎo fāngfǎ?","Có cách nào hay không?"]],tip:"Hán Việt PHƯƠNG PHÁP."}
],
texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"25-1",at:"25-2",sc:"“Tôi” kể chuyện nghe hiểu tiếng Trung.",
 lines:[["","上课的时候，我能听懂老师说的话。","Shàng kè de shíhou, wǒ néng tīngdǒng lǎoshī shuō de huà.","Trong giờ học, tôi nghe hiểu được lời thầy nói."],
 ["","可是到了大街上，很多中国人说的话我常常听不懂。","Kěshì dàole dàjiē shang, hěn duō Zhōngguó rén shuō de huà wǒ chángcháng tīng bu dǒng.","Nhưng ra ngoài phố, lời nhiều người Trung Quốc nói tôi thường nghe không hiểu."],
 ["","坐出租车的时候，虽然我很喜欢跟司机聊天儿，但是他们说话太快，我常常听不懂。","Zuò chūzūchē de shíhou, suīrán wǒ hěn xǐhuan gēn sījī liáo tiānr, dànshì tāmen shuō huà tài kuài, wǒ chángcháng tīng bu dǒng.","Khi đi taxi, tuy tôi rất thích nói chuyện với tài xế, nhưng họ nói nhanh quá, tôi thường nghe không hiểu."],
 ["","我生病住院的时候，也担心听不懂医生和护士说的话。","Wǒ shēng bìng zhù yuàn de shíhou, yě dānxīn tīng bu dǒng yīshēng hé hùshi shuō de huà.","Khi bị ốm nằm viện, tôi cũng lo nghe không hiểu lời bác sĩ và y tá."],
 ["","可是他们知道我是外国人，跟我说话很慢，我差不多都能听懂。","Kěshì tāmen zhīdào wǒ shì wàiguó rén, gēn wǒ shuō huà hěn màn, wǒ chàbuduō dōu néng tīngdǒng.","Nhưng họ biết tôi là người nước ngoài nên nói với tôi rất chậm, tôi gần như đều hiểu được."],
 ["","还有，很多中国人也喜欢跟我聊天儿。我每天能有机会跟这么多中国人练习汉语，感觉很不错。","Hái yǒu, hěn duō Zhōngguó rén yě xǐhuan gēn wǒ liáo tiānr. Wǒ měi tiān néng yǒu jīhuì gēn zhème duō Zhōngguó rén liànxí Hànyǔ, gǎnjué hěn búcuò.","Ngoài ra, nhiều người Trung Quốc cũng thích nói chuyện với tôi. Mỗi ngày có cơ hội luyện tiếng Trung với nhiều người như vậy, tôi thấy rất tuyệt."]],
 q:[["“我”能听懂一般中国人说的话吗？为什么？","“Wǒ” néng tīngdǒng yìbān Zhōngguó rén shuō de huà ma? Wèi shénme?","“Tôi” có nghe hiểu người Trung Quốc bình thường nói không? Vì sao?","常常听不懂，因为他们说话太快。","Thường không hiểu vì họ nói nhanh quá."],["“我”在医院的时候，能不能听懂医生和护士的话？","“Wǒ” zài yīyuàn de shíhou, néng bu néng tīngdǒng yīshēng hé hùshi de huà?","Ở bệnh viện “tôi” có hiểu lời bác sĩ, y tá không?","差不多都能听懂，因为他们跟我说话很慢。","Gần như hiểu hết, vì họ nói chậm."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"25-3",at:"25-4",sc:"Thôi Hạo ốm nằm viện, mọi người đến thăm.",
 lines:[["李一民","你现在感觉怎么样了？","Nǐ xiànzài gǎnjué zěnmeyàng le?","Bây giờ em thấy thế nào rồi?"],
 ["崔浩","好点儿了。我真想早点儿出院，回学校去。","Hǎo diǎnr le. Wǒ zhēn xiǎng zǎo diǎnr chū yuàn, huí xuéxiào qu.","Đỡ hơn rồi ạ. Em rất muốn sớm ra viện để về trường."],
 ["李一民","别着急，你应该好好儿休息休息。这是我包的饺子，你吃点儿吧。","Bié zháojí, nǐ yīnggāi hǎohāor xiūxi xiūxi. Zhè shì wǒ bāo de jiǎozi, nǐ chī diǎnr ba.","Đừng vội, em nên nghỉ ngơi cho tốt. Đây là sủi cảo thầy gói, em ăn chút đi."],
 ["崔浩","我真饿了。您做的饺子真好吃！","Wǒ zhēn è le. Nín zuò de jiǎozi zhēn hǎochī!","Em đói thật rồi. Sủi cảo thầy làm ngon quá!"],
 ["林娜","你看，这是你要的书和音乐光盘。有时间你可以听听音乐，看看书。","Nǐ kàn, zhè shì nǐ yào de shū hé yīnyuè guāngpán. Yǒu shíjiān nǐ kěyǐ tīngting yīnyuè, kànkan shū.","Cậu xem, đây là sách và đĩa nhạc cậu cần. Có thời gian thì nghe nhạc, đọc sách."],
 ["马丁","这是你喜欢的水果。","Zhè shì nǐ xǐhuan de shuǐguǒ.","Đây là hoa quả cậu thích."],
 ["崔浩","谢谢你们的关心！","Xièxie nǐmen de guānxīn!","Cảm ơn mọi người đã quan tâm!"]],
 q:[["崔浩身体现在怎么样了？","Cuī Hào shēntǐ xiànzài zěnmeyàng le?","Thôi Hạo giờ sức khỏe thế nào?","好点儿了。","Đỡ hơn rồi."],["崔浩的同学和老师给他带来了什么东西？","Cuī Hào de tóngxué hé lǎoshī gěi tā dàilaile shénme dōngxi?","Bạn và thầy mang đến cho Thôi Hạo những gì?","饺子、书、音乐光盘和水果。","Sủi cảo, sách, đĩa nhạc và hoa quả."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"25-5",at:"25-6",sc:"Martin hỏi Thôi Hạo chuyện nói chuyện với người Trung Quốc.",
 lines:[["马丁","你和中国人一起聊天儿，能听懂他们说的话吗？","Nǐ hé Zhōngguó rén yìqǐ liáo tiānr, néng tīngdǒng tāmen shuō de huà ma?","Cậu nói chuyện với người Trung Quốc, có nghe hiểu họ nói không?"],
 ["崔浩","大部分能听懂，只有一小部分听不懂。","Dà bùfen néng tīngdǒng, zhǐ yǒu yì xiǎo bùfen tīng bu dǒng.","Phần lớn hiểu được, chỉ một phần nhỏ không hiểu."],
 ["马丁","你们都谈些什么呢？","Nǐmen dōu tán xiē shénme ne?","Các cậu nói những chuyện gì?"],
 ["崔浩","谈中国的经济发展，中国的变化，中国人的生活。当然也谈韩国的事情。","Tán Zhōngguó de jīngjì fāzhǎn, Zhōngguó de biànhuà, Zhōngguó rén de shēnghuó. Dāngrán yě tán Hánguó de shìqing.","Nói về phát triển kinh tế Trung Quốc, sự thay đổi của Trung Quốc, cuộc sống người Trung Quốc. Đương nhiên cũng nói chuyện Hàn Quốc."],
 ["马丁","他们对什么事情感兴趣？","Tāmen duì shénme shìqing gǎn xìngqù?","Họ quan tâm đến chuyện gì?"],
 ["崔浩","比如，来中国留学的韩国人为什么那么多？普通韩国人的生活真的像电视上那样吗？","Bǐrú, lái Zhōngguó liú xué de Hánguó rén wèi shénme nàme duō? Pǔtōng Hánguó rén de shēnghuó zhēn de xiàng diànshì shang nàyàng ma?","Ví dụ, tại sao người Hàn đến Trung Quốc du học nhiều thế? Cuộc sống người Hàn bình thường có thật như trên ti vi không?"],
 ["马丁","这些问题很有意思。虽然你学汉语的时间不长，但是你学到的东西很多。","Zhèxiē wèntí hěn yǒu yìsi. Suīrán nǐ xué Hànyǔ de shíjiān bù cháng, dànshì nǐ xuédào de dōngxi hěn duō.","Những câu hỏi này thú vị thật. Tuy cậu học tiếng Trung chưa lâu nhưng học được rất nhiều thứ."],
 ["崔浩","是啊，多听、多说是练习汉语最好的方法。","Shì a, duō tīng, duō shuō shì liànxí Hànyǔ zuì hǎo de fāngfǎ.","Đúng vậy, nghe nhiều, nói nhiều là cách luyện tiếng Trung tốt nhất."]],
 q:[["崔浩和中国人一起聊天儿都聊什么？","Cuī Hào hé Zhōngguó rén yìqǐ liáo tiānr dōu liáo shénme?","Thôi Hạo nói chuyện gì với người Trung Quốc?","中国的经济发展、中国的变化、中国人的生活，还有韩国的事情。","Phát triển kinh tế, thay đổi của Trung Quốc, cuộc sống người Trung Quốc và chuyện Hàn Quốc."],["中国人问崔浩什么？","Zhōngguó rén wèn Cuī Hào shénme?","Người Trung Quốc hỏi Thôi Hạo điều gì?","来中国留学的韩国人为什么那么多，普通韩国人的生活是不是像电视上那样。","Vì sao nhiều người Hàn du học Trung Quốc; cuộc sống người Hàn có như trên ti vi không."]]}
],
notes:[
{k:["的"],t:"Định ngữ (2): động từ / cụm động từ / cụm chủ–vị + 的 + N",s:"V / VP / S-P + 的 + N",d:"Khi động từ, cụm động từ hoặc cụm chủ–vị làm định ngữ, giữa định ngữ và danh từ trung tâm phải có 的: 喜欢吃的水果, 学到的东西, 我做的饺子, 他们说的话.",n:["Không bỏ 的: ✗我买苹果很不错 → ✓我买的苹果很不错。","Có số từ, lượng từ thì đặt sau 的: 我昨天买的那本书."],ex:["超市里吃的东西真多。|Chāoshì li chī de dōngxi zhēn duō.|Trong siêu thị đồ ăn nhiều thật.","我买的苹果很不错。|Wǒ mǎi de píngguǒ hěn búcuò.|Táo tôi mua khá ngon.","这是你要的书和音乐光盘。|Zhè shì nǐ yào de shū hé yīnyuè guāngpán.|Đây là sách và đĩa nhạc bạn cần.","练习汉语的方法很多。|Liànxí Hànyǔ de fāngfǎ hěn duō.|Có nhiều cách luyện tiếng Trung."]},
{k:["听不懂","听得懂"],t:"听不懂 / 听得懂",s:"V + 不 + 懂 (không thể hiểu)　|　V + 得 + 懂 (có thể hiểu)",d:"听不懂 nghĩa là nghe không hiểu được (không có khả năng), là dạng phủ định của 听得懂.",n:["Khác 没听懂 (lần này đã không hiểu). ✗听得不懂."],ex:["他说得太快，我听不懂。|Tā shuō de tài kuài, wǒ tīng bu dǒng.|Anh ấy nói nhanh quá, tôi nghe không hiểu.","老师说的话，我听得懂。|Lǎoshī shuō de huà, wǒ tīng de dǒng.|Lời thầy nói tôi nghe hiểu được.","这本书我看得懂。|Zhè běn shū wǒ kàn de dǒng.|Quyển sách này tôi đọc hiểu được."]},
{k:["虽然","但是","可是","还是"],t:"虽然…，但是/可是/还是…",s:"虽然 + A，但是/可是 + B",d:"虽然 ở vế trước thừa nhận một sự thật; vế sau dùng 但是, 可是, 还是… để chuyển ý: “tuy… nhưng…”.",n:["Có thể bỏ 虽然, nhưng không nên bỏ 但是/可是 ở vế sau."],ex:["我虽然喜欢喝咖啡，可是不常喝。|Wǒ suīrán xǐhuan hē kāfēi, kěshì bù cháng hē.|Tôi tuy thích cà phê nhưng không hay uống.","虽然已经冬天了，天气还是很暖和。|Suīrán yǐjīng dōngtiān le, tiānqì háishi hěn nuǎnhuo.|Tuy đã là mùa đông nhưng trời vẫn ấm.","虽然他学汉语的时间不长，但是说得很好。|Suīrán tā xué Hànyǔ de shíjiān bù cháng, dànshì shuō de hěn hǎo.|Tuy học tiếng Trung chưa lâu nhưng anh ấy nói rất giỏi."]},
{k:["好好儿"],t:"好好儿: làm cho thật tốt, hết mình",s:"好好儿 + V",d:"好好儿 là phó từ làm trạng ngữ trước động từ: làm việc gì đó tận tâm, trọn vẹn, thỏa thích.",n:[],ex:["我一定要好好儿学习。|Wǒ yídìng yào hǎohāor xuéxí.|Tôi nhất định phải học hành tử tế.","我们想好好儿玩儿两天。|Wǒmen xiǎng hǎohāor wánr liǎng tiān.|Chúng tôi muốn chơi thỏa thích hai ngày.","这件事我要好好儿想想。|Zhè jiàn shì wǒ yào hǎohāor xiǎngxiang.|Việc này tôi phải nghĩ kỹ."]}
],
gex:[
 {q:"这是我昨天买___书。|Zhè shì wǒ zuótiān mǎi ___ shū.|Đây là sách tôi mua hôm qua.",o:["的","了","得","地"],a:0,e:"Cụm chủ–vị làm định ngữ + 的."},

{hz:"不同",py:"bù tóng",pos:"tính từ",vi:"khác nhau, không giống",en:"different",hv:"BẤT ĐỒNG",t:1,ex:[["我们俩的爱好不同。","Wǒmen liǎ de àihào bù tóng.","Sở thích của hai chúng tôi khác nhau."],["不同的国家有不同的节日。","Bù tóng de guójiā yǒu bù tóng de jiérì.","Các nước khác nhau có ngày lễ khác nhau."]],tip:"Ngược nghĩa: 一样, 相同."},
{hz:"利用",py:"lìyòng",pos:"động từ",vi:"tận dụng, lợi dụng",en:"make use of, take advantage of",hv:"LỢI DỤNG",t:1,ex:[["他利用周末学开车。","Tā lìyòng zhōumò xué kāi chē.","Anh ấy tranh thủ cuối tuần học lái xe."],["我们要好好儿利用时间。","Wǒmen yào hǎohāor lìyòng shíjiān.","Chúng ta phải tận dụng tốt thời gian."]],tip:"利用 + thời gian/cơ hội + V."},
{hz:"饭店",py:"fàndiàn",pos:"danh từ",vi:"khách sạn; nhà hàng",en:"hotel, restaurant",hv:"PHẠN ĐIẾM",t:1,ex:[["这家饭店的菜很好吃。","Zhè jiā fàndiàn de cài hěn hǎochī.","Món ăn ở nhà hàng này rất ngon."],["他们住在北京饭店。","Tāmen zhù zài Běijīng Fàndiàn.","Họ ở khách sạn Bắc Kinh."]],tip:"Có thể chỉ khách sạn lớn hoặc nhà hàng."},
{hz:"迎接",py:"yíngjiē",pos:"động từ",vi:"đón, chào đón",en:"meet, welcome",hv:"NGHÊNH TIẾP",t:2,ex:[["我们去机场迎接客人。","Wǒmen qù jīchǎng yíngjiē kèrén.","Chúng tôi ra sân bay đón khách."],["大家都在迎接新年。","Dàjiā dōu zài yíngjiē xīnnián.","Mọi người đều đang đón năm mới."]],tip:"Hán Việt NGHÊNH TIẾP."},
{hz:"各种",py:"gè zhǒng",pos:"đại từ",vi:"các loại, đủ loại",en:"all kinds of, various",hv:"CÁC CHỦNG",t:2,ex:[["这儿有各种水果。","Zhèr yǒu gè zhǒng shuǐguǒ.","Ở đây có đủ loại hoa quả."],["他会说各种语言。","Tā huì shuō gè zhǒng yǔyán.","Anh ấy nói được nhiều thứ tiếng."]],tip:"各种 + N (thường có 的: 各种各样的)."},
{hz:"市场",py:"shìchǎng",pos:"danh từ",vi:"chợ, thị trường",en:"market",hv:"THỊ TRƯỜNG",t:2,ex:[["妈妈去市场买菜了。","Māma qù shìchǎng mǎi cài le.","Mẹ đi chợ mua rau rồi."],["这个市场很大。","Zhège shìchǎng hěn dà.","Cái chợ này rất lớn."]],tip:"Hán Việt THỊ TRƯỜNG."},
{hz:"到处",py:"dàochù",pos:"phó từ",vi:"khắp nơi",en:"everywhere",hv:"ĐÁO XỨ",t:2,ex:[["春节的时候到处都很热闹。","Chūn Jié de shíhou dàochù dōu hěn rènao.","Dịp Tết khắp nơi đều náo nhiệt."],["我到处找你。","Wǒ dàochù zhǎo nǐ.","Tôi tìm bạn khắp nơi."]],tip:"Hay đi với 都: 到处都是…"},
{hz:"教堂",py:"jiàotáng",pos:"danh từ",vi:"nhà thờ",en:"church",hv:"GIÁO ĐƯỜNG",t:2,ex:[["这座教堂很有名。","Zhè zuò jiàotáng hěn yǒumíng.","Nhà thờ này rất nổi tiếng."],["教堂前边有很多人。","Jiàotáng qiánbian yǒu hěn duō rén.","Trước nhà thờ có nhiều người."]],tip:"Hán Việt GIÁO ĐƯỜNG."},
{hz:"全",py:"quán",pos:"tính từ",vi:"toàn, cả",en:"whole, total",hv:"TOÀN",t:2,ex:[["全班同学都来了。","Quán bān tóngxué dōu lái le.","Cả lớp đều đến."],["全家人一起吃饭。","Quán jiā rén yìqǐ chī fàn.","Cả nhà cùng ăn cơm."]],tip:"全 + N: 全家, 全班, 全国."},
{hz:"唱歌",py:"chàng gē",pos:"động từ",vi:"hát",en:"sing (a song)",hv:"XƯỚNG CA",t:2,ex:[["她唱歌唱得很好听。","Tā chàng gē chàng de hěn hǎotīng.","Cô ấy hát rất hay."],["我们去唱歌吧。","Wǒmen qù chàng gē ba.","Mình đi hát karaoke nhé."]],tip:"Ly hợp: 唱一首歌."},
{hz:"跳舞",py:"tiào wǔ",pos:"động từ",vi:"nhảy múa",en:"dance",hv:"KHIÊU VŨ",t:2,ex:[["你会跳舞吗？","Nǐ huì tiào wǔ ma?","Bạn biết nhảy không?"],["她跳舞跳得很漂亮。","Tā tiào wǔ tiào de hěn piàoliang.","Cô ấy nhảy rất đẹp."]],tip:"Ly hợp: 跳一个舞. Có bổ ngữ phải lặp động từ: 跳舞跳得…"},
{hz:"孩子",py:"háizi",pos:"danh từ",vi:"trẻ em, con",en:"child",hv:"HÀI TỬ",t:2,ex:[["孩子们都很喜欢过节。","Háizimen dōu hěn xǐhuan guò jié.","Bọn trẻ đều rất thích ngày lễ."],["他有两个孩子。","Tā yǒu liǎng ge háizi.","Anh ấy có hai đứa con."]],tip:"孩子们 = các em nhỏ."},
{hz:"家人",py:"jiārén",pos:"danh từ",vi:"người nhà",en:"family member",hv:"GIA NHÂN",t:2,ex:[["我很想家人。","Wǒ hěn xiǎng jiārén.","Tôi rất nhớ người nhà."],["周末我常常跟家人在一起。","Zhōumò wǒ chángcháng gēn jiārén zài yìqǐ.","Cuối tuần tôi hay ở bên gia đình."]],tip:"家 + 人."},
{hz:"打算",py:"dǎsuàn",pos:"động từ / danh từ",vi:"dự định",en:"plan, intend",hv:"ĐẢ TOÁN",t:3,ex:[["明年你有什么打算？","Míngnián nǐ yǒu shénme dǎsuàn?","Năm sau bạn có dự định gì?"],["我打算学开车。","Wǒ dǎsuàn xué kāi chē.","Tôi định học lái xe."]],tip:"打算 + V."},
{hz:"外地",py:"wàidì",pos:"danh từ",vi:"nơi khác, tỉnh khác",en:"other places",hv:"NGOẠI ĐỊA",t:3,ex:[["他是外地人。","Tā shì wàidì rén.","Anh ấy là người nơi khác."],["我哥哥在外地工作。","Wǒ gēge zài wàidì gōngzuò.","Anh tôi làm việc ở tỉnh khác."]],tip:"Ngược nghĩa: 本地."},
{hz:"附近",py:"fùjìn",pos:"danh từ",vi:"gần đây, lân cận",en:"nearby",hv:"PHỤ CẬN",t:3,ex:[["这附近有银行吗？","Zhè fùjìn yǒu yínháng ma?","Gần đây có ngân hàng không?"],["我住在学校附近。","Wǒ zhù zài xuéxiào fùjìn.","Tôi sống gần trường."]],tip:"Nơi chốn + 附近."},
{hz:"考试",py:"kǎo shì",pos:"động từ / danh từ",vi:"thi; kỳ thi",en:"take an examination",hv:"KHẢO THÍ",t:3,ex:[["明天考什么试？","Míngtiān kǎo shénme shì?","Mai thi môn gì?"],["这次考试不太难。","Zhè cì kǎoshì bú tài nán.","Kỳ thi lần này không khó lắm."]],tip:"Ly hợp: 考三天试, 考过试."},
{hz:"认真",py:"rènzhēn",pos:"tính từ",vi:"chăm chỉ, nghiêm túc",en:"conscientious, earnest",hv:"NHẬN CHÂN",t:3,ex:[["她工作很认真。","Tā gōngzuò hěn rènzhēn.","Cô ấy làm việc rất nghiêm túc."],["请认真听。","Qǐng rènzhēn tīng.","Hãy nghe chăm chú."]],tip:"认真 + V: 认真学习, 认真准备."},
{hz:"要是",py:"yàoshi",pos:"liên từ",vi:"nếu",en:"if, suppose",hv:"YẾU THỊ",t:3,ex:[["要是明天下雨，我们就不去了。","Yàoshi míngtiān xià yǔ, wǒmen jiù bú qù le.","Nếu mai mưa thì chúng ta không đi nữa."],["要是你累了，就休息一下。","Yàoshi nǐ lèi le, jiù xiūxi yíxià.","Nếu mệt thì nghỉ một lát."]],tip:"= 如果 (khẩu ngữ); 要是…的话."},
{hz:"没意思",py:"méi yìsi",pos:"cụm từ",vi:"chán, vô vị",en:"boring",hv:"",t:3,ex:[["这个电影真没意思。","Zhège diànyǐng zhēn méi yìsi.","Bộ phim này chán thật."],["天天在家，太没意思了。","Tiāntiān zài jiā, tài méi yìsi le.","Ngày nào cũng ở nhà, chán quá."]],tip:"Ngược nghĩa: 有意思."}
],
texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"26-1",at:"26-2",sc:"Martin đi mua quà Giáng sinh.",
 lines:[["","圣诞节快要到了，许多商店都开始卖过圣诞节用的东西。","Shèngdàn Jié kuàiyào dào le, xǔduō shāngdiàn dōu kāishǐ mài guò Shèngdàn Jié yòng de dōngxi.","Giáng sinh sắp đến, nhiều cửa hàng bắt đầu bán đồ dùng cho Giáng sinh."],
 ["","有一天，马丁去一家商店买圣诞礼物，没想到商店里圣诞节用的东西那么丰富，买的人也不少。","Yǒu yì tiān, Mǎdīng qù yì jiā shāngdiàn mǎi Shèngdàn lǐwù, méi xiǎngdào shāngdiàn li Shèngdàn Jié yòng de dōngxi nàme fēngfù, mǎi de rén yě bù shǎo.","Một hôm, Martin đến một cửa hàng mua quà Giáng sinh, không ngờ đồ Giáng sinh trong cửa hàng phong phú như vậy, người mua cũng không ít."],
 ["","他问营业员：“中国也过圣诞节吗？”","Tā wèn yíngyèyuán: “Zhōngguó yě guò Shèngdàn Jié ma?”","Anh hỏi nhân viên bán hàng: “Trung Quốc cũng đón Giáng sinh à?”"],
 ["","营业员说：“以前中国人不过圣诞节。但是现在不同了，很多人喜欢过圣诞节，特别是年轻人，他们想利用这个机会玩儿一玩儿，商店、饭店也利用这个机会挣钱。”","Yíngyèyuán shuō: “Yǐqián Zhōngguó rén bú guò Shèngdàn Jié. Dànshì xiànzài bù tóng le, hěn duō rén xǐhuan guò Shèngdàn Jié, tèbié shì niánqīng rén, tāmen xiǎng lìyòng zhège jīhuì wánr yi wánr, shāngdiàn, fàndiàn yě lìyòng zhège jīhuì zhèng qián.”","Nhân viên nói: “Trước đây người Trung Quốc không đón Giáng sinh. Nhưng giờ khác rồi, nhiều người thích đón Giáng sinh, đặc biệt là người trẻ, họ muốn nhân dịp này đi chơi, cửa hàng, nhà hàng cũng nhân dịp này kiếm tiền.”"]],
 q:[["中国人过圣诞节吗？","Zhōngguó rén guò Shèngdàn Jié ma?","Người Trung Quốc có đón Giáng sinh không?","以前不过，现在很多人喜欢过圣诞节。","Trước không, giờ nhiều người thích đón."],["为什么现在有很多中国人喜欢过圣诞节？","Wèi shénme xiànzài yǒu hěn duō Zhōngguó rén xǐhuan guò Shèngdàn Jié?","Vì sao nay nhiều người Trung Quốc thích đón Giáng sinh?","年轻人想利用这个机会玩儿一玩儿。","Người trẻ muốn nhân dịp này đi chơi."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"26-3",at:"26-4",sc:"Chu Vân hỏi Lâm Na người Pháp đón Giáng sinh thế nào.",
 lines:[["朱云","要过圣诞节了。你们那儿圣诞节以前做什么呢？","Yào guò Shèngdàn Jié le. Nǐmen nàr Shèngdàn Jié yǐqián zuò shénme ne?","Sắp Giáng sinh rồi. Bên các bạn trước Giáng sinh làm gì?"],
 ["林娜","为了迎接圣诞节，我们在圣诞节以前四个星期就开始准备了。我们要准备圣诞礼物、酒，还有各种好吃的。","Wèile yíngjiē Shèngdàn Jié, wǒmen zài Shèngdàn Jié yǐqián sì ge xīngqī jiù kāishǐ zhǔnbèi le. Wǒmen yào zhǔnbèi Shèngdàn lǐwù, jiǔ, hái yǒu gè zhǒng hǎochī de.","Để đón Giáng sinh, trước đó bốn tuần chúng mình đã bắt đầu chuẩn bị. Phải chuẩn bị quà, rượu và đủ món ngon."],
 ["林娜","商店里、圣诞市场里，到处都是买东西的人，非常热闹。","Shāngdiàn li, Shèngdàn shìchǎng li, dàochù dōu shì mǎi dōngxi de rén, fēicháng rènao.","Trong cửa hàng, ở chợ Giáng sinh, khắp nơi đều là người mua sắm, rất náo nhiệt."],
 ["朱云","12月24日晚上你们做什么呢？","Shí'èr yuè èrshísì rì wǎnshang nǐmen zuò shénme ne?","Tối 24/12 các bạn làm gì?"],
 ["林娜","我们一般先去教堂参加活动，然后全家一起吃晚饭。我们唱歌、跳舞、聊天儿、喝酒，非常快乐。","Wǒmen yìbān xiān qù jiàotáng cānjiā huódòng, ránhòu quán jiā yìqǐ chī wǎnfàn. Wǒmen chàng gē, tiào wǔ, liáo tiānr, hē jiǔ, fēicháng kuàilè.","Thường thì trước tiên đến nhà thờ dự lễ, rồi cả nhà cùng ăn tối. Hát, nhảy, trò chuyện, uống rượu, rất vui."],
 ["朱云","听说你们会收到很多圣诞礼物。","Tīngshuō nǐmen huì shōudào hěn duō Shèngdàn lǐwù.","Nghe nói các bạn nhận được nhiều quà Giáng sinh lắm."],
 ["林娜","没错儿。最高兴的是孩子们，他们会收到许许多多的礼物。","Méi cuòr. Zuì gāoxìng de shì háizimen, tāmen huì shōudào xǔxǔduōduō de lǐwù.","Đúng vậy. Vui nhất là bọn trẻ, chúng nhận được rất nhiều quà."],
 ["朱云","要过圣诞节了，你给家人买礼物了吗？","Yào guò Shèngdàn Jié le, nǐ gěi jiārén mǎi lǐwù le ma?","Sắp Giáng sinh rồi, bạn mua quà cho người nhà chưa?"],
 ["林娜","当然买了。我已经给他们寄去了，他们也给我寄来了礼物。","Dāngrán mǎi le. Wǒ yǐjīng gěi tāmen jìqu le, tāmen yě gěi wǒ jìlaile lǐwù.","Tất nhiên mua rồi. Mình đã gửi đi cho họ, họ cũng gửi quà đến cho mình."]],
 q:[["圣诞节以前，法国人一般要准备什么？","Shèngdàn Jié yǐqián, Fǎguó rén yìbān yào zhǔnbèi shénme?","Trước Giáng sinh người Pháp thường chuẩn bị gì?","准备圣诞礼物、酒，还有各种好吃的。","Quà, rượu và đủ món ngon."],["法国人怎么过圣诞节？","Fǎguó rén zěnme guò Shèngdàn Jié?","Người Pháp đón Giáng sinh thế nào?","先去教堂参加活动，然后全家一起吃晚饭，唱歌、跳舞、聊天儿。","Đến nhà thờ, rồi cả nhà ăn tối, hát, nhảy, trò chuyện."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"26-5",at:"26-6",sc:"Các bạn bàn kế hoạch nghỉ Giáng sinh.",
 lines:[["崔浩","听说圣诞节要放五天假，你们想怎么过啊？","Tīngshuō Shèngdàn Jié yào fàng wǔ tiān jià, nǐmen xiǎng zěnme guò a?","Nghe nói Giáng sinh được nghỉ năm ngày, các cậu định đón thế nào?"],
 ["马丁","我父母下个星期就要来北京了，我打算和他们一起到外地去旅游。你呢？","Wǒ fùmǔ xià ge xīngqī jiù yào lái Běijīng le, wǒ dǎsuàn hé tāmen yìqǐ dào wàidì qù lǚyóu. Nǐ ne?","Tuần sau bố mẹ mình đến Bắc Kinh rồi, mình định cùng họ đi du lịch tỉnh khác. Còn cậu?"],
 ["崔浩","我想在附近玩儿一玩儿。","Wǒ xiǎng zài fùjìn wánr yi wánr.","Mình muốn chơi loanh quanh gần đây."],
 ["山田","圣诞节以后我们就要考试了，我想在家学习。","Shèngdàn Jié yǐhòu wǒmen jiù yào kǎo shì le, wǒ xiǎng zài jiā xuéxí.","Sau Giáng sinh là thi rồi, mình muốn ở nhà học."],
 ["马丁","放假也不休息啊？你学习也太认真了。","Fàng jià yě bù xiūxi a? Nǐ xuéxí yě tài rènzhēn le.","Nghỉ mà cũng không nghỉ ngơi à? Cậu chăm học quá."],
 ["崔浩","要是不放假呢？","Yàoshi bú fàng jià ne?","Nếu không được nghỉ thì sao?"],
 ["马丁","要是不放假，我就不能去旅游了。不放假就太没意思了。","Yàoshi bú fàng jià, wǒ jiù bù néng qù lǚyóu le. Bú fàng jià jiù tài méi yìsi le.","Nếu không nghỉ thì mình không đi du lịch được. Không nghỉ thì chán lắm."]],

{k:["快要","就要","要","快"],t:"要/快/就要/快要 + V (+ O) + 了: sắp… rồi",s:"(S) + 要/快/就要/快要 + V (+ O) + 了",d:"Biểu thị động tác/sự việc sắp xảy ra. Trước 就要…了 có thể có trạng ngữ thời gian; 快要…了 và 快…了 thì KHÔNG dùng với thời gian cụ thể.",n:["✓我父母下个星期就要来北京了。 ✗我父母下个星期快要来北京了。","快 + danh từ/số lượng + 了: 快十二点了, 快春节了."],ex:["要过圣诞节了。|Yào guò Shèngdàn Jié le.|Sắp Giáng sinh rồi.","快考试了。|Kuài kǎo shì le.|Sắp thi rồi.","天快要下雨了。|Tiān kuàiyào xià yǔ le.|Trời sắp mưa rồi.","他明天就要回国了。|Tā míngtiān jiù yào huí guó le.|Mai anh ấy về nước rồi."]},

{k:["放假","考试","见面","洗澡","睡觉","聊天儿","帮忙","请客","排队","生气"],t:"Từ ly hợp (离合词)",s:"V + (了/过/số lượng/bổ ngữ/định ngữ) + O",d:"Các từ như 放假, 考试, 见面, 洗澡, 睡觉, 聊天儿, 帮忙, 排队, 请客, 生气, 旅游 có thể dùng liền, cũng có thể tách ra chèn thành phần khác vào giữa: 放五天假, 考过试, 见个面, 聊一会儿天儿, 帮很多忙, 生我的气.",n:["Ly hợp không mang tân ngữ trực tiếp: ✗帮忙我 → ✓帮我的忙 / 帮我; ✗生气我 → ✓生我的气.","Số lượng/thời lượng đặt giữa: ✗放假九天 → ✓放九天假."],ex:["春节我们放九天假。|Chūn Jié wǒmen fàng jiǔ tiān jià.|Tết chúng tôi nghỉ chín ngày.","我们见个面吧。|Wǒmen jiàn ge miàn ba.|Chúng ta gặp nhau chút nhé.","他帮了我很多忙。|Tā bāngle wǒ hěn duō máng.|Anh ấy giúp tôi rất nhiều.","我们聊了一会儿天儿。|Wǒmen liáole yíhuìr tiānr.|Chúng tôi trò chuyện một lúc."]},

{h:"六. Đặt câu với 快……了 / 要……了 / 快要……了 / 就要……了",type:"open",items:[{q:"12月25号是圣诞节，今天已经是12月20号了。",a:["圣诞节快要到了。"]},{q:"妈妈说她星期六来中国，今天已经星期四了。",a:["妈妈后天就要来中国了。"]},{q:"王老师说第十周期中考试，现在是第九周了。",a:["我们下星期就要期中考试了。"]},{q:"张东说他今天晚上七点半来找我，现在已经七点二十了。",a:["张东快要来了。"]},{q:"这本书一共420页，我已经看了400页了。",a:["这本书我快要看完了。"]},{q:"爸爸11月8号回国，今天是11月5号了。",a:["爸爸8号就要回国了。"]},{q:"运动会9月20号开始，今天是9月10号了。",a:["运动会快要开始了。"]},{q:"从美国来的飞机九点到，现在已经八点半了。",a:["从美国来的飞机快要到了。"]}]},
{h:"七. Dịch sang tiếng Hán (đáp án gợi ý)",type:"open",tr:1,items:[{q:"Để chào đón năm mới, tôi dự định tổ chức bữa tiệc tại nhà hàng Trung Quốc.",a:["为了迎接新年，我打算在中国饭店举行晚会。"]},{q:"Vào đêm Noel rất nhiều người thích đến nhà thờ, cùng chụp ảnh và hát.",a:["圣诞节晚上很多人喜欢去教堂，一起照相、唱歌。"]},{q:"Tết đến người vui nhất vẫn là trẻ em, tất cả trẻ em đều nhận được rất nhiều quà.",a:["春节的时候最高兴的还是孩子们，所有的孩子都会收到许多礼物。"]},{q:"Tuần sau công ty nghỉ lễ 3 ngày, chúng tôi dự định ra ngoại ô chơi.",a:["下星期公司放三天假，我们打算去郊区玩儿。"]},{q:"Nếu cô giáo biết tình hình của bạn hiện nay, chắc chắn cô sẽ rất vui.",a:["要是老师知道你现在的情况，一定会很高兴。"]},{q:"Anh ấy đã giúp đỡ tôi rất nhiều, hôm nay tôi sẽ mời anh ấy đi ăn.",a:["他帮了我很多忙，今天我要请他吃饭。"]},{q:"Nghỉ lễ mà bạn vẫn làm việc cơ à, bạn chăm học thế!",a:["放假你也不休息啊？你学习也太认真了！"]},{q:"Nghe nói Trung Thu năm nay sẽ nghỉ lễ 4 ngày, bạn định làm gì?",a:["听说今年中秋节要放四天假，你打算做什么？"]}]}

texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"27-1",at:"27-2",sc:"“Tôi” đến công viên buổi sáng.",
 lines:[["","很多中国人有早起的习惯，我很想了解一下他们早上都做些什么。","Hěn duō Zhōngguó rén yǒu zǎo qǐ de xíguàn, wǒ hěn xiǎng liǎojiě yíxià tāmen zǎoshang dōu zuò xiē shénme.","Nhiều người Trung Quốc có thói quen dậy sớm, tôi rất muốn tìm hiểu buổi sáng họ làm những gì."],
 ["","今天是星期六，我五点半就起床了，我想到学校附近的公园里去看看。","Jīntiān shì xīngqīliù, wǒ wǔ diǎn bàn jiù qǐ chuáng le, wǒ xiǎng dào xuéxiào fùjìn de gōngyuán li qù kànkan.","Hôm nay thứ Bảy, năm rưỡi tôi đã dậy, tôi muốn đến công viên gần trường xem thử."],
 ["","我到公园的时候才六点钟，那里人已经很多了。","Wǒ dào gōngyuán de shíhou cái liù diǎnzhōng, nàli rén yǐjīng hěn duō le.","Khi tôi đến công viên mới sáu giờ, mà ở đó đã rất đông người."],
 ["","路上有的人正在跑步，有的人一边散步，一边听收音机；","Lùshang yǒude rén zhèngzài pǎo bù, yǒude rén yìbiān sàn bù, yìbiān tīng shōuyīnjī;","Trên đường có người đang chạy bộ, có người vừa đi dạo vừa nghe đài;"],
 ["","大树下边有许多人在打太极拳，也有一些人在跳舞，湖边还有人正坐在椅子上看书……","dà shù xiàbian yǒu xǔduō rén zài dǎ tàijíquán, yě yǒu yìxiē rén zài tiào wǔ, hú biān hái yǒu rén zhèng zuò zài yǐzi shang kàn shū……","dưới gốc cây lớn nhiều người đang tập Thái cực quyền, cũng có người đang nhảy múa, bên hồ còn có người đang ngồi trên ghế đọc sách……"]],
 q:[["很多中国人有什么习惯？","Hěn duō Zhōngguó rén yǒu shénme xíguàn?","Nhiều người Trung Quốc có thói quen gì?","有早起的习惯。","Thói quen dậy sớm."],["“我”到公园以后，看见人们都在做什么？","“Wǒ” dào gōngyuán yǐhòu, kànjiàn rénmen dōu zài zuò shénme?","Đến công viên “tôi” thấy mọi người đang làm gì?","有的人在跑步，有的人在散步，有的人在打太极拳，有的人在跳舞，还有人在看书。","Chạy bộ, đi dạo, tập Thái cực quyền, nhảy múa, đọc sách."]]},
{n:2,title:"Bài khóa 2 · Gọi điện",vt:"27-3",at:"27-4",sc:"Martin gọi điện cho A Minh.",
 lines:[["马丁","阿明，我给你打了两个电话，你都没接，你在忙什么呢？","Ā Míng, wǒ gěi nǐ dǎle liǎng ge diànhuà, nǐ dōu méi jiē, nǐ zài máng shénme ne?","A Minh, mình gọi cậu hai cuộc mà cậu đều không nghe, cậu đang bận gì thế?"],
 ["阿明","对不起，我没听见。我正在看电视呢。","Duìbuqǐ, wǒ méi tīngjiàn. Wǒ zhèngzài kàn diànshì ne.","Xin lỗi, mình không nghe thấy. Mình đang xem tivi."],
 ["马丁","看什么呢？","Kàn shénme ne?","Xem gì thế?"],
 ["阿明","看足球比赛呢。你找我有什么事？","Kàn zúqiú bǐsài ne. Nǐ zhǎo wǒ yǒu shénme shì?","Xem bóng đá. Cậu tìm mình có việc gì?"],
 ["马丁","明天早上六点，你跟我们一起练习太极拳，别忘了。","Míngtiān zǎoshang liù diǎn, nǐ gēn wǒmen yìqǐ liànxí tàijíquán, bié wàng le.","Sáu giờ sáng mai cậu tập Thái cực quyền cùng bọn mình, đừng quên nhé."],
 ["阿明","六点，太早了！","Liù diǎn, tài zǎo le!","Sáu giờ, sớm quá!"],
 ["马丁","不早，你要是去晚了，我们就练习完了。","Bù zǎo, nǐ yàoshi qù wǎn le, wǒmen jiù liànxí wán le.","Không sớm đâu, cậu mà đến muộn thì bọn mình tập xong rồi."],

 q:[["马丁给阿明打电话的时候，阿明在做什么？","Mǎdīng gěi Ā Míng dǎ diànhuà de shíhou, Ā Míng zài zuò shénme?","Khi Martin gọi, A Minh đang làm gì?","他正在看足球比赛。","Đang xem bóng đá."],["马丁找阿明有什么事？","Mǎdīng zhǎo Ā Míng yǒu shénme shì?","Martin tìm A Minh có việc gì?","让他明天早上六点一起练习太极拳。","Rủ sáng mai sáu giờ cùng tập Thái cực quyền."]]},
{n:3,title:"Bài khóa 3 · Gọi điện",vt:"27-5",at:"27-6",sc:"Mười giờ tối, mẹ gọi điện cho Lâm Na.",
 lines:[["妈妈","林娜，我是妈妈。","Línnà, wǒ shì māma.","Lâm Na, mẹ đây."],
 ["林娜","妈妈，您好！您现在做什么呢？","Māma, nín hǎo! Nín xiànzài zuò shénme ne?","Mẹ ạ! Bây giờ mẹ đang làm gì thế?"],
 ["妈妈","我刚吃完午饭，现在正和朋友一起买东西呢。你在做什么？","Wǒ gāng chīwán wǔfàn, xiànzài zhèng hé péngyou yìqǐ mǎi dōngxi ne. Nǐ zài zuò shénme?","Mẹ vừa ăn trưa xong, giờ đang đi mua sắm với bạn. Con đang làm gì?"],
 ["林娜","我刚写完作业，正准备睡觉呢。","Wǒ gāng xiěwán zuòyè, zhèng zhǔnbèi shuì jiào ne.","Con vừa làm xong bài tập, đang chuẩn bị đi ngủ."],
 ["妈妈","你们那儿几点了？","Nǐmen nàr jǐ diǎn le?","Bên con mấy giờ rồi?"],
 ["林娜","我们这儿十点。","Wǒmen zhèr shí diǎn.","Bên con mười giờ."],
 ["妈妈","怎么这么早就睡觉？","Zěnme zhème zǎo jiù shuì jiào?","Sao ngủ sớm thế?"],
 ["林娜","书上说“早睡早起身体好”，我以前总是习惯晚睡，现在我喜欢早睡了。","Shū shang shuō “zǎo shuì zǎo qǐ shēntǐ hǎo”, wǒ yǐqián zǒngshì xíguàn wǎn shuì, xiànzài wǒ xǐhuan zǎo shuì le.","Sách nói “ngủ sớm dậy sớm thì khỏe”, trước đây con quen ngủ muộn, giờ con thích ngủ sớm rồi."],
 ["妈妈","我想告诉你，我马上就要去旅行了，两个星期以后回来。","Wǒ xiǎng gàosu nǐ, wǒ mǎshàng jiù yào qù lǚxíng le, liǎng ge xīngqī yǐhòu huílai.","Mẹ muốn báo con, mẹ sắp đi du lịch, hai tuần nữa mới về."],
 ["林娜","妈妈，祝您旅行愉快！","Māma, zhù nín lǚxíng yúkuài!","Mẹ ơi, chúc mẹ đi chơi vui vẻ!"],
 ["妈妈","谢谢！晚安！","Xièxie! Wǎn'ān!","Cảm ơn con! Ngủ ngon nhé!"]],
 q:[["林娜妈妈打电话的时候，林娜在做什么？","Línnà māma dǎ diànhuà de shíhou, Línnà zài zuò shénme?","Khi mẹ gọi, Lâm Na đang làm gì?","她刚写完作业，正准备睡觉。","Vừa làm xong bài, đang chuẩn bị ngủ."],["林娜为什么要早睡？","Línnà wèi shénme yào zǎo shuì?","Vì sao Lâm Na ngủ sớm?","因为书上说“早睡早起身体好”。","Vì sách nói ngủ sớm dậy sớm thì khỏe."],["林娜妈妈打电话有什么事？","Línnà māma dǎ diànhuà yǒu shénme shì?","Mẹ Lâm Na gọi có việc gì?","告诉林娜她马上要去旅行了，两个星期以后回来。","Báo sắp đi du lịch, hai tuần sau về."]]}
],

{k:["正在","在","正","呢"],t:"Thể tiếp diễn: 正在 / 在 / 正 …(呢), …呢",s:"S + 正在/在/正 + V (+ O) + (呢)　|　S + V + O + 呢",d:"Biểu thị động tác đang diễn ra vào một thời điểm. “…呢” cuối câu hay dùng trong khẩu ngữ. Phủ định: 没(有) + V (không dùng 正在, 呢).",n:["Không dùng 了 với thể tiếp diễn: ✗我正在看书了 → ✓我正在看书呢。","正 thường cần 呢 hoặc thành phần khác đi kèm: 我正准备睡觉呢。"],ex:["许多人正在跑步（呢）。|Xǔduō rén zhèngzài pǎo bù (ne).|Nhiều người đang chạy bộ.","一些人在打太极拳（呢）。|Yìxiē rén zài dǎ tàijíquán (ne).|Một số người đang tập Thái cực quyền.","你忙什么呢？|Nǐ máng shénme ne?|Bạn đang bận gì thế?","A：你在看电视吗？　B：我没看电视。|A: Nǐ zài kàn diànshì ma? B: Wǒ méi kàn diànshì.|A: Bạn đang xem tivi à? B: Tôi không xem."]},
{k:["这儿","那儿"],t:"Đại từ / danh từ + 这儿/那儿: chỉ nơi chốn",s:"Người + 这儿/那儿",d:"这儿, 那儿 kết hợp với đại từ nhân xưng hoặc danh từ chỉ người để biểu thị nơi chốn: chỗ (của) ai.",n:["✗书在他 → ✓书在他那儿。"],ex:["我们那儿不常下雪。|Wǒmen nàr bù cháng xià xuě.|Chỗ chúng tôi không hay có tuyết.","我的自行车在朋友那儿。|Wǒ de zìxíngchē zài péngyou nàr.|Xe đạp của tôi ở chỗ bạn.","你这儿真漂亮啊！|Nǐ zhèr zhēn piàoliang a!|Chỗ bạn đẹp thật!"]}

read:{h:"八、阅读短文 · Đọc hiểu",p:[["张先生和王女士为了庆祝结婚25周年，在家里举行了一个很大的晚会。","Zhāng xiānsheng hé Wáng nǚshì wèile qìngzhù jié hūn èrshíwǔ zhōunián, zài jiā li jǔxíngle yí ge hěn dà de wǎnhuì.","Ông Trương và bà Vương tổ chức một bữa tiệc lớn ở nhà để mừng 25 năm ngày cưới."],["他们请了所有的亲戚朋友来参加，还请了一位摄影师给他们照相。","Tāmen qǐngle suǒyǒu de qīnqi péngyou lái cānjiā, hái qǐngle yí wèi shèyǐngshī gěi tāmen zhào xiàng.","Họ mời tất cả họ hàng bạn bè đến dự, còn mời một thợ ảnh chụp ảnh cho họ."],["一个星期之后，照片送来了。王女士一看照片就非常生气，她去照相馆找摄影师。","Yí ge xīngqī zhīhòu, zhàopiàn sònglai le. Wáng nǚshì yí kàn zhàopiàn jiù fēicháng shēng qì, tā qù zhàoxiàngguǎn zhǎo shèyǐngshī.","Một tuần sau ảnh được gửi đến. Bà Vương vừa xem ảnh đã rất tức, bà đến tiệm ảnh tìm thợ ảnh."],["一进门，她就大声说：“我不打算为你拍的照片付钱。”","Yí jìn mén, tā jiù dàshēng shuō: “Wǒ bù dǎsuàn wèi nǐ pāi de zhàopiàn fù qián.”","Vừa vào cửa bà đã nói to: “Tôi không định trả tiền cho ảnh anh chụp.”"],["摄影师忙问：“怎么了？”","Shèyǐngshī máng wèn: “Zěnme le?”","Thợ ảnh vội hỏi: “Sao vậy ạ?”"],["“你看看，你把我爱人拍得太难看了！”王女士生气地说。","“Nǐ kànkan, nǐ bǎ wǒ àiren pāi de tài nánkàn le!” Wáng nǚshì shēng qì de shuō.","“Anh xem đi, anh chụp chồng tôi xấu quá!” bà Vương tức giận nói."],["“哦，是这样啊。”摄影师说：“这件事不能怪我，应该怪你的丈夫。”","“Ò, shì zhèyàng a.” Shèyǐngshī shuō: “Zhè jiàn shì bù néng guài wǒ, yīnggāi guài nǐ de zhàngfu.”","“Ồ, ra vậy.” Thợ ảnh nói: “Chuyện này không thể trách tôi, phải trách chồng bà.”"]],gl:[["女士","nǚshì","bà, quý bà"],["周年","zhōunián","năm tròn (kỷ niệm)"],["摄影师","shèyǐngshī","thợ ảnh, nhiếp ảnh gia"],["大声","dàshēng","to tiếng"],["拍","pāi","chụp (ảnh)"],["难看","nánkàn","xấu"],["怪","guài","trách"]]},

texts:[
{n:1,title:"Bài khóa 1 · Giới thiệu",vt:"28-1",at:"28-2",sc:"Cách đi Trường Thành Bát Đạt Lĩnh.",
 lines:[["","八达岭长城在北京的西北部，离市区大概有八十公里。","Bādálǐng Chángchéng zài Běijīng de xīběibù, lí shìqū dàgài yǒu bāshí gōnglǐ.","Trường Thành Bát Đạt Lĩnh ở phía tây bắc Bắc Kinh, cách nội thành khoảng tám mươi km."],
 ["","从市区去八达岭长城可以坐火车，也可以坐公共汽车，还可以坐旅游车。","Cóng shìqū qù Bādálǐng Chángchéng kěyǐ zuò huǒchē, yě kěyǐ zuò gōnggòng qìchē, hái kěyǐ zuò lǚyóuchē.","Từ nội thành đi Bát Đạt Lĩnh có thể đi tàu hỏa, xe buýt, hoặc xe du lịch."],
 ["","火车早上八点半左右出发，坐两个多小时就到了，车票十几块钱。","Huǒchē zǎoshang bā diǎn bàn zuǒyòu chūfā, zuò liǎng ge duō xiǎoshí jiù dào le, chēpiào shí jǐ kuài qián.","Tàu hỏa xuất phát khoảng 8 giờ rưỡi sáng, đi hơn hai tiếng là đến, vé mười mấy tệ."],
 ["","坐旅游车四十多分钟可以到达，每天早上六点半到上午十点有车，车票五十元。","Zuò lǚyóuchē sìshí duō fēnzhōng kěyǐ dàodá, měi tiān zǎoshang liù diǎn bàn dào shàngwǔ shí diǎn yǒu chē, chēpiào wǔshí yuán.","Đi xe du lịch hơn bốn mươi phút là tới, mỗi ngày từ 6 rưỡi đến 10 giờ sáng có xe, vé năm mươi tệ."],
 ["","坐公共汽车最便宜，普通车车票七元，快车车票十二元。如果有公交卡，坐公交车更便宜。","Zuò gōnggòng qìchē zuì piányi, pǔtōng chē chēpiào qī yuán, kuàichē chēpiào shí'èr yuán. Rúguǒ yǒu gōngjiāokǎ, zuò gōngjiāochē gèng piányi.","Đi xe buýt rẻ nhất, xe thường bảy tệ, xe nhanh mười hai tệ. Nếu có thẻ xe buýt thì càng rẻ hơn."]],
 q:[["八达岭长城在哪儿？","Bādálǐng Chángchéng zài nǎr?","Bát Đạt Lĩnh ở đâu?","在北京的西北部，离市区大概八十公里。","Ở phía tây bắc Bắc Kinh, cách nội thành khoảng 80 km."],["怎么去八达岭？","Zěnme qù Bādálǐng?","Đi Bát Đạt Lĩnh thế nào?","可以坐火车、公共汽车或者旅游车。","Đi tàu hỏa, xe buýt hoặc xe du lịch."],["从市区到八达岭长城坐火车要多长时间？","Cóng shìqū dào Bādálǐng Chángchéng zuò huǒchē yào duō cháng shíjiān?","Đi tàu hỏa mất bao lâu?","两个多小时。","Hơn hai tiếng."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"28-3",at:"28-4",sc:"Martin hỏi Yamada về Trường Thành.",
 lines:[["马丁","你了解长城吗？","Nǐ liǎojiě Chángchéng ma?","Cậu có hiểu về Trường Thành không?"],
 ["山田","不能说了解，通过看书知道一些。","Bù néng shuō liǎojiě, tōngguò kàn shū zhīdào yìxiē.","Không dám nói là hiểu, qua đọc sách thì biết đôi chút."],
 ["马丁","我想问你一个问题。","Wǒ xiǎng wèn nǐ yí ge wèntí.","Mình muốn hỏi cậu một câu."],
 ["山田","你说吧。","Nǐ shuō ba.","Cậu nói đi."],
 ["马丁","长城有多长？","Chángchéng yǒu duō cháng?","Trường Thành dài bao nhiêu?"],
 ["山田","长城有八千八百五十多公里。","Chángchéng yǒu bāqiān bābǎi wǔshí duō gōnglǐ.","Trường Thành dài hơn 8.850 km."],
 ["马丁","为什么人们叫它“万里长城”呢？","Wèi shénme rénmen jiào tā “Wànlǐ Chángchéng” ne?","Tại sao người ta gọi nó là “Vạn lý Trường Thành”?"],
 ["山田","中国人习惯用“里”，一公里是二里，八千八百五十多公里是一万七千七百多里，所以长城也叫“万里长城”。","Zhōngguó rén xíguàn yòng “lǐ”, yì gōnglǐ shì èr lǐ, bāqiān bābǎi wǔshí duō gōnglǐ shì yíwàn qīqiān qībǎi duō lǐ, suǒyǐ Chángchéng yě jiào “Wànlǐ Chángchéng”.","Người Trung Quốc quen dùng “dặm”, một km là hai dặm, hơn 8.850 km là hơn 17.700 dặm, nên Trường Thành còn gọi là “Vạn lý Trường Thành”."],
 ["马丁","原来是这样啊。","Yuánlái shì zhèyàng a.","Thì ra là vậy."]],
 q:[["长城有多长？","Chángchéng yǒu duō cháng?","Trường Thành dài bao nhiêu?","八千八百五十多公里。","Hơn 8.850 km."],["长城为什么也叫“万里长城”？","Chángchéng wèi shénme yě jiào “Wànlǐ Chángchéng”?","Vì sao gọi là “Vạn lý Trường Thành”?","因为长城有一万七千七百多里。","Vì dài hơn 17.700 dặm."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"28-5",at:"28-6",sc:"Một sinh viên Hàn Quốc hỏi Thôi Hạo cách làm thẻ.",
 lines:[["韩国学生","你知道在哪儿可以办公交卡吗？","Nǐ zhīdào zài nǎr kěyǐ bàn gōngjiāokǎ ma?","Anh biết làm thẻ xe buýt ở đâu không?"],
 ["崔浩","我家旁边有一个地方就可以办，我带你去。","Wǒ jiā pángbiān yǒu yí ge dìfang jiù kěyǐ bàn, wǒ dài nǐ qù.","Cạnh nhà mình có chỗ làm được, mình dẫn cậu đi."],
 ["韩国学生","多长时间可以办好？","Duō cháng shíjiān kěyǐ bànhǎo?","Bao lâu thì làm xong?"],
 ["崔浩","五六分钟就可以办好。","Wǔ liù fēnzhōng jiù kěyǐ bànhǎo.","Năm sáu phút là xong."],
 ["韩国学生","我还想办一张信用卡，你知道怎么办吗？","Wǒ hái xiǎng bàn yì zhāng xìnyòngkǎ, nǐ zhīdào zěnme bàn ma?","Mình còn muốn làm thẻ tín dụng, anh biết làm thế nào không?"],
 ["崔浩","学生办信用卡很麻烦。在中国，用银行卡很方便，可以存钱、取钱，买东西、住宾馆也可以刷卡。","Xuésheng bàn xìnyòngkǎ hěn máfan. Zài Zhōngguó, yòng yínhángkǎ hěn fāngbiàn, kěyǐ cún qián, qǔ qián, mǎi dōngxi, zhù bīnguǎn yě kěyǐ shuā kǎ.","Sinh viên làm thẻ tín dụng rất phiền. Ở Trung Quốc dùng thẻ ngân hàng rất tiện, có thể gửi, rút tiền, mua đồ, ở khách sạn cũng quẹt thẻ được."],
 ["韩国学生","怎么办银行卡呢？","Zěnme bàn yínhángkǎ ne?","Làm thẻ ngân hàng thế nào?"],
 ["崔浩","很简单，准备好你的护照和学生证，再带一些钱去银行就行了。","Hěn jiǎndān, zhǔnbèi hǎo nǐ de hùzhào hé xuéshēngzhèng, zài dài yìxiē qián qù yínháng jiù xíng le.","Đơn giản lắm, chuẩn bị hộ chiếu và thẻ sinh viên, mang ít tiền đến ngân hàng là được."],
 ["韩国学生","好，那我就办银行卡吧。","Hǎo, nà wǒ jiù bàn yínhángkǎ ba.","Được, vậy mình làm thẻ ngân hàng."]],
 q:[["办信用卡方便还是办银行卡方便？","Bàn xìnyòngkǎ fāngbiàn háishi bàn yínhángkǎ fāngbiàn?","Làm thẻ tín dụng hay thẻ ngân hàng tiện hơn?","办银行卡方便，学生办信用卡很麻烦。","Thẻ ngân hàng tiện hơn."],["办银行卡要多长时间？","Bàn yínhángkǎ yào duō cháng shíjiān?","Làm thẻ ngân hàng mất bao lâu?","课文没有说具体时间，办银行卡很简单，准备好护照和学生证，带一些钱去银行就行了。","Bài không nói thời gian cụ thể; làm rất đơn giản, chỉ cần hộ chiếu, thẻ sinh viên và ít tiền."]]}
],
notes:[
{k:["多","几"],t:"Số ước lượng (3): 多 và 几",s:"十/百/千/万 + 多 + lượng từ　|　số lẻ + lượng từ + 多　|　几 + lượng từ, 十几, 几十",d:"多 (hơn): sau số tròn chục/trăm/nghìn/vạn thì đặt trước lượng từ (二十多岁, 五百多个人, 一万多块钱); với số lẻ hàng đơn vị thì đặt sau lượng từ (一斤多, 五块多, 两个多小时, 一个多月). 几 (vài, mấy) thay cho số dưới 10: 几个人, 十几斤, 几百公里, 五十几块钱.",n:["✗五百个多人 → ✓五百多个人。 ✗两多个小时 → ✓两个多小时。","Khi có 多/几 thì không dùng 左右 cùng lúc."],ex:["二十多岁 · 五百多个人 · 一万多块钱|èrshí duō suì · wǔbǎi duō ge rén · yíwàn duō kuài qián|hơn 20 tuổi · hơn 500 người · hơn 10.000 tệ","一斤多 · 五块多 · 两个多小时 · 一个多月|yì jīn duō · wǔ kuài duō · liǎng ge duō xiǎoshí · yí ge duō yuè|hơn 1 cân · hơn 5 tệ · hơn 2 tiếng · hơn 1 tháng","几个人 · 十几斤 · 几百公里 · 五十几块钱|jǐ ge rén · shí jǐ jīn · jǐ bǎi gōnglǐ · wǔshí jǐ kuài qián|mấy người · mười mấy cân · mấy trăm km · năm mươi mấy tệ"]},
{k:["通过"],t:"Giới từ 通过: thông qua",s:"通过 + phương tiện / cách thức，(S) + V…",d:"通过 biểu thị dùng người hoặc sự vật làm môi giới/phương tiện để đạt mục đích.",n:["✗过看中国电影… → ✓通过看中国电影…"],ex:["我通过看电视学习汉语。|Wǒ tōngguò kàn diànshì xuéxí Hànyǔ.|Tôi học tiếng Trung qua xem tivi.","通过朱云的介绍，我认识了他。|Tōngguò Zhū Yún de jièshào, wǒ rènshile tā.|Qua giới thiệu của Chu Vân, tôi quen anh ấy.","通过半年学习，我进步很大。|Tōngguò bàn nián xuéxí, wǒ jìnbù hěn dà.|Qua nửa năm học, tôi tiến bộ nhiều."]},
{k:["多"],t:"多 + tính từ: hỏi mức độ, số lượng",s:"(有) + 多 + 长/大/远/高/重…？",d:"多 là phó từ, dùng trong câu hỏi để hỏi mức độ, số lượng: bao lâu, bao xa, bao lớn…",n:[],ex:["你每天学习多长时间？|Nǐ měi tiān xuéxí duō cháng shíjiān?|Mỗi ngày bạn học bao lâu?","这个孩子多大了？|Zhège háizi duō dà le?|Đứa bé này bao nhiêu tuổi rồi?","从北京到上海多远？|Cóng Běijīng dào Shànghǎi duō yuǎn?|Từ Bắc Kinh đến Thượng Hải bao xa?"]},
{k:["原来"],t:"原来: hóa ra, thì ra (phát hiện sự thật)",s:"原来 + sự thật mới phát hiện",d:"Phó từ 原来 biểu thị phát hiện ra tình hình thật trước đó chưa biết, hoặc chợt hiểu ra.",n:["原来 còn là “vốn dĩ, ban đầu”: 他原来住在上海。"],ex:["他三天没来上课，原来是生病了。|Tā sān tiān méi lái shàng kè, yuánlái shì shēng bìng le.|Ba ngày cậu ấy không đi học, hóa ra là bị ốm.","我以前不知道，原来是这样啊。|Wǒ yǐqián bù zhīdào, yuánlái shì zhèyàng a.|Trước tôi không biết, thì ra là thế.","我以为是崔浩，原来是你呀！|Wǒ yǐwéi shì Cuī Hào, yuánlái shì nǐ ya!|Tôi tưởng là Thôi Hạo, hóa ra là bạn!"]}
],
gex:[
 {q:"我在北京住了三___月。|Wǒ zài Běijīng zhùle sān ___ yuè.|Tôi ở Bắc Kinh hơn ba tháng.",o:["个多","多个","几多","多"],a:0,e:"Số lẻ: lượng từ + 多."},
 {q:"我们学校有一千___学生。|Wǒmen xuéxiào yǒu yìqiān ___ xuésheng.|Trường chúng tôi có hơn một nghìn sinh viên.",o:["多个","个多","几多","多几"],a:0,e:"Số tròn: 千 + 多 + 个."},
 {q:"教室里有十___个人。|Jiàoshì li yǒu shí ___ ge rén.|Trong lớp có mười mấy người.",o:["几","多少","些","多个"],a:0,e:"十几 = mười mấy."},
 {q:"你家离学校有___远？|Nǐ jiā lí xuéxiào yǒu ___ yuǎn?|Nhà bạn cách trường bao xa?",o:["多","几","多少","什么"],a:0,e:"多 + tính từ."},
 {q:"___看中文电影，我的听力进步了。|___ kàn Zhōngwén diànyǐng, wǒ de tīnglì jìnbù le.|Nhờ xem phim tiếng Trung, khả năng nghe của tôi tiến bộ.",o:["通过","为了","因为是","对"],a:0,e:"通过 + cách thức."},
 {q:"我以为他是老师，___他也是学生。|Wǒ yǐwéi tā shì lǎoshī, ___ tā yě shì xuésheng.|Tôi tưởng anh ấy là thầy giáo, hóa ra cũng là sinh viên.",o:["原来","所以","然后","还是"],a:0,e:"原来 = hóa ra."},
 {q:"我买了两___电影票。|Wǒ mǎile liǎng ___ diànyǐng piào.|Tôi mua hai vé xem phim.",o:["张","本","件","个多"],a:0,e:"张 + 票."},
 {q:"今天下雨，___我们不去了。|Jīntiān xià yǔ, ___ wǒmen bú qù le.|Hôm nay mưa nên chúng tôi không đi.",o:["所以","原来","如果","虽然"],a:0,e:"所以 = cho nên."}
],
ord:["八达岭长城/在/北京的/西北部/。","火车/早上/八点半/左右/出发/。","坐/两个多/小时/就/到了/。","不能说/了解/，/通过/看书/知道/一些/。","长城/有/八千八百五十多/公里/。","所以/长城/也叫/“万里长城”/。","原来/是/这样/啊/。","五六分钟/就/可以/办好/。"],

read:{h:"八、阅读短文 · 朝三暮四",p:[["古时候，宋国有位老人叫狙公。他非常喜欢养猴子，他对猴子的性情、习惯都非常了解。他说的话，猴子也能听懂。","Gǔ shíhou, Sòngguó yǒu wèi lǎorén jiào Jūgōng. Tā fēicháng xǐhuan yǎng hóuzi, tā duì hóuzi de xìngqíng, xíguàn dōu fēicháng liǎojiě. Tā shuō de huà, hóuzi yě néng tīngdǒng.","Ngày xưa ở nước Tống có ông lão tên Thư Công. Ông rất thích nuôi khỉ, rất hiểu tính tình, thói quen của chúng. Lời ông nói, khỉ cũng hiểu được."],["有一天，狙公给猴子分橡子。他对猴子说：“我每天早上给你们三颗橡子，晚上给四颗。”","Yǒu yì tiān, Jūgōng gěi hóuzi fēn xiàngzi. Tā duì hóuzi shuō: “Wǒ měi tiān zǎoshang gěi nǐmen sān kē xiàngzi, wǎnshang gěi sì kē.”","Một hôm Thư Công chia hạt dẻ cho khỉ, nói: “Mỗi sáng ta cho các ngươi ba hạt, tối bốn hạt.”"],["猴子一听早上只给三颗，都非常生气。","Hóuzi yì tīng zǎoshang zhǐ gěi sān kē, dōu fēicháng shēng qì.","Khỉ nghe buổi sáng chỉ được ba hạt thì rất tức giận."],["狙公看见猴子生气了，马上改口说：“那就早上四颗，晚上三颗。”猴子们一听早上多了一颗，都非常高兴。","Jūgōng kànjiàn hóuzi shēng qì le, mǎshàng gǎikǒu shuō: “Nà jiù zǎoshang sì kē, wǎnshang sān kē.” Hóuzimen yì tīng zǎoshang duōle yì kē, dōu fēicháng gāoxìng.","Thấy khỉ giận, Thư Công lập tức đổi lời: “Vậy sáng bốn hạt, tối ba hạt.” Khỉ nghe sáng được thêm một hạt thì rất vui."]],gl:[["古","gǔ","xưa"],["狙公","Jūgōng","Thư Công (tên người)"],["养","yǎng","nuôi"],["猴子","hóuzi","con khỉ"],["性情","xìngqíng","tính tình"],["橡子","xiàngzi","hạt dẻ sồi"],["颗","kē","hạt (lượng từ)"],["改口","gǎikǒu","đổi lời"]]},
