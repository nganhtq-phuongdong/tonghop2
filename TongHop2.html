{hz:"俩",py:"liǎ",pos:"số từ",vi:"hai (người)",en:"two",hv:"LƯỠNG",t:2,ex:[["我们俩是好朋友。","Wǒmen liǎ shì hǎo péngyou.","Hai chúng tôi là bạn tốt."],["他们俩都是老师。","Tāmen liǎ dōu shì lǎoshī.","Hai người họ đều là giáo viên."]],tip:"俩 = 两个; sau 俩 không thêm 个."},
{hz:"比",py:"bǐ",pos:"động từ",vi:"thi, so tài",en:"compete, contest",hv:"TỶ",t:2,ex:[["我们比一比谁跑得快。","Wǒmen bǐ yi bǐ shéi pǎo de kuài.","Chúng ta thi xem ai chạy nhanh."],["咱们比赛吧。","Zánmen bǐsài ba.","Chúng mình thi đấu nhé."]],tip:"比一比 = thi thử."},
{hz:"水平",py:"shuǐpíng",pos:"danh từ",vi:"trình độ",en:"standard, level",hv:"THỦY BÌNH",t:2,ex:[["他的汉语水平很高。","Tā de Hànyǔ shuǐpíng hěn gāo.","Trình độ tiếng Trung của anh ấy rất cao."],["我的水平还不够。","Wǒ de shuǐpíng hái bú gòu.","Trình độ của tôi còn chưa đủ."]],tip:"水平高 / 水平不高."},
{hz:"高",py:"gāo",pos:"tính từ",vi:"cao",en:"high, tall",hv:"CAO",t:2,ex:[["他个子很高。","Tā gèzi hěn gāo.","Anh ấy rất cao."],["这座山很高。","Zhè zuò shān hěn gāo.","Ngọn núi này rất cao."]],tip:"高 ↔ 低 / 矮."},
{hz:"知识",py:"zhīshi",pos:"danh từ",vi:"kiến thức",en:"knowledge",hv:"TRI THỨC",t:2,ex:[["读书可以学到很多知识。","Dú shū kěyǐ xuédào hěn duō zhīshi.","Đọc sách có thể học được nhiều kiến thức."],["他的历史知识很丰富。","Tā de lìshǐ zhīshi hěn fēngfù.","Kiến thức lịch sử của anh ấy rất phong phú."]],tip:"Hán Việt TRI THỨC."},
{hz:"表扬",py:"biǎoyáng",pos:"động từ",vi:"khen, biểu dương",en:"praise, commend",hv:"BIỂU DƯƠNG",t:2,ex:[["今天老师表扬了我。","Jīntiān lǎoshī biǎoyángle wǒ.","Hôm nay thầy khen tôi."],["他常常被表扬。","Tā chángcháng bèi biǎoyáng.","Cậu ấy thường được khen."]],tip:"Ngược nghĩa: 批评."},
{hz:"文章",py:"wénzhāng",pos:"danh từ",vi:"bài văn, bài viết",en:"article, essay",hv:"VĂN CHƯƠNG",t:2,ex:[["这篇文章很有意思。","Zhè piān wénzhāng hěn yǒu yìsi.","Bài viết này rất thú vị."],["我在写一篇文章。","Wǒ zài xiě yì piān wénzhāng.","Tôi đang viết một bài văn."]],tip:"Lượng từ 篇."},
{hz:"花",py:"huā",pos:"động từ",vi:"tiêu (tiền), tốn (thời gian)",en:"spend",hv:"HOA",t:3,ex:[["买这台电脑花了五千块。","Mǎi zhè tái diànnǎo huāle wǔqiān kuài.","Mua máy tính này hết năm nghìn tệ."],["做这个作业花了我两个小时。","Zuò zhège zuòyè huāle wǒ liǎng ge xiǎoshí.","Làm bài này tốn của tôi hai tiếng."]],tip:"花钱, 花时间."},
{hz:"包括",py:"bāokuò",pos:"động từ",vi:"bao gồm",en:"include",hv:"BAO QUÁT",t:3,ex:[["房费包括早饭吗？","Fángfèi bāokuò zǎofàn ma?","Tiền phòng có bao gồm bữa sáng không?"],["我们班有二十个人，包括老师。","Wǒmen bān yǒu èrshí ge rén, bāokuò lǎoshī.","Lớp có hai mươi người, kể cả thầy."]],tip:"包括 + danh sách."},
{hz:"电",py:"diàn",pos:"danh từ",vi:"điện",en:"electricity",hv:"ĐIỆN",t:3,ex:[["停电了！","Tíng diàn le!","Mất điện rồi!"],["手机没电了。","Shǒujī méi diàn le.","Điện thoại hết pin rồi."]],tip:"电费 = tiền điện."},
{hz:"交通",py:"jiāotōng",pos:"danh từ",vi:"giao thông",en:"traffic, transportation",hv:"GIAO THÔNG",t:3,ex:[["这儿交通很方便。","Zhèr jiāotōng hěn fāngbiàn.","Giao thông ở đây rất thuận tiện."],["交通费不太贵。","Jiāotōngfèi bú tài guì.","Chi phí đi lại không đắt lắm."]],tip:"Hán Việt GIAO THÔNG."},
{hz:"加上",py:"jiāshang",pos:"động từ",vi:"cộng thêm",en:"add",hv:"GIA THƯỢNG",t:3,ex:[["三加上五是八。","Sān jiāshang wǔ shì bā.","Ba cộng năm là tám."],["学费加上房费，一共一万块。","Xuéfèi jiāshang fángfèi, yígòng yíwàn kuài.","Học phí cộng tiền phòng tổng cộng mười nghìn tệ."]],tip:"再加上… = thêm vào đó…"},
{hz:"零花钱",py:"línghuāqián",pos:"danh từ",vi:"tiền tiêu vặt",en:"pocket money",hv:"",t:3,ex:[["妈妈每个星期给我零花钱。","Māma měi ge xīngqī gěi wǒ línghuāqián.","Tuần nào mẹ cũng cho tôi tiền tiêu vặt."],["我用零花钱买了一本书。","Wǒ yòng línghuāqián mǎile yì běn shū.","Tôi dùng tiền tiêu vặt mua một quyển sách."]],tip:"零 (lẻ) + 花 (tiêu) + 钱."},
{hz:"够",py:"gòu",pos:"tính từ",vi:"đủ",en:"enough, sufficient",hv:"CẤU",t:3,ex:[["钱够不够？","Qián gòu bu gòu?","Tiền có đủ không?"],["两个面包够了。","Liǎng ge miànbāo gòu le.","Hai cái bánh mì là đủ rồi."]],tip:"不够 = không đủ."},
{hz:"可能",py:"kěnéng",pos:"phó từ",vi:"có lẽ, có thể",en:"perhaps, probably",hv:"KHẢ NĂNG",t:3,ex:[["他可能已经走了。","Tā kěnéng yǐjīng zǒu le.","Có lẽ anh ấy đi rồi."],["明天可能会冷。","Míngtiān kěnéng huì lěng.","Mai có thể sẽ lạnh."]],tip:"Biểu thị suy đoán."},
{hz:"这里",py:"zhèli",pos:"đại từ",vi:"đây, ở đây",en:"here",hv:"",t:3,ex:[["这里的风景很美。","Zhèli de fēngjǐng hěn měi.","Phong cảnh ở đây rất đẹp."],["请在这里写你的名字。","Qǐng zài zhèli xiě nǐ de míngzi.","Xin viết tên bạn vào đây."]],tip:"= 这儿."}
],
texts:[
{n:1,title:"Bài khóa 1 · Kể chuyện",vt:"29-1",at:"29-2",sc:"Lớp tổ chức tiệc cuối học kỳ.",
 lines:[["","这个学期就要结束了。老师说，大家学习都很累，开个晚会轻松一下吧。","Zhège xuéqī jiù yào jiéshù le. Lǎoshī shuō, dàjiā xuéxí dōu hěn lèi, kāi ge wǎnhuì qīngsōng yíxià ba.","Học kỳ này sắp kết thúc. Thầy nói mọi người học mệt rồi, tổ chức một buổi tiệc thư giãn chút đi."],
 ["","昨天晚上，我们开了一个晚会，晚会开得非常成功。","Zuótiān wǎnshang, wǒmen kāile yí ge wǎnhuì, wǎnhuì kāi de fēicháng chénggōng.","Tối qua chúng tôi tổ chức một buổi tiệc, buổi tiệc rất thành công."],
 ["","男同学准备了水果和饮料，女同学做了很多好吃的。大家吃得很高兴，玩儿得也很痛快。","Nán tóngxué zhǔnbèile shuǐguǒ hé yǐnliào, nǚ tóngxué zuòle hěn duō hǎochī de. Dàjiā chī de hěn gāoxìng, wánr de yě hěn tòngkuai.","Các bạn nam chuẩn bị hoa quả và đồ uống, các bạn nữ làm nhiều món ngon. Mọi người ăn rất vui, chơi cũng rất đã."],
 ["","很多同学表演了节目，有的唱歌，有的跳舞，有的讲故事，大家一直玩儿到十一点多才结束。","Hěn duō tóngxué biǎoyǎnle jiémù, yǒude chàng gē, yǒude tiào wǔ, yǒude jiǎng gùshi, dàjiā yìzhí wánr dào shíyī diǎn duō cái jiéshù.","Nhiều bạn biểu diễn tiết mục, người hát, người nhảy, người kể chuyện, mọi người chơi đến hơn mười một giờ mới kết thúc."]],
 q:[["晚会开得怎么样？","Wǎnhuì kāi de zěnmeyàng?","Bữa tiệc thế nào?","晚会开得非常成功。","Rất thành công."],["大家玩儿得怎么样？","Dàjiā wánr de zěnmeyàng?","Mọi người chơi thế nào?","大家玩儿得很痛快。","Chơi rất đã."]]},
{n:2,title:"Bài khóa 2 · Hội thoại",vt:"29-3",at:"29-4",sc:"Sau bữa tiệc, các bạn khen nhau.",
 lines:[["马丁","阿明，我只知道你跑得快，没想到歌也唱得那么好。","Ā Míng, wǒ zhǐ zhīdào nǐ pǎo de kuài, méi xiǎngdào gē yě chàng de nàme hǎo.","A Minh, mình chỉ biết cậu chạy nhanh, không ngờ hát cũng hay thế."],
 ["阿明","哪里，哪里。你昨天晚上跳舞也跳得不错啊。","Nǎli, nǎli. Nǐ zuótiān wǎnshang tiào wǔ yě tiào de búcuò a.","Đâu có, đâu có. Tối qua cậu nhảy cũng rất được mà."],
 ["马丁","我喜欢跳舞，但是跳得不太好。","Wǒ xǐhuan tiào wǔ, dànshì tiào de bú tài hǎo.","Mình thích nhảy nhưng nhảy không giỏi lắm."],
 ["崔浩","林娜，听说你游泳游得不错，什么时候咱们俩比一比？","Línnà, tīngshuō nǐ yóu yǒng yóu de búcuò, shénme shíhou zánmen liǎ bǐ yi bǐ?","Lâm Na, nghe nói cậu bơi giỏi, khi nào hai đứa mình thi thử?"],
 ["林娜","行啊。","Xíng a.","Được thôi."],
 ["崔浩","对了，你中国画学得怎么样了？","Duì le, nǐ Zhōngguóhuà xué de zěnmeyàng le?","À này, cậu học vẽ tranh Trung Quốc thế nào rồi?"],
 ["林娜","我刚学一年，水平不高，画得不好。","Wǒ gāng xué yì nián, shuǐpíng bù gāo, huà de bù hǎo.","Mình mới học một năm, trình độ chưa cao, vẽ chưa đẹp."],
 ["崔浩","山田，你有什么爱好？","Shāntián, nǐ yǒu shénme àihào?","Yamada, cậu có sở thích gì?"],
 ["山田","我呀，爱睡觉，每天睡得早，起得晚。","Wǒ ya, ài shuì jiào, měi tiān shuì de zǎo, qǐ de wǎn.","Mình à, thích ngủ, ngày nào cũng ngủ sớm, dậy muộn."],
 ["崔浩","不对。你爱学习，知识丰富，老师经常表扬你文章写得好。","Bú duì. Nǐ ài xuéxí, zhīshi fēngfù, lǎoshī jīngcháng biǎoyáng nǐ wénzhāng xiě de hǎo.","Không đúng. Cậu ham học, kiến thức phong phú, thầy thường khen cậu viết văn hay."],
 ["山田","哪里，你们的汉语也都很好。","Nǎli, nǐmen de Hànyǔ yě dōu hěn hǎo.","Đâu có, tiếng Trung của các cậu cũng đều giỏi mà."]],
 q:[["谁唱歌唱得好？","Shéi chàng gē chàng de hǎo?","Ai hát hay?","阿明唱歌唱得好。","A Minh."],["马丁跳舞跳得怎么样？","Mǎdīng tiào wǔ tiào de zěnmeyàng?","Martin nhảy thế nào?","阿明说他跳得不错，他自己说跳得不太好。","A Minh khen nhảy được, Martin tự nhận nhảy không giỏi lắm."]]},
{n:3,title:"Bài khóa 3 · Hội thoại",vt:"29-5",at:"29-6",sc:"Yamada và Thôi Hạo nói chuyện tiền sinh hoạt.",
 lines:[["山田","你今天怎么来得这么晚？是不是昨天晚上玩儿得太累了？","Nǐ jīntiān zěnme lái de zhème wǎn? Shì bu shì zuótiān wǎnshang wánr de tài lèi le?","Hôm nay sao cậu đến muộn thế? Có phải tối qua chơi mệt quá không?"],
 ["崔浩","不是。我这个月的生活费花得太快，又没钱了，我去取钱了。","Bú shì. Wǒ zhège yuè de shēnghuófèi huā de tài kuài, yòu méi qián le, wǒ qù qǔ qián le.","Không phải. Tháng này mình tiêu tiền sinh hoạt nhanh quá, lại hết tiền, mình đi rút tiền."],
 ["山田","你每个月要花多少钱？","Nǐ měi ge yuè yào huā duōshao qián?","Mỗi tháng cậu tiêu bao nhiêu tiền?"],
 ["崔浩","大概五六千吧。包括房租、水费、电费、电话费、交通费、吃饭，再加上一些零花钱。","Dàgài wǔ liù qiān ba. Bāokuò fángzū, shuǐfèi, diànfèi, diànhuàfèi, jiāotōngfèi, chī fàn, zài jiāshang yìxiē línghuāqián.","Khoảng năm sáu nghìn. Gồm tiền nhà, nước, điện, điện thoại, đi lại, ăn uống, thêm ít tiền tiêu vặt."],
 ["山田","我也差不多花五六千，有时候五六千还不够。","Wǒ yě chàbuduō huā wǔ liù qiān, yǒushíhou wǔ liù qiān hái bú gòu.","Mình cũng tiêu khoảng năm sáu nghìn, có lúc năm sáu nghìn còn không đủ."],
 ["崔浩","可能别的城市生活费便宜一些。","Kěnéng bié de chéngshì shēnghuófèi piányi yìxiē.","Có lẽ ở thành phố khác chi phí sinh hoạt rẻ hơn."],
 ["山田","可是我已经习惯这里了。","Kěshì wǒ yǐjīng xíguàn zhèli le.","Nhưng mình đã quen ở đây rồi."],
 ["崔浩","我也一样。","Wǒ yě yíyàng.","Mình cũng vậy."]],
 q:[["崔浩为什么来得那么晚？","Cuī Hào wèi shénme lái de nàme wǎn?","Vì sao Thôi Hạo đến muộn?","他去取钱了。","Anh ấy đi rút tiền."],["崔浩每个月大概花多少钱？","Cuī Hào měi ge yuè dàgài huā duōshao qián?","Thôi Hạo mỗi tháng tiêu khoảng bao nhiêu?","大概五六千块。","Khoảng năm sáu nghìn tệ."]]}
],
notes:[
{k:["得"],t:"Bổ ngữ trạng thái: V + 得 + Adj",s:"S + V + 得 + (很) Adj　|　(V +) O + V + 得 + Adj　|　V + 得 + 不 + Adj　|　V + 得 + Adj + 不 + Adj？",d:"Bổ ngữ trạng thái miêu tả hoặc đánh giá động tác/trạng thái đã xảy ra, thường xuyên hoặc đang diễn ra. Khi động từ có tân ngữ phải lặp lại động từ (động từ thứ nhất thường lược được): 他(唱)歌唱得很好. Phủ định: thêm 不 trước tính từ. Câu hỏi chính phản: Adj + 不 + Adj.",n:["✗他唱歌很好听 (thiếu 得) → ✓他唱歌唱得很好听。","✗跳舞得怎么样 → ✓跳舞跳得怎么样 / 舞跳得怎么样。","Phủ định ✗他没跑得快 → ✓他跑得不快。"],ex:["他跑得很快。|Tā pǎo de hěn kuài.|Anh ấy chạy rất nhanh.","山田（写）汉字写得很好。|Shāntián (xiě) Hànzì xiě de hěn hǎo.|Yamada viết chữ Hán rất đẹp.","她（说）汉语说得不快。|Tā (shuō) Hànyǔ shuō de bú kuài.|Cô ấy nói tiếng Trung không nhanh.","他跑得快不快？|Tā pǎo de kuài bu kuài?|Anh ấy chạy có nhanh không?"]},
{k:["爱"],t:"爱 + V: thích (làm gì)",s:"S + 爱 + V (+ O)",d:"爱 mang nghĩa thích, ưa (làm gì đó).",n:[],ex:["我爱喝茶。|Wǒ ài hē chá.|Tôi thích uống trà.","林娜爱游泳。|Línnà ài yóu yǒng.|Lâm Na thích bơi.","山田爱打球。|Shāntián ài dǎ qiú.|Yamada thích chơi bóng."]},
{k:["可能"],t:"可能: có lẽ (ước đoán)",s:"(S) + 可能 + V…　|　可能 + S + V…",d:"可能 biểu thị suy đoán, ước lượng.",n:[],ex:["他可能知道这件事。|Tā kěnéng zhīdào zhè jiàn shì.|Có lẽ anh ấy biết chuyện này.","可能要下雨了。|Kěnéng yào xià yǔ le.|Có lẽ sắp mưa.","可能现在他们还在学校呢。|Kěnéng xiànzài tāmen hái zài xuéxiào ne.|Có lẽ giờ họ vẫn còn ở trường."]}
],
gex:[
 {q:"她跑___很快。|Tā pǎo ___ hěn kuài.|Cô ấy chạy rất nhanh.",o:["得","的","地","了"],a:0,e:"V + 得 + Adj."},

read:{h:"八、阅读短文 · Đọc hiểu",p:[["有一次，我因为有急事要联系老王。但是我的手机里没有存他的电话号码，我只好给他的一个同学发短信：“请问，你有老王的号码吗？”","Yǒu yí cì, wǒ yīnwèi yǒu jíshì yào liánxì Lǎo Wáng. Dànshì wǒ de shǒujī li méiyǒu cún tā de diànhuà hàomǎ, wǒ zhǐhǎo gěi tā de yí ge tóngxué fā duǎnxìn: “Qǐngwèn, nǐ yǒu Lǎo Wáng de hàomǎ ma?”","Có lần tôi có việc gấp cần liên lạc với lão Vương, nhưng điện thoại không lưu số anh ấy, đành nhắn tin cho một bạn học của anh ấy: “Xin hỏi, bạn có số của lão Vương không?”"],["发完以后，我就耐心等待回信。五分钟以后，收到回信了。我急忙打开短信，只见上面写着“有啊”两个大字。","Fāwán yǐhòu, wǒ jiù nàixīn děngdài huíxìn. Wǔ fēnzhōng yǐhòu, shōudào huíxìn le. Wǒ jímáng dǎkāi duǎnxìn, zhǐ jiàn shàngmian xiězhe “yǒu a” liǎng ge dà zì.","Gửi xong tôi kiên nhẫn chờ. Năm phút sau có tin trả lời, tôi vội mở ra, chỉ thấy hai chữ to “Có đấy”."],["没有办法，我只好再发短信给这位同学：“请告诉我好吗？”","Méiyǒu bànfǎ, wǒ zhǐhǎo zài fā duǎnxìn gěi zhè wèi tóngxué: “Qǐng gàosu wǒ hǎo ma?”","Hết cách, tôi đành nhắn lại: “Bạn cho tôi biết được không?”"],["又等了五分钟，收到了回信。我又急忙打开来看，短信上只有两个字：“好啊！”","Yòu děngle wǔ fēnzhōng, shōudàole huíxìn. Wǒ yòu jímáng dǎkāi lái kàn, duǎnxìn shang zhǐ yǒu liǎng ge zì: “Hǎo a!”","Lại đợi năm phút, có tin trả lời. Tôi vội mở ra xem, chỉ có hai chữ: “Được thôi!”"]],gl:[["急事","jíshì","việc gấp"],["耐心","nàixīn","kiên nhẫn"],["等待","děngdài","chờ đợi"],["急忙","jímáng","vội vàng"]]},

{hz:"语言",py:"yǔyán",pos:"danh từ",vi:"ngôn ngữ",en:"language",hv:"NGỮ NGÔN",t:1,ex:[["你会几种语言？","Nǐ huì jǐ zhǒng yǔyán?","Bạn biết mấy thứ tiếng?"],["学语言要多说多听。","Xué yǔyán yào duō shuō duō tīng.","Học ngoại ngữ phải nói nhiều nghe nhiều."]],tip:"语言学校 = trường ngôn ngữ."},
{hz:"最初",py:"zuìchū",pos:"danh từ",vi:"lúc đầu, ban đầu",en:"earliest, at the beginning",hv:"TỐI SƠ",t:1,ex:[["最初我不喜欢吃辣的。","Zuìchū wǒ bù xǐhuan chī là de.","Lúc đầu tôi không thích ăn cay."],["最初的几天很不习惯。","Zuìchū de jǐ tiān hěn bù xíguàn.","Mấy ngày đầu rất không quen."]],tip:"≈ 开始的时候."},
{hz:"因为",py:"yīnwèi",pos:"liên từ",vi:"bởi vì",en:"because",hv:"NHÂN VI",t:1,ex:[["因为下雨，我没出去。","Yīnwèi xià yǔ, wǒ méi chūqu.","Vì mưa nên tôi không ra ngoài."],["我喜欢他，因为他很热情。","Wǒ xǐhuan tā, yīnwèi tā hěn rèqíng.","Tôi quý anh ấy vì anh ấy nhiệt tình."]],tip:"因为…，所以…"},
{hz:"交流",py:"jiāoliú",pos:"động từ",vi:"giao lưu, trao đổi",en:"exchange, communicate",hv:"GIAO LƯU",t:1,ex:[["我们常常用汉语交流。","Wǒmen chángcháng yòng Hànyǔ jiāoliú.","Chúng tôi thường trao đổi bằng tiếng Trung."],["学校有很多文化交流活动。","Xuéxiào yǒu hěn duō wénhuà jiāoliú huódòng.","Trường có nhiều hoạt động giao lưu văn hóa."]],tip:"跟…交流."},
{hz:"困难",py:"kùnnan",pos:"tính từ / danh từ",vi:"khó khăn",en:"difficult; difficulty",hv:"KHỐN NAN",t:1,ex:[["有困难就找我。","Yǒu kùnnan jiù zhǎo wǒ.","Có khó khăn thì tìm tôi."],["他走路有点儿困难。","Tā zǒu lù yǒudiǎnr kùnnan.","Anh ấy đi lại hơi khó khăn."]],tip:"Hán Việt KHỐN NAN."},
{hz:"遇到",py:"yùdào",pos:"động từ",vi:"gặp (phải)",en:"meet, encounter",hv:"NGỘ ĐÁO",t:1,ex:[["我在路上遇到了老同学。","Wǒ zài lùshang yùdàole lǎo tóngxué.","Tôi gặp bạn học cũ trên đường."],["学习中遇到问题要问老师。","Xuéxí zhōng yùdào wèntí yào wèn lǎoshī.","Gặp vấn đề khi học thì phải hỏi thầy."]],tip:"遇到 + người / khó khăn / vấn đề."},
{hz:"哭",py:"kū",pos:"động từ",vi:"khóc",en:"cry, weep",hv:"KHỐC",t:1,ex:[["孩子哭了。","Háizi kū le.","Đứa bé khóc rồi."],["别哭，别哭。","Bié kū, bié kū.","Đừng khóc nữa."]],tip:"Ngược nghĩa: 笑."},
{hz:"最后",py:"zuìhòu",pos:"danh từ",vi:"cuối cùng",en:"finally, last",hv:"TỐI HẬU",t:1,ex:[["最后我们去了上海。","Zuìhòu wǒmen qùle Shànghǎi.","Cuối cùng chúng tôi đi Thượng Hải."],["他是最后一个到的。","Tā shì zuìhòu yí ge dào de.","Anh ấy là người đến cuối cùng."]],tip:"最初 ↔ 最后."},
{hz:"坚持",py:"jiānchí",pos:"động từ",vi:"kiên trì",en:"persist in, insist on",hv:"KIÊN TRÌ",t:1,ex:[["他坚持每天跑步。","Tā jiānchí měi tiān pǎo bù.","Anh ấy kiên trì chạy bộ mỗi ngày."],["再坚持一下！","Zài jiānchí yíxià!","Cố thêm chút nữa!"]],tip:"坚持 + V."},
{hz:"留",py:"liú",pos:"động từ",vi:"ở lại, giữ lại",en:"remain, stay",hv:"LƯU",t:1,ex:[["放假我留在学校。","Fàng jià wǒ liú zài xuéxiào.","Nghỉ lễ tôi ở lại trường."],["请留下你的电话。","Qǐng liúxia nǐ de diànhuà.","Xin để lại số điện thoại."]],tip:"留在 + nơi chốn."},
{hz:"地",py:"de",pos:"trợ từ",vi:"(trợ từ trạng ngữ: một cách…)",en:"used after an adjective to form an adverbial adjunct",hv:"ĐỊA",t:1,ex:[["他高兴地说：“太好了！”","Tā gāoxìng de shuō: “Tài hǎo le!”","Anh ấy vui vẻ nói: “Tuyệt quá!”"],["我们慢慢地走吧。","Wǒmen mànmàn de zǒu ba.","Chúng ta đi từ từ thôi."]],tip:"Adj + 地 + V (phân biệt với 的, 得)."},
{hz:"发现",py:"fāxiàn",pos:"động từ",vi:"phát hiện, nhận ra",en:"find, discover",hv:"PHÁT HIỆN",t:1,ex:[["我发现他很喜欢唱歌。","Wǒ fāxiàn tā hěn xǐhuan chàng gē.","Tôi nhận ra anh ấy rất thích hát."],["到了车站我才发现没带票。","Dàole chēzhàn wǒ cái fāxiàn méi dài piào.","Đến ga tôi mới phát hiện không mang vé."]],tip:"发现 + sự việc."},
{hz:"出去",py:"chūqu",pos:"động từ",vi:"đi ra ngoài",en:"go out",hv:"XUẤT KHỨ",t:1,ex:[["他出去了，不在家。","Tā chūqu le, bú zài jiā.","Anh ấy ra ngoài rồi, không có nhà."],["我们出去走走吧。","Wǒmen chūqu zǒuzou ba.","Chúng ta ra ngoài đi dạo đi."]],tip:"出来 (ra đây) ↔ 出去 (ra đó)."},
{hz:"钱包",py:"qiánbāo",pos:"danh từ",vi:"ví tiền",en:"purse, wallet",hv:"TIỀN BAO",t:1,ex:[["我的钱包丢了。","Wǒ de qiánbāo diū le.","Ví của tôi mất rồi."],["这个钱包是妈妈送的。","Zhège qiánbāo shì māma sòng de.","Chiếc ví này mẹ tặng."]],tip:"钱 + 包."},
{hz:"极",py:"jí",pos:"phó từ",vi:"cực kỳ",en:"extremely",hv:"CỰC",t:1,ex:[["今天热极了。","Jīntiān rè jí le.","Hôm nay nóng cực kỳ."],["这个菜好吃极了。","Zhège cài hǎochī jí le.","Món này ngon tuyệt."]],tip:"Adj/V + 极了 (khẩu ngữ)."},
{hz:"翻译",py:"fānyì",pos:"danh từ / động từ",vi:"phiên dịch; dịch",en:"translator, interpreter; translate",hv:"PHIÊN DỊCH",t:1,ex:[["她是一名翻译。","Tā shì yì míng fānyì.","Cô ấy là phiên dịch viên."],["请把这句话翻译成越南语。","Qǐng bǎ zhè jù huà fānyì chéng Yuènányǔ.","Hãy dịch câu này sang tiếng Việt."]],tip:"当翻译 = làm phiên dịch."},
{hz:"意义",py:"yìyì",pos:"danh từ",vi:"ý nghĩa",en:"value, significance",hv:"Ý NGHĨA",t:1,ex:[["这件事很有意义。","Zhè jiàn shì hěn yǒu yìyì.","Việc này rất có ý nghĩa."],["这个词的意义是什么？","Zhège cí de yìyì shì shénme?","Nghĩa của từ này là gì?"]],tip:"有意义 ≠ 有意思 (thú vị)."},
{hz:"决定",py:"juédìng",pos:"động từ",vi:"quyết định",en:"decide",hv:"QUYẾT ĐỊNH",t:1,ex:[["我决定明年去中国。","Wǒ juédìng míngnián qù Zhōngguó.","Tôi quyết định sang năm đi Trung Quốc."],["这是谁的决定？","Zhè shì shéi de juédìng?","Đây là quyết định của ai?"]],tip:"决定 + V."},
{hz:"农村",py:"nóngcūn",pos:"danh từ",vi:"nông thôn",en:"rural area, countryside",hv:"NÔNG THÔN",t:1,ex:[["我爷爷住在农村。","Wǒ yéye zhù zài nóngcūn.","Ông tôi sống ở nông thôn."],["农村的空气很好。","Nóngcūn de kōngqì hěn hǎo.","Không khí ở nông thôn rất tốt."]],tip:"Ngược nghĩa: 城市."},
{hz:"外语",py:"wàiyǔ",pos:"danh từ",vi:"ngoại ngữ",en:"foreign language",hv:"NGOẠI NGỮ",t:1,ex:[["你学过什么外语？","Nǐ xuéguo shénme wàiyǔ?","Bạn từng học ngoại ngữ gì?"],["她外语很好。","Tā wàiyǔ hěn hǎo.","Cô ấy giỏi ngoại ngữ."]],tip:"外语老师 = giáo viên ngoại ngữ."},
{hz:"穷",py:"qióng",pos:"tính từ",vi:"nghèo",en:"poor",hv:"CÙNG",t:1,ex:[["以前他家很穷。","Yǐqián tā jiā hěn qióng.","Trước đây nhà anh ấy rất nghèo."],["那是一个穷地方。","Nà shì yí ge qióng dìfang.","Đó là một nơi nghèo."]],tip:"Ngược nghĩa: 富."},
{hz:"见",py:"jiàn",pos:"động từ",vi:"gặp, thấy",en:"see, catch sight of",hv:"KIẾN",t:1,ex:[["我好久没见他了。","Wǒ hǎojiǔ méi jiàn tā le.","Lâu lắm tôi không gặp anh ấy."],["明天见！","Míngtiān jiàn!","Mai gặp lại!"]],tip:"见过 = đã từng gặp."},
{hz:"热情",py:"rèqíng",pos:"tính từ",vi:"nhiệt tình",en:"enthusiastic",hv:"NHIỆT TÌNH",t:1,ex:[["这儿的人都很热情。","Zhèr de rén dōu hěn rèqíng.","Người ở đây đều rất nhiệt tình."],["他热情地帮助我。","Tā rèqíng de bāngzhù wǒ.","Anh ấy nhiệt tình giúp tôi."]],tip:"对…很热情."},
{hz:"友好",py:"yǒuhǎo",pos:"tính từ",vi:"thân thiện, hữu hảo",en:"friendly",hv:"HỮU HẢO",t:1,ex:[["他对大家很友好。","Tā duì dàjiā hěn yǒuhǎo.","Anh ấy rất thân thiện với mọi người."],["两国人民很友好。","Liǎng guó rénmín hěn yǒuhǎo.","Nhân dân hai nước rất hữu hảo."]],tip:"Hán Việt HỮU HẢO."},
{hz:"当……的时候",py:"dāng……de shíhou",pos:"cụm giới từ",vi:"khi…, lúc…",en:"when, while",hv:"",t:1,ex:[["当我到车站的时候，车已经开了。","Dāng wǒ dào chēzhàn de shíhou, chē yǐjīng kāi le.","Khi tôi đến bến, xe đã chạy rồi."],["当他听到这个消息的时候，非常高兴。","Dāng tā tīngdào zhège xiāoxi de shíhou, fēicháng gāoxìng.","Khi nghe tin này, anh ấy rất vui."]],tip:"Thường đứng đầu câu."},
{hz:"经验",py:"jīngyàn",pos:"danh từ",vi:"kinh nghiệm",en:"experience",hv:"KINH NGHIỆM",t:1,ex:[["他教书很有经验。","Tā jiāo shū hěn yǒu jīngyàn.","Ông ấy dạy học rất có kinh nghiệm."],["我没有工作经验。","Wǒ méiyǒu gōngzuò jīngyàn.","Tôi không có kinh nghiệm làm việc."]],tip:"有经验 = có kinh nghiệm."},
{hz:"经历",py:"jīnglì",pos:"danh từ",vi:"trải nghiệm, từng trải",en:"personal experience",hv:"KINH LỊCH",t:1,ex:[["这是一次难忘的经历。","Zhè shì yí cì nánwàng de jīnglì.","Đây là một trải nghiệm khó quên."],["他的经历很丰富。","Tā de jīnglì hěn fēngfù.","Anh ấy rất từng trải."]],tip:"经验 (kinh nghiệm tích lũy) ≠ 经历 (việc đã trải qua)."}
],
texts:[
{n:1,title:"Bài khóa · Kể chuyện",vt:"30-1",at:"30-2",sc:"“Tôi” kể lại những năm ở Trung Quốc.",
 lines:[["","三年以前，我大学毕业了。","Sān nián yǐqián, wǒ dàxué bì yè le.","Ba năm trước tôi tốt nghiệp đại học."],
 ["","和其他同学一样，我没有马上去工作，我选择了到自己不熟悉的地方去锻炼。","Hé qítā tóngxué yíyàng, wǒ méiyǒu mǎshàng qù gōngzuò, wǒ xuǎnzéle dào zìjǐ bù shúxī de dìfang qù duànliàn.","Cũng như các bạn khác, tôi không đi làm ngay mà chọn đến một nơi mình chưa quen để rèn luyện."],
 ["","去哪儿呢？最后我决定去中国。当然，去中国就要先学会汉语。","Qù nǎr ne? Zuìhòu wǒ juédìng qù Zhōngguó. Dāngrán, qù Zhōngguó jiù yào xiān xuéhuì Hànyǔ.","Đi đâu đây? Cuối cùng tôi quyết định đi Trung Quốc. Tất nhiên, đi Trung Quốc thì phải học tiếng Trung trước."],
 ["","为了学会汉语，我离开了家，离开了父母，来到了北京。","Wèile xuéhuì Hànyǔ, wǒ líkāile jiā, líkāile fùmǔ, láidàole Běijīng.","Để học tiếng Trung, tôi rời nhà, rời bố mẹ, đến Bắc Kinh."],
 ["","我先在一所语言学校学习。最初的几个月，因为我的汉语说得不好，跟中国人交流很困难，遇到了不少麻烦。","Wǒ xiān zài yì suǒ yǔyán xuéxiào xuéxí. Zuìchū de jǐ ge yuè, yīnwèi wǒ de Hànyǔ shuō de bù hǎo, gēn Zhōngguó rén jiāoliú hěn kùnnan, yùdàole bù shǎo máfan.","Đầu tiên tôi học ở một trường ngôn ngữ. Mấy tháng đầu, vì nói tiếng Trung chưa tốt, giao tiếp với người Trung Quốc rất khó, tôi gặp không ít phiền phức."],
 ["","我哭过，也想过回去，但是最后还是坚持留在了这里。慢慢地，我发现我开始喜欢这里了。","Wǒ kūguo, yě xiǎngguo huíqu, dànshì zuìhòu háishi jiānchí liú zàile zhèli. Mànmàn de, wǒ fāxiàn wǒ kāishǐ xǐhuan zhèli le.","Tôi từng khóc, từng nghĩ đến chuyện về, nhưng cuối cùng vẫn kiên trì ở lại. Dần dần tôi nhận ra mình bắt đầu thích nơi này."],
 ["","有一次，我出去玩儿。回来的时候，我把钱包忘在了出租汽车里。到家以后才发现钱包没了，我非常着急，但是也没有办法。","Yǒu yí cì, wǒ chūqu wánr. Huílai de shíhou, wǒ bǎ qiánbāo wàng zàile chūzū qìchē li. Dào jiā yǐhòu cái fāxiàn qiánbāo méi le, wǒ fēicháng zháojí, dànshì yě méiyǒu bànfǎ.","Có lần tôi ra ngoài chơi. Lúc về tôi để quên ví trên taxi. Về đến nhà mới phát hiện mất ví, tôi rất lo nhưng cũng chẳng có cách nào."],
 ["","没想到，第二天，那个司机到学校找到了我。他还我钱包的时候，我高兴极了。","Méi xiǎngdào, dì-èr tiān, nàge sījī dào xuéxiào zhǎodàole wǒ. Tā huán wǒ qiánbāo de shíhou, wǒ gāoxìng jí le.","Không ngờ hôm sau người tài xế đó đến trường tìm tôi. Khi anh ấy trả ví, tôi vui vô cùng."],
 ["","我问他：“你怎么能找到我？”他说：“是你的学生证帮了我的忙。”我很高兴遇到了一个好人。","Wǒ wèn tā: “Nǐ zěnme néng zhǎodào wǒ?” Tā shuō: “Shì nǐ de xuéshēngzhèng bāngle wǒ de máng.” Wǒ hěn gāoxìng yùdàole yí ge hǎorén.","Tôi hỏi: “Sao anh tìm được tôi?” Anh ấy nói: “Là thẻ sinh viên của cậu giúp tôi đấy.” Tôi rất vui vì gặp được người tốt."],
 ["","一年以后，我开始一边学习，一边打工。我当过翻译，也当过英语老师，我还去过许多地方旅行。","Yì nián yǐhòu, wǒ kāishǐ yìbiān xuéxí, yìbiān dǎ gōng. Wǒ dāngguo fānyì, yě dāngguo Yīngyǔ lǎoshī, wǒ hái qùguo xǔduō dìfang lǚxíng.","Một năm sau tôi bắt đầu vừa học vừa làm thêm. Tôi từng làm phiên dịch, từng dạy tiếng Anh, còn đi du lịch nhiều nơi."],
 ["","但是我觉得这些都不是我想要的，我应该去做更有意义的事情。后来我决定去西北农村当外语老师。","Dànshì wǒ juéde zhèxiē dōu bú shì wǒ xiǎng yào de, wǒ yīnggāi qù zuò gèng yǒu yìyì de shìqing. Hòulái wǒ juédìng qù Xīběi nóngcūn dāng wàiyǔ lǎoshī.","Nhưng tôi thấy đó không phải điều mình muốn, tôi nên làm việc có ý nghĩa hơn. Sau đó tôi quyết định đến nông thôn Tây Bắc làm giáo viên ngoại ngữ."],
 ["","我去的是个穷地方，这里的人们没见过外国人，但是他们对我很热情，也很友好。","Wǒ qù de shì ge qióng dìfang, zhèli de rénmen méi jiànguo wàiguó rén, dànshì tāmen duì wǒ hěn rèqíng, yě hěn yǒuhǎo.","Nơi tôi đến là vùng nghèo, người ở đây chưa từng gặp người nước ngoài, nhưng họ rất nhiệt tình và thân thiện với tôi."],
 ["","去年，当我要离开这里回国的时候，我的学生都哭了……","Qùnián, dāng wǒ yào líkāi zhèli huí guó de shíhou, wǒ de xuésheng dōu kū le……","Năm ngoái, khi tôi sắp rời nơi đây về nước, học trò của tôi đều khóc……"],
 ["","现在我已经是一家大公司的职员了。公司最后选择了我，我想就是因为我有在中国的工作经验和生活经历吧。","Xiànzài wǒ yǐjīng shì yì jiā dà gōngsī de zhíyuán le. Gōngsī zuìhòu xuǎnzéle wǒ, wǒ xiǎng jiù shì yīnwèi wǒ yǒu zài Zhōngguó de gōngzuò jīngyàn hé shēnghuó jīnglì ba.","Giờ tôi đã là nhân viên một công ty lớn. Công ty cuối cùng chọn tôi, tôi nghĩ chính vì tôi có kinh nghiệm làm việc và trải nghiệm sống ở Trung Quốc."]],
 q:[["大学毕业以后，“我”马上工作了吗？","Dàxué bì yè yǐhòu, “wǒ” mǎshàng gōngzuò le ma?","Tốt nghiệp xong “tôi” có đi làm ngay không?","没有，“我”选择了到不熟悉的地方去锻炼。","Không, chọn đến nơi chưa quen để rèn luyện."],["刚开始来中国的时候，“我”过得好吗？","Gāng kāishǐ lái Zhōngguó de shíhou, “wǒ” guò de hǎo ma?","Mới sang Trung Quốc “tôi” sống có tốt không?","不太好，跟中国人交流很困难，遇到了不少麻烦。","Không tốt lắm, giao tiếp khó, gặp nhiều phiền phức."],["“我”的钱包找到了吗？","“Wǒ” de qiánbāo zhǎodào le ma?","Ví của “tôi” có tìm được không?","找到了，司机第二天送到了学校。","Có, tài xế hôm sau mang đến trường."],["“我”做过什么工作？","“Wǒ” zuòguo shénme gōngzuò?","“Tôi” từng làm công việc gì?","当过翻译，也当过英语老师。","Phiên dịch và giáo viên tiếng Anh."],["“我”为什么离开北京去西北工作？","“Wǒ” wèi shénme líkāi Běijīng qù Xīběi gōngzuò?","Vì sao “tôi” rời Bắc Kinh lên Tây Bắc?","因为“我”想去做更有意义的事情。","Vì muốn làm việc có ý nghĩa hơn."],["“我”现在在哪儿工作？","“Wǒ” xiànzài zài nǎr gōngzuò?","Hiện “tôi” làm ở đâu?","在一家大公司工作。","Ở một công ty lớn."]]}
],

{k:["过","没","没有"],t:"V + 过: đã từng (kinh nghiệm)",s:"S + V + 过 + O　|　S + 没(有) + V + 过 + O　|　S + V + 过 + O + 没有？",d:"V + 过 biểu thị động tác/trạng thái đã xảy ra trong quá khứ, nhấn mạnh kinh nghiệm từng có. Phủ định: thêm 没(有) trước động từ (giữ 过). Câu hỏi chính phản: thêm 没有 cuối câu.",n:["Ly hợp: 过 đặt giữa: 见过面, 打过工 (✗见面过).","Không dùng 过 cho thói quen thường xuyên: ✗我每天读过课文。","Phủ định không dùng 不: ✗不见过 → ✓没见过."],ex:["我当过翻译。|Wǒ dāngguo fānyì.|Tôi từng làm phiên dịch.","我去过上海。|Wǒ qùguo Shànghǎi.|Tôi từng đến Thượng Hải.","他们没见过外国人。|Tāmen méi jiànguo wàiguó rén.|Họ chưa từng gặp người nước ngoài.","你看过中国电影没有？|Nǐ kànguo Zhōngguó diànyǐng méiyǒu?|Bạn xem phim Trung Quốc bao giờ chưa?"]},

read:{h:"七、阅读短文 · Đọc hiểu",p:[["我家附近有一个很大的湖。我经常和朋友们去那里玩儿。","Wǒ jiā fùjìn yǒu yí ge hěn dà de hú. Wǒ jīngcháng hé péngyoumen qù nàli wánr.","Gần nhà tôi có một cái hồ rất lớn. Tôi hay cùng bạn bè ra đó chơi."],["有一次，我去游泳的时候在湖边遇到了我现在的女朋友。我以前来这里的时候没有见过她。","Yǒu yí cì, wǒ qù yóu yǒng de shíhou zài hú biān yùdàole wǒ xiànzài de nǚpéngyou. Wǒ yǐqián lái zhèli de shíhou méiyǒu jiànguo tā.","Có lần đi bơi, tôi gặp bạn gái hiện nay ở bờ hồ. Trước đây đến đây tôi chưa gặp cô ấy bao giờ."],["我问：“你从哪儿来？”她见我很友好，就告诉了我她来这儿的原因。","Wǒ wèn: “Nǐ cóng nǎr lái?” Tā jiàn wǒ hěn yǒuhǎo, jiù gàosule wǒ tā lái zhèr de yuányīn.","Tôi hỏi: “Bạn từ đâu đến?” Thấy tôi thân thiện, cô ấy kể lý do đến đây."],["原来，她是外地人，她爸爸的公司搬到了这个城市，所以她们家也搬来了。她离开了以前的家、以前的朋友，心里很难过。","Yuánlái, tā shì wàidì rén, tā bàba de gōngsī bāndàole zhège chéngshì, suǒyǐ tāmen jiā yě bānlai le. Tā líkāile yǐqián de jiā, yǐqián de péngyou, xīnli hěn nánguò.","Hóa ra cô là người nơi khác, công ty bố cô chuyển đến thành phố này nên cả nhà cũng chuyển theo. Cô rời nhà cũ, bạn cũ nên trong lòng rất buồn."],["从那天开始，我就成了她的朋友。","Cóng nà tiān kāishǐ, wǒ jiù chéngle tā de péngyou.","Từ hôm đó tôi trở thành bạn của cô ấy."]],gl:[["原因","yuányīn","nguyên nhân, lý do"],["搬","bān","chuyển (nhà)"],["难过","nánguò","buồn"]]},

  s=String(s||'').toLowerCase().replace(/u:/g,'ü').normalize('NFD').replace(/u\u0308/g,'v');

  for(const ch of s){

    if(/[1-4]/.test(ch)){tones.push(+ch);continue}

  if(player.readyState>=1&&player.src.endsWith(u))go();else{player.addEventListener('loadedmetadata',go,{once:true});player.load()}
  showBar('🎧 Âm thanh sách: '+(title||tr));
}

    return `<div class="it"><div class="zhs">${i+1}. ${s}</div><span class="fb"></span><div class="key">${it.a.map(a=>a.join(' / ')).join(' ; ')}</div></div>`}).join('');

  if(x.type==='match')h+=x.sets.map((s,si)=>`<div class="it" data-si="${si}"><div class="mgrid top ${s.wide?'wide':''}">${s.top.map((c,j)=>`<button data-j="${j}">${esc(c)}</button>`).join('')}</div><div class="mgrid bot ${s.wide?'wide':''}">${s.bot.map((c,j)=>`<button data-j="${j}">${esc(c)}</button>`).join('')}</div><div class="found zhs"></div><span class="fb"></span><div class="key">${s.a.join('、')}</div></div>`).join('');

function bindEx(x,id,L){
  const root=document.getElementById(id);if(!root)return;
  const best=store.get('sc:'+id,null);if(best)root.querySelector('[data-best]').textContent=`Lần tốt nhất: ${best}`;
  const self={};
  root.querySelector('[data-key]').onclick=()=>root.querySelectorAll('.key').forEach(k=>k.classList.toggle('on'));
  root.querySelector('[data-reset]').onclick=()=>{const p=root.parentNode,tmp=document.createElement('div');tmp.innerHTML=exHTML(x,id);p.replaceChild(tmp.firstElementChild,root);bindEx(x,id,L)};
  if(x.type==='order')root.querySelectorAll('.it').forEach(it=>{const built=it.querySelector('.built');
    it.querySelectorAll(':scope > div:first-child .tok').forEach(t=>t.onclick=()=>{t.classList.add('used');const c=t.cloneNode(true);c.classList.remove('used');c.onclick=()=>{t.classList.remove('used');c.remove()};built.appendChild(c)})});
  if(x.type==='match')root.querySelectorAll('.it').forEach(it=>{const s=x.sets[+it.dataset.si];let sel=null;it._found=new Set;it._miss=0;
    it.querySelectorAll('.top button').forEach(b=>b.onclick=()=>{it.querySelectorAll('.top button').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');sel=b});
    it.querySelectorAll('.bot button').forEach(b=>b.onclick=()=>{if(!sel)return;const word=sel.textContent+b.textContent;const fb=it.querySelector('.fb');
      if(s.a.includes(word)&&!it._found.has(word)){it._found.add(word);sel.classList.add('done');b.classList.add('done');sel.classList.remove('sel');sel=null;it.querySelector('.found').textContent=[...it._found].join('、');fb.className='fb good';fb.textContent='✓ '+word;speak(word)}
      else{it._miss++;fb.className='fb bad';fb.textContent='✗ '+word+' không phải từ cần ghép';}})});
  if(x.type==='open')root.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{const i=+b.dataset.chk,it=x.items[i],box=b.closest('.it'),v=box.querySelector('textarea').value,fb=box.querySelector('.fb');
    if(!v.trim()){fb.className='fb bad';fb.textContent='Bạn chưa viết gì.';return}
    if(it.a.some(a=>normZh(a)===normZh(v))){self[i]=1;fb.className='fb good';fb.textContent='✓ Trùng khớp đáp án.';box.querySelector('.selfmark').hidden=true}
    else{fb.className='fb';fb.textContent='So với đáp án gợi ý rồi tự đánh giá:';box.querySelector('.key').classList.add('on');const sm=box.querySelector('.selfmark');sm.hidden=false;sm.querySelectorAll('button').forEach(z=>z.onclick=()=>{self[i]=+z.dataset.sm;sm.querySelectorAll('button').forEach(q=>q.classList.toggle('ok',q===z))})}});
  const touch=()=>{if(!root._t0)root._t0=Date.now()};root.addEventListener('input',touch);root.addEventListener('click',e=>{if(!e.target.closest('[data-grade],[data-key],[data-reset]'))touch()});
  root.querySelector('[data-grade]').onclick=()=>{
    let ok=0,tot=0;
    if(x.type==='pinyin')root.querySelectorAll('.inp').forEach(inp=>{const it=x.items[+inp.dataset.i];tot++;const r=pyCheck(inp.value,it[1]);const fb=inp.parentNode.querySelector('.fb');inp.classList.toggle('right',r==='ok');inp.classList.toggle('wrong',r!=='ok');
      fb.className='fb '+(r==='ok'?'good':'bad');fb.textContent=r==='ok'?'✓':r==='tone'?'Sai thanh điệu → '+it[1]:'✗ '+it[1];if(r==='ok')ok++});
    if(x.type==='colloc')root.querySelectorAll('.inp').forEach(inp=>{const it=x.items[+inp.dataset.i];tot++;const v=normZh(inp.value);const fb=inp.parentNode.querySelector('.fb');
      const good=v&&it[2].some(a=>normZh(a)===v);inp.classList.toggle('right',good);inp.classList.toggle('wrong',!good);
      fb.className='fb '+(good?'good':'bad');fb.textContent=good?'✓':(v?'Chưa có trong đáp án; gợi ý: ':'Gợi ý: ')+it[2].slice(0,3).join(', ');if(good)ok++});
    if(x.type==='fill')x.items.forEach((it,i)=>{const els=root.querySelectorAll(`.blank[data-i="${i}"]`);let all=true;els.forEach(el=>{const k=+el.dataset.k;tot++;const good=(it.a[k]||[]).some(a=>normZh(a)===normZh(el.value));el.classList.toggle('right',good);el.classList.toggle('wrong',!good);if(good)ok++;else all=false});
      const fb=els[0].closest('.it').querySelector('.fb');fb.className='fb '+(all?'good':'bad');fb.textContent=all?'✓':'✗ Đáp án: '+it.a.map(a=>a.join('/')).join(' ; ')});
    if(x.type==='order')root.querySelectorAll('.it').forEach(itEl=>{const it=x.items[+itEl.dataset.i];tot++;const v=[...itEl.querySelectorAll('.built .tok')].map(t=>t.textContent).join('');const good=it.a.some(a=>normZh(a)===normZh(v));
      const fb=itEl.querySelector('.fb');fb.className='fb '+(good?'good':'bad');fb.textContent=good?'✓ '+v:'✗ Đáp án: '+it.a[0];if(good)ok++});
    if(x.type==='open')x.items.forEach((it,i)=>{tot++;if(self[i])ok++});
    if(x.type==='match')root.querySelectorAll('.it').forEach(itEl=>{const s=x.sets[+itEl.dataset.si];tot+=s.a.length;ok+=itEl._found.size;const fb=itEl.querySelector('.fb');if(itEl._found.size<s.a.length){fb.className='fb bad';fb.textContent=`Còn ${s.a.length-itEl._found.size} từ chưa ghép · sai ${itEl._miss} lần`}});
    const sc=`${ok}/${tot}`;root.querySelector('.score').textContent=(x.type==='open'?'Tự chấm: ':'Điểm: ')+sc+(ok===tot?' 🎉':'');
    const sec=root._t0?(Date.now()-root._t0)/1000:0;root._t0=null;if(tot)logRes(id,{L:L.no,k:id[0]==='s'?'SGK':'BT',h:x.h},ok,tot,sec);
    const prev=store.get('sc:'+id,null);if(!prev||ok/tot>=eval(prev)){store.set('sc:'+id,sc);root.querySelector('[data-best]').textContent='Lần tốt nhất: '+sc}
  };
}

function linesPool(Ls){return Ls.flatMap(L=>[...L.texts.flatMap(t=>t.lines.map(l=>({hz:l[1],py:l[2],vi:l[3]}))),...L.notes.flatMap(n=>n.ex.map(e=>{const [hz,py,vi]=e.split('|');return {hz,py,vi}}))])}
function startQuiz(type){
  const Ls=qL==='all'?LESSONS:[getL(+qL.slice(1))];const ws=W.filter(w=>Ls.some(L=>L.no===w.L));const N=10;let qs=[];
  const wOpts=(w,f)=>shuffle([w,...pick(W.filter(x=>x.id!==w.id&&f(x)!==f(w)),3)]);
  if(type==='mean')qs=pick(ws,N).map(w=>({p:`<div class="big">${esc(w.hz)}</div><div class="mute">${esc(w.py)}</div>`,say:w.hz,o:wOpts(w,x=>x.vi).map(x=>x.vi),a:w.vi}));
  if(type==='hanzi')qs=pick(ws,N).map(w=>({p:`<div class="qp">${esc(w.vi)}</div>`,o:wOpts(w,x=>x.hz).map(x=>x.hz),a:w.hz,zh:1,sayA:1}));
  if(type==='pinyin')qs=pick(ws,N).map(w=>({p:`<div class="big">${esc(w.hz)}</div>`,o:wOpts(w,x=>x.py).map(x=>x.py),a:w.py,sayA:w.hz}));
  if(type==='listen')qs=pick(ws.filter(w=>wordCue(w)),N).map(w=>({p:`<button class="btn pri" data-cue="${wordCue(w)}" data-text="${esc(w.hz)}" style="font-size:1.6rem;padding:.7rem 1.6rem">🎧 Nghe lại</button>`,cue:wordCue(w),o:wOpts(w,x=>x.hz).map(x=>x.hz),a:w.hz,zh:1}));
  if(type==='fill')qs=pick(ws,N).map(w=>{const e=w.ex.find(e=>e[0].includes(w.hz))||w.ex[0];return {p:`<div class="qp zh">${zh(e[0].replace(w.hz,'＿＿'))}</div><div class="mute sm">${esc(e[2])}</div>`,o:wOpts(w,x=>x.hz).map(x=>x.hz),a:w.hz,zh:1,sayA:e[0]}});
  if(type==='gram')qs=pick(Ls.flatMap(L=>L.gex),N).map(g=>{const [h,p,v]=g.q.split('|');return {p:`<div class="qp zh">${zh(h)}</div><div class="mute sm">${esc(v)}</div>`,o:shuffle(g.o),a:g.o[g.a],zh:1,e:g.e,sayA:h.replace('___',g.o[g.a])}});
  if(type==='order')qs=pick(Ls.flatMap(L=>L.ord),N).map(s=>({order:s.split('/'),a:s.replace(/\//g,'')}));
  if(type==='zhvi'){const P=linesPool(Ls);qs=pick(P,N).map(l=>({p:`<div class="qp zh">${zh(l.hz)}</div>`,say:l.hz,o:shuffle([l.vi,...pick(P.filter(x=>x.vi!==l.vi),3).map(x=>x.vi)]),a:l.vi}))}
  if(type==='vizh'){const P=linesPool(Ls);qs=pick(P,N).map(l=>({p:`<div class="qp">${esc(l.vi)}</div>`,o:shuffle([l.hz,...pick(P.filter(x=>x.hz!==l.hz),3).map(x=>x.hz)]),a:l.hz,zh:1,sayA:l.hz}))}
  qz={type,qs,i:0,ok:0,t0:Date.now()};drawQ();
}
function drawQ(){
  const q=qz.qs[qz.i];const name=QT.find(t=>t[0]===qz.type)[1];
  if(!q){const sc=`${qz.ok}/${qz.qs.length}`;if(!qz.logged){qz.logged=1;logRes('q'+qL+'_'+qz.type,{L:qL==='all'?0:+qL.slice(1),k:'LT',h:name},qz.ok,qz.qs.length,(Date.now()-qz.t0)/1000)}const k='q:'+qL+':'+qz.type,prev=store.get(k,null);if(!prev||qz.ok/qz.qs.length>=eval(prev))store.set(k,sc);
    $('#main').innerHTML=`<div class="card qcard"><div style="font-size:44px">${qz.ok===qz.qs.length?'🎉':'💪'}</div><h2>${name}: ${sc}</h2><div class="row" style="justify-content:center"><button class="btn pri" id="qa">Làm lại</button><button class="btn" id="qb">Chọn dạng khác</button></div></div>`;
    $('#qa').onclick=()=>startQuiz(qz.type);$('#qb').onclick=renderQuiz;return}
  let inner;
  if(q.order){const toks=shuffle(q.order.map((t,j)=>({t,j})));inner=`<div class="mute">Sắp xếp thành câu đúng</div><div style="margin-top:10px">${toks.map(o=>`<span class="tok" data-j="${o.j}">${esc(o.t)}</span>`).join('')}</div><div class="built"></div><div class="row" style="justify-content:center"><button class="btn pri" id="qchk">Kiểm tra</button><button class="btn" id="qclr">Xóa</button></div><div class="fb" id="qfb"></div>`}
  else inner=`${q.p}<div class="opts">${q.o.map((o,j)=>`<button class="opt ${q.zh?'zh':''}" data-o="${j}">${q.zh?zh(o):esc(o)}</button>`).join('')}</div><div class="fb" id="qfb"></div>`;
  $('#main').innerHTML=`<div class="row qhead"><button class="btn" id="qback">← Thoát</button><b>${name}</b><span>Câu ${qz.i+1}/${qz.qs.length} · đúng ${qz.ok}</span></div><div class="prog"><div style="width:${qz.i/qz.qs.length*100}%"></div></div><div class="card qcard">${inner}</div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" id="qnext" hidden>Tiếp →</button></div>`;
  $('#qback').onclick=renderQuiz;const next=()=>{qz.i++;drawQ()};$('#qnext').onclick=next;
  if(q.cue)setTimeout(()=>{const [tr,i]=q.cue.split('|');playCue(tr,+i,'Nghe và chọn từ đúng')},250);
  const done=(good)=>{if(good)qz.ok++;$('#qnext').hidden=false;if(q.sayA)speak(q.sayA===1?q.a:q.sayA)};
  if(q.order){const built=$('.qcard .built');$$('.qcard > div:nth-child(2) .tok').forEach(t=>t.onclick=()=>{t.classList.add('used');const c=t.cloneNode(true);c.classList.remove('used');c.onclick=()=>{t.classList.remove('used');c.remove()};built.appendChild(c)});
    $('#qclr').onclick=()=>{built.innerHTML='';$$('.tok.used').forEach(t=>t.classList.remove('used'))};
    $('#qchk').onclick=()=>{const v=[...built.querySelectorAll('.tok')].map(t=>t.textContent).join('');const good=normZh(v)===normZh(q.a);$('#qfb').className='fb '+(good?'good':'bad');$('#qfb').textContent=good?'✓ '+q.a:'✗ Đáp án: '+q.a;$('#qchk').disabled=true;speak(q.a);if(good)qz.ok++;$('#qnext').hidden=false};return}
  $$('.opt').forEach(b=>b.onclick=()=>{const v=q.o[+b.dataset.o],good=v===q.a;$$('.opt').forEach(z=>{z.disabled=true;if(q.o[+z.dataset.o]===q.a)z.classList.add('right')});if(!good)b.classList.add('wrong');
    $('#qfb').className='fb '+(good?'good':'bad');$('#qfb').textContent=(good?'✓ Chính xác':'✗ Chưa đúng')+(q.e?' — '+q.e:'');done(good)});
}


// ================== NỘP KẾT QUẢ ==================
const REPORT_SALT='TH2-PhuongDong';
function hash32(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36)}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const fmtSec=s=>{s=Math.round(s||0);const m=Math.floor(s/60);return m?`${m} phút`:`${s} giây`};
const fmtDate=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`};
function buildReport(name,cls,sid){
  const at=Date.now();
  const lessons=(HAS_REV?[...LESSONS,REVIEW]:LESSONS).map(L=>{const ids=Object.keys(LOG).filter(k=>LOG[k].L===L.no);
    const agg=k=>{const r=ids.filter(i=>LOG[i].k===k).map(i=>LOG[i]);return {ok:r.reduce((a,x)=>a+x.best,0),tot:r.reduce((a,x)=>a+x.tot,0),done:r.length,sec:r.reduce((a,x)=>a+x.sec,0),att:r.reduce((a,x)=>a+x.att,0)}};
    return {L:L.no,sgk:Object.assign(agg('SGK'),{all:L.ex.length}),bt:Object.assign(agg('BT'),{all:L.wb.length}),lt:Object.assign(agg('LT'),{all:QT.length}),kn:L.words.filter(w=>known.has(w.id)).length,nw:L.words.length}});
  const items=Object.entries(LOG).map(([id,r])=>[id,r.L,r.k,String(r.h||'').slice(0,60),r.best,r.tot,r.att,r.sec,r.last]);
  const data={v:1,app:'TH2',name,cls,sid,at,lessons,items};
  const json=JSON.stringify(data);const code='TH2R1.'+b64e(json)+'.'+hash32(REPORT_SALT+json);
  const lines=[`📤 BÁO CÁO KẾT QUẢ · TỔNG HỢP 2`,`Họ tên: ${name}`,`Lớp: ${cls}${sid?` · MSSV: ${sid}`:''}`,`Nộp lúc: ${fmtDate(at)}`,''];
  lessons.forEach(l=>{const any=l.sgk.done+l.bt.done+l.lt.done;if(!any&&!l.kn)return;
    const part=(n,x)=>x.done?`${n} ${x.ok}/${x.tot} (${x.done}/${x.all} bài)`:`${n} chưa làm`;
    lines.push(`${l.L===31?'Tổng ôn':'Bài '+l.L}: ${part('SGK',l.sgk)} · ${part('Bổ trợ',l.bt)} · ${l.lt.done?`Luyện tập ${l.lt.done} lượt`:'Luyện tập chưa làm'} · ${fmtSec(l.sgk.sec+l.bt.sec+l.lt.sec)} · nhớ ${l.kn}/${l.nw} từ`)});
  if(lines.length===5)lines.push('(Chưa làm bài nào)');
  lines.push('','Mã nộp bài (cô dán vào Bảng theo dõi lớp):',code);
  return {text:lines.join('\n'),code,fname:`${name}_${cls}_TongHop2.txt`.replace(/[\\/:*?"<>|\s]+/g,'_')};
}
function openReport(){
  const me=store.get('me',{name:'',cls:'',sid:''});
  $('#sheet').innerHTML=`<button class="x" onclick="closeOv()">×</button><h2 style="margin-top:0">📤 Nộp kết quả</h2>
   <div class="sm">Nhập thông tin rồi bấm <b>Tạo báo cáo</b>. Sau đó gửi cho giáo viên qua Zalo, Messenger hoặc email.</div>
   <div class="row" style="margin-top:10px"><input type="text" id="rName" placeholder="Họ và tên" value="${esc(me.name)}" style="flex:2;min-width:12rem"><input type="text" id="rCls" placeholder="Lớp" value="${esc(me.cls)}" style="flex:1;min-width:7rem"><input type="text" id="rSid" placeholder="Mã SV (nếu có)" value="${esc(me.sid)}" style="flex:1;min-width:7rem"></div>
   <div class="row" style="margin-top:10px"><button class="btn pri" id="rMake">Tạo báo cáo</button></div><div id="rOut"></div>`;
  $('#ov').hidden=false;
  $('#rMake').onclick=()=>{const name=$('#rName').value.trim(),cls=$('#rCls').value.trim(),sid=$('#rSid').value.trim();
    if(!name||!cls){$('#rOut').innerHTML='<div class="fb bad">Bạn cần nhập họ tên và lớp.</div>';return}
    store.set('me',{name,cls,sid});const R=buildReport(name,cls,sid);
    $('#rOut').innerHTML=`<textarea id="rText" readonly style="min-height:14rem;font-size:.85rem;margin-top:10px">${esc(R.text)}</textarea>
     <div class="row" style="margin-top:8px"><button class="btn pri" id="rCopy">📋 Sao chép (dán vào Zalo/Messenger)</button><button class="btn" id="rFile">💾 Tải file .txt</button>${navigator.share?'<button class="btn" id="rShare">📲 Chia sẻ</button>':''}<button class="btn" id="rMail">✉️ Gửi email</button></div>
     <div class="sm" id="rMsg" style="margin-top:6px">Gửi nguyên cả đoạn trên, kể cả dòng mã cuối cùng. Không sửa nội dung, nếu sửa mã sẽ bị báo lỗi.</div>`;
    $('#rCopy').onclick=async()=>{try{await navigator.clipboard.writeText(R.text);$('#rMsg').textContent='✓ Đã sao chép. Mở Zalo/Messenger và dán (Ctrl+V hoặc giữ ngón tay → Dán).'}catch(e){$('#rText').select();document.execCommand('copy');$('#rMsg').textContent='✓ Đã sao chép.'}};
    $('#rFile').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+R.text],{type:'text/plain;charset=utf-8'}));a.download=R.fname;a.click();$('#rMsg').textContent='✓ Đã tải file '+R.fname+'. Gửi file này cho giáo viên.'};
    if($('#rShare'))$('#rShare').onclick=async()=>{try{const f=new File(['﻿'+R.text],R.fname,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Báo cáo Tổng hợp 2',text:R.text.split('\n').slice(0,4).join('\n')});else await navigator.share({title:'Báo cáo Tổng hợp 2',text:R.text})}catch(e){}};
    $('#rMail').onclick=()=>{location.href='mailto:?subject='+encodeURIComponent('Báo cáo Tổng hợp 2 - '+name+' - '+cls)+'&body='+encodeURIComponent(R.text)};
  };
}
$('#tgR').onclick=openReport;
// ================== KIỂM TRA THƯ MỤC ÂM THANH ==================
let AUDIO_OK=null;
function audioCheck(){const tr=Object.keys(typeof AUDIO!=='undefined'?AUDIO:{})[0];if(!tr)return;const a=new Audio();a.preload='metadata';
  const done=ok=>{if(AUDIO_OK!==null)return;AUDIO_OK=ok;if(!ok)Object.keys(AUDIO).forEach(k=>fileFail[k]=1);const b=$('#abanner');if(!b)return;b.hidden=false;
    b.className='abanner '+(ok?'ok':'bad');b.innerHTML=ok?'🎧 Đã kết nối âm thanh gốc của sách.':
    '⚠️ <b>Không tìm thấy thư mục <code>audio</code> nằm cạnh file này</b>, nên chưa nghe được. Hãy giải nén cả gói zip rồi mở <b>TongHop2.html</b> nằm trong thư mục <b>TongHop2</b> (bên cạnh phải có thư mục <b>audio</b>). Đừng mở file khi còn đang xem trong file zip.';
    if(ok)setTimeout(()=>{b.hidden=true},6000)};
  a.addEventListener('loadedmetadata',()=>done(true));a.addEventListener('error',()=>done(false));setTimeout(()=>done(false),6000);a.src='audio/'+tr+'.mp3';a.load()}
// ================== KHỞI ĐỘNG ==================
const h=(location.hash||'').slice(1);go(['lesson','vocab','flash','grammar','quiz','wb'].includes(h)?h:'lesson');
audioCheck();

document.addEventListener('input',e=>{const t=e.target;if(t.matches&&t.matches('input.blank')){t.style.width=Math.min(14,Math.max(6.5,[...t.value].length*1.15+1.5))+'em'}});

</script>
